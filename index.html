<style>
:root {
  --background: #fffbeb;
  --surface: #fffdf5;
  --card: #fff8dc;
  --foreground: #44200a;
  --muted-foreground: #94643d;
  --primary: #d97706;
  --primary-dark: #b45309;
  --secondary: #fde68a;
  --muted: #fef3c7;
  --accent: #06b6d4;
  --accent-soft: #cffafe;
  --coral: #ef806f;
  --green: #65a30d;

* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Nunito", sans-serif; }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(6,182,212,.32); outline-offset: 2px; }
.app-shell { min-height: 100vh; display: flex; }
.sidebar { width: 248px; height: 100vh; position: fixed; inset: 0 auto 0 0; padding: 26px 18px 20px; background: rgba(255,253,245,.96); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 28px; }
.brand-mark { width: 39px; height: 39px; border-radius: 12px; background: var(--primary); position: relative; overflow: hidden; box-shadow: 0 5px 12px rgba(217,119,6,.25); }
.brand-mark:before { content: ""; width: 17px; height: 27px; background: #fff7ed; border-radius: 10px 10px 3px 3px; position: absolute; left: 11px; top: 8px; }
.brand-mark:after { content: ""; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; position: absolute; left: 15px; top: 13px; }
.brand strong { display: block; font-size:20.8px; line-height: 1.1; }
.brand small { display: block; color: var(--muted-foreground); font-size:12.3px; margin-top: 4px; letter-spacing: .02em; }
nav { display: grid; gap: 6px; }
nav button { border: 0; background: transparent; min-height: 46px; padding: 0 13px; display: flex; align-items: center; gap: 12px; border-radius: 12px; color: var(--muted-foreground); font-weight: 700; text-align: left; transition: .2s; }
nav button:hover { background: var(--card); color: var(--primary-dark); transform: translateX(2px); }
nav button.active { background: var(--muted); color: var(--primary-dark); box-shadow: inset 3px 0 var(--primary); }
nav button em { margin-left: auto; font-style: normal; width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--coral); font-size:14.3px; }
.journey { margin: auto 0 16px; padding: 16px; border: 1px solid var(--border); background: var(--card); border-radius: 15px; }
.journey-top { display: flex; justify-content: space-between; font-size:14.3px; font-weight: 800; }
.journey-top b { color: var(--primary); }
.journey-track, .flash-progress i, .quiz-progress i, .game-progress i { display: block; height: 6px; background: #f7dfb4; border-radius: 10px; overflow: hidden; margin: 9px 0 7px; }
.journey-track i { display: block; height: 100%; width: 23%; background: var(--primary); border-radius: inherit; }
.journey p { margin: 0; font-size:13px; color: var(--muted-foreground); }
.streak { display: flex; gap: 9px; align-items: center; padding-top: 14px; margin-top: 13px; border-top: 1px dashed var(--border); color: var(--primary); }
.streak div { display: grid; }
.streak b { font-size:16.9px; }
.streak span { color: var(--muted-foreground); font-size:11.7px; }
.profile { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 8px; text-align: left; }
.profile > span:nth-child(2) { display: grid; flex: 1; }
.profile b { font-size:15.6px; }
.profile small { font-size:13px; color: var(--muted-foreground); }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--accent); font-weight: 800; font-size:14.3px; }
main { margin-left: 248px; width: calc(100% - 248px); min-width: 0; }
header { height: 88px; padding: 0 34px; background: rgba(255,253,245,.78); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }

.header-actions { display: flex; align-items: center; gap: 11px; }

.search input { width: 165px; border: 0; outline: 0; color: var(--foreground); background: transparent; font-size:14.3px; }
.search.large { width: 260px; }

.chart-grid { display: grid; grid-template-columns: 1.65fr 1fr; gap: 16px; margin-top: 16px; }

.bar-chart{height:115px;display:flex;align-items:end;justify-content:space-between;gap:9px;padding-top:18px}.bar-chart div{height:100%;flex:1;display:flex;align-items:center;flex-direction:column;justify-content:end;gap:5px}.bar-chart span{display:block;width:100%;max-width:19px;border-radius:5px 5px 2px 2px;background:#f1d59e}.bar-chart span.today{background:var(--primary)}.bar-chart small{font-size:11px;color:var(--muted-foreground)}
.section-heading { display:flex;align-items:flex-end;justify-content:space-between;margin:5px 0 24px; }.section-heading h2{font-size:28px;margin:5px 0}.section-heading p{font-size:14.3px;color:var(--muted-foreground);margin:0}.section-heading.centered{text-align:center;justify-content:center}.day-progress{width:100px;height:66px;border:1px solid var(--border);border-radius:14px;background:var(--surface);display:grid;place-items:center;align-content:center}.day-progress b{font-size:18px;color:var(--primary)}.day-progress span{font-size:11px;color:var(--muted-foreground)}

html{-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font-family:inherit}
select{font:inherit;font-size:13px;border:1px solid var(--border);background:white;border-radius:10px;padding:8px 10px;color:var(--foreground);max-width:100%}
.ghost{border:1px solid var(--border);background:white;color:var(--primary-dark);padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{background:var(--muted)}
.ghost.on{background:var(--green-soft);border-color:#b9da83;color:var(--green)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-8px 0 18px}
.toolbar label{font-size:12px;color:var(--muted-foreground);font-weight:700;display:flex;align-items:center;gap:7px}
.empty{padding:28px;text-align:center;color:var(--muted-foreground);font-size:13px;line-height:1.7}
.empty b{color:var(--foreground)}
.note{margin:10px 0 0;font-size:12px;color:var(--muted-foreground)}
.profile{width:100%;cursor:pointer}
.reset-link{border:0;background:transparent;color:var(--muted-foreground);font-size:11px;text-decoration:underline;margin:2px 0 0 8px;padding:4px;text-align:left}
.lesson-list button.done>span{color:var(--green)}
.lesson-list button svg{color:var(--muted-foreground)}
.lesson-list button.done svg{color:var(--green)}
.reading-text mark{cursor:pointer}
.reading-text mark:hover{background:linear-gradient(transparent 40%,#fcd34d 40%)}
.word-pop{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f0fbfd;border-left:3px solid var(--accent);font-size:13px;line-height:1.6}
.word-pop small{color:var(--muted-foreground)}
.reading-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.mini-word .dotst{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:#f1d8c0}
.mini-word .dotst.known{background:var(--green)}.mini-word .dotst.learning{background:var(--primary)}.mini-word .dotst.due{background:var(--coral)}
.word-table .rows{max-height:68vh;overflow:auto}
.word-table .rows>button{display:grid;grid-template-columns:1.25fr 1fr 85px 18px;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid #f8e9d1;background:transparent;padding:13px 16px;text-align:left}
.word-table .rows>button:hover,.word-table .rows>button.selected{background:#fff8df}
.word-table .rows>button>div:nth-child(2){display:grid}
.word-table .rows>button>div:nth-child(2) small{font-size:11px;color:var(--muted-foreground)}
.word-table .rows>button>div:nth-child(2)>span{font-size:13px}
.word-main small{display:block}
.status.learning{background:var(--muted);color:var(--primary-dark)}
.detail-actions{display:flex;gap:8px;margin-top:14px}
.detail-actions button{flex:1;border:1px solid;border-radius:10px;background:white;padding:9px;font-weight:800;font-size:12px}
.detail-actions .again{color:#be5147;border-color:#f2bcb7}.detail-actions .remember{color:var(--green);border-color:#b9da83}
.chip-day{display:inline-block;background:var(--muted);color:var(--primary-dark);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;margin-left:6px}
.date-pill{width:66px!important}
.flash-face .ex{font-family:Georgia,serif;font-style:italic}
.flash-face .ex b{color:var(--primary-dark)}
.flash-face .tag{font-size:12px;color:var(--muted-foreground)}
.result-card{max-width:560px;margin:10px auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:30px;text-align:center}
.result-card h2{margin:6px 0 4px;font-size:26px}
.result-card .big{font-size:54px;font-weight:800;color:var(--primary);line-height:1.1}
.result-card p{color:var(--muted-foreground);font-size:13px;line-height:1.6}
.result-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.wrong-list{text-align:left;margin:14px 0 0;padding:12px 14px;background:#fff0ed;border-radius:12px;font-size:13px}
.wrong-list li{margin:4px 0}
.letter-grid{grid-template-columns:repeat(var(--n,8),var(--cell,34px))!important}
.letter-grid button{width:var(--cell,34px)!important;height:var(--cell,34px)!important;font-size:calc(var(--cell,34px)*.42)!important;padding:0;user-select:none}
.letter-grid button.start{background:#06b6d4;color:white}
.find-list>span{font-size:12px!important;align-items:center;flex-wrap:wrap}
.find-list>span small{font-weight:600;color:var(--muted-foreground);text-decoration:none;display:inline-block}
.find-list>span.done small{color:var(--green)}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:11px 22px;max-width:680px;margin:26px auto}
.match-cols button{min-height:58px;border-radius:12px;border:1px solid var(--border);background:white;font-weight:800;font-size:14px;padding:8px 12px}
.match-cols .en{border-left:4px solid var(--primary)}.match-cols .vi{border-left:4px solid var(--accent)}
.match-cols button.picked{background:var(--muted);border-color:var(--primary)}
.match-cols button.matched{background:var(--green-soft);border-color:var(--green);color:var(--green);opacity:.75;cursor:default}
.match-cols button.wrong{background:#fff0ed;border-color:var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sentence{font-family:Georgia,serif;font-size:16px;line-height:1.8;background:var(--card);border-radius:12px;padding:12px 14px;margin:-8px 0 18px}
.explanation p{margin:2px 0!important}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--foreground);color:white;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panel-title button.on{background:var(--muted);border-color:var(--primary)}
.bar-chart span{min-height:3px}
.dot.learning{background:var(--accent)}
.donut{background:var(--donut,#f1d8c0)}
.review-item>button{cursor:pointer}
.stat-card p{font-size:12px!important}
.hero-done{font-size:13px;margin:0 0 18px;color:var(--muted-foreground)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.letter-grid{--cell:26px}.match-cols{gap:9px}.keyboard button{width:30px;height:42px}.keyboard button.wide{width:50px}.wordle-grid{margin:16px 0}}
@media (max-width:520px){.letter-grid{--cell:23px}}
.hidden{display:none!important}

.sidebar{transition:transform .25s ease,visibility 0s}
main{transition:margin-left .25s ease,width .25s ease}
.sb-collapsed .sidebar{transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sb-collapsed main{margin-left:0;width:100%}
.brand{position:relative}
.sb-close{margin-left:auto;flex:none;width:30px;height:30px;border:1px solid var(--border);background:white;border-radius:9px;display:grid;place-items:center;color:var(--muted-foreground)}
.sb-close:hover{background:var(--muted);color:var(--primary-dark)}
.hleft{display:flex;align-items:center;gap:14px;min-width:0}
.menu-btn{display:none}
.sb-collapsed .menu-btn{display:grid}
@media (max-width:760px){.menu-btn{display:grid}.sb-close{display:none}}

.cw-start{text-align:center;max-width:780px;margin:0 auto;position:relative}
.cw-start h3{font-size:26px;margin:6px 0}
.cw-start>p{font-size:14px;color:var(--muted-foreground);line-height:1.7;max-width:580px;margin:0 auto 18px}
.cw-ach{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.cw-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted-foreground)}
.cw-chip b{color:var(--primary-dark)}
.cw-coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff3c4,#fbbf24 45%,#b45309);display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;flex:none}
.cw-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted-foreground);margin:6px 0 12px}
.cw-scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left}
.cw-scope{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:15px;display:grid;gap:3px;text-align:left;transition:.15s}
.cw-scope:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px);background:#fff8df}
.cw-scope:disabled{opacity:.5;cursor:not-allowed}
.cw-scope b{font-size:17px;color:var(--primary-dark)}
.cw-scope span{font-size:12px;color:var(--muted-foreground)}
.cw-scope em{font-style:normal;font-size:11px;color:#0e7490;font-weight:800}
.cw-hist{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-height:44vh;overflow:auto;text-align:left;margin:0 0 20px}
.cw-sess{border-bottom:1px solid #f8e9d1}
.cw-sess summary{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;font-size:13px}
.cw-sess summary b{color:var(--primary-dark)}
.cw-sess summary span{color:var(--green);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.cw-sess summary span+span{color:var(--primary-dark)}
.cw-sess summary small{color:var(--muted-foreground);font-size:11px}
.cw-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cw-field{position:relative;height:clamp(460px,66vh,600px);border-radius:20px;overflow:hidden;border:1px solid #f3cd78;background:linear-gradient(180deg,#fff7d6 0%,#fde6a6 62%,#f7c86f 100%);box-shadow:var(--shadow)}
.cw-field:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-80px;height:160px;border-radius:50% 50% 0 0;background:#e9ab45;opacity:.55;pointer-events:none}
.cw-field:after{content:"";position:absolute;left:30%;right:-20%;bottom:-70px;height:120px;border-radius:50% 50% 0 0;background:#d68624;opacity:.45;pointer-events:none}
.cw-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--primary-dark);opacity:.8;z-index:2;pointer-events:none;font-weight:700}
.cw-word{position:absolute;top:-60px;transform:translateX(-50%);font-family:inherit;font-weight:800;font-size:19px;color:var(--primary-dark);background:#fffdf5;border:2px solid var(--primary);padding:9px 18px;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px rgba(180,83,9,.2);user-select:none;animation:cwfall linear forwards;z-index:6;touch-action:manipulation;white-space:nowrap}
.cw-word:before,.cw-nugget:before{content:"";position:absolute;inset:-14px}
.cw-word:hover{background:#fff3c4}
.cw-word.caught{animation:none!important;transition:.25s;transform:translateX(-50%) scale(1.3);opacity:0;pointer-events:none}
@keyframes cwfall{from{top:-60px}to{top:105%}}
.cw-nugget{position:absolute;top:-40px;width:40px;height:40px;transform:translateX(-50%);border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fff3c4 0%,#fbbf24 42%,#b45309 100%);box-shadow:0 0 0 2px rgba(255,255,255,.4) inset,0 6px 16px rgba(217,119,6,.45);animation:cwspin linear forwards;z-index:6;touch-action:manipulation}
.cw-nugget:after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;color:rgba(120,53,15,.75)}
@keyframes cwspin{from{top:-40px;transform:translateX(-50%) rotate(0)}to{top:105%;transform:translateX(-50%) rotate(360deg)}}
.cw-nugget.caught{animation:none!important;transition:.3s;transform:translateX(-50%) scale(1.6);opacity:0;pointer-events:none}
.cw-pop{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:18px;color:var(--primary-dark);pointer-events:none;z-index:15;animation:cwpop .9s ease forwards;display:flex;gap:5px;align-items:center;text-shadow:0 1px 0 #fff}
@keyframes cwpop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.cw-level{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--accent);color:white;font-weight:800;font-size:14px;padding:7px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:25;pointer-events:none;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cw-level.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cw-quizov{position:absolute;inset:0;background:rgba(68,32,10,.38);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:40;padding:14px;overflow:auto}
.cw-quiz{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:430px;width:100%;box-shadow:0 20px 50px rgba(68,32,10,.3);animation:cwin .25s ease}
@keyframes cwin{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.cw-qword{font-size:32px;font-weight:800;color:var(--primary-dark);text-align:center;margin:0;word-break:break-word}
.cw-qph{text-align:center;color:var(--muted-foreground);font-size:13px;margin:2px 0 12px;display:flex;gap:7px;justify-content:center;align-items:center}
.cw-snd{border:0;background:var(--accent-soft);color:#0891b2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cw-timer{height:10px;border-radius:999px;background:#f5e3c7;overflow:hidden;margin:0 0 14px}
.cw-timer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:inherit}
.cw-timer i.run{transition:width 10s linear,background-color 10s linear;width:0;background:var(--coral)}
.cw-opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--border);background:white;border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:700;line-height:1.35}
.cw-opt>span{width:26px;height:26px;border-radius:7px;background:var(--card);display:grid;place-items:center;color:var(--primary);font-size:12px;flex:none}
.cw-opt:hover:not(:disabled){border-color:var(--primary);background:#fff8df}
.cw-opt:disabled{cursor:default}
.cw-opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.cw-opt.wrong{border-color:var(--coral);background:#fff0ed;color:#b84940;animation:shake .3s}
.cw-fb{text-align:center;font-size:13px;color:var(--muted-foreground);min-height:18px;margin-top:6px;font-weight:700;display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap}
.cw-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-height:44vh;overflow:auto;text-align:left;margin:0 0 18px}
.cw-row{display:grid;grid-template-columns:minmax(90px,1fr) minmax(120px,2fr) auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #f8e9d1;font-size:13px}
.cw-row:last-child{border-bottom:0}
.cw-row .sw{font-weight:800;color:var(--primary-dark)}
.cw-row .sc{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}.badge.no{background:#fff0ed;color:#c2413b}
.cw-sum .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cw-burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cw-bi{position:absolute;bottom:8%;left:50%;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff3c4,#fbbf24 45%,#b45309);box-shadow:0 6px 14px rgba(217,119,6,.45);opacity:0;animation:cwburst var(--dur,1.4s) cubic-bezier(.17,.67,.3,1) var(--delay,0s) forwards}
@keyframes cwburst{0%{transform:translate(-50%,0) rotate(0) scale(.5);opacity:0}10%{opacity:1}45%{transform:translate(calc(-50% + var(--dx)*.5),var(--peak)) rotate(540deg) scale(1.15);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),60px) rotate(1080deg) scale(.75);opacity:0}}
@media (prefers-reduced-motion:reduce){.cw-word{animation-duration:12s!important}.cw-nugget{animation-duration:10s!important}.cw-bi{display:none}}
@media (max-width:560px){.cw-row{grid-template-columns:1fr 1fr;row-gap:2px}.cw-sess summary{grid-template-columns:1fr auto}}
.brand{gap:9px}.brand strong{white-space:nowrap}.brand>div:nth-child(2){min-width:0}
.cw-field{height:clamp(400px,56vh,520px)}
.game-shell{padding:18px}

.reading-vocab{position:sticky;top:104px;max-height:calc(100vh - 124px);overflow:auto}
.reading-text mark.active{background:linear-gradient(transparent 20%,#f59e0b 20%);color:#fff;border-radius:3px}
.mini-word{border-radius:12px;transition:background .2s,box-shadow .2s;cursor:pointer;padding:10px 8px;margin:0 -6px}

@keyframes mwpop{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.mini-word .mw-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:12.5px;line-height:1.5;color:var(--foreground)}

.table-head,.word-table .rows>button{grid-template-columns:1.25fr 1fr 85px 64px!important}
.table-head span:last-child{text-align:center}
.word-number{min-width:26px;font-variant-numeric:tabular-nums}
.memchk{justify-self:center;width:28px;height:28px;border-radius:8px;border:2px solid #e7c98f;background:white;color:transparent;display:grid;place-items:center;transition:.15s;cursor:pointer}
.memchk:hover{border-color:var(--green);color:#b9da83}
.memchk.on{background:var(--green);border-color:var(--green);color:white}
@media (max-width:760px){.table-head,.word-table .rows>button{grid-template-columns:1.2fr 1fr 70px 52px!important}.table-head span:nth-child(3),.word-table .rows>button>.status{display:none}.table-head,.word-table .rows>button{grid-template-columns:1.3fr 1fr 52px!important}.table-head span:nth-child(3){display:none}}

.rd-bar{margin:-10px 0 14px}
.rd-bar .ghost:disabled{opacity:.4;cursor:not-allowed}
.reader-layout{transition:grid-template-columns .25s ease}
.reader-layout.collapsed{grid-template-columns:minmax(0,1fr) 340px}

.reader-layout.collapsed .reading-card{padding:30px 38px}

@media (max-width:1100px){.reader-layout.collapsed{grid-template-columns:1fr}.reader-layout.collapsed .reading-vocab{grid-column:1}}

.letter-grid{touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.letter-grid button{touch-action:none;transition:background .08s}
.letter-grid button.sel{background:#8fe3ee!important;color:#0b3b45!important;border-color:#5cc9d8!important;transform:scale(1.06)}
.letter-grid button.found.sel{background:#8fe3ee!important}

.letter-grid button.found{color:#4a3520!important;border-color:rgba(255,255,255,.55)}
.find-list>span.done{color:#4a3520!important;box-shadow:0 0 0 1px rgba(74,53,32,.08) inset}
.find-list>span.done svg{color:#4a3520}
.letter-grid button.sel{background:#f6f0e2!important;color:#3b2d0c!important;border-color:#e0b24a!important}

.reading-card{position:relative}
.tk{cursor:pointer;border-radius:3px;transition:background .12s}
.tk:hover{background:#d9f4f8}
.tk.vw{border-bottom:2px dotted var(--accent);background:#eefbfd}
.rd-pop{position:absolute;z-index:30;background:#fffdf5;border:1px solid #f0c66e;border-radius:14px;box-shadow:0 14px 34px rgba(120,53,15,.22);padding:12px 14px;font-family:Nunito,sans-serif;animation:rpin .16s ease;transform-origin:top left}

.rd-pop:before{content:"";position:absolute;top:-6px;left:22px;width:10px;height:10px;background:#fffdf5;border-left:1px solid #f0c66e;border-top:1px solid #f0c66e;transform:rotate(45deg)}
.rp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.rp-ph{font-size:12px;color:var(--muted-foreground)}

.rp-add{padding:8px 13px!important;font-size:12px!important}
.rp-tag{font-size:12px;font-weight:800;color:var(--muted-foreground);background:var(--muted);border-radius:8px;padding:6px 10px}

.vl{color:var(--muted-foreground);font-style:italic;font-size:12px}
.vault{margin-top:30px}

.vrow{display:grid;grid-template-columns:48px 1.25fr 1.3fr 1.15fr .9fr 1.4fr 82px 56px 66px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #f8e9d1;min-width:1080px;font-size:13px}

.vault-add button{white-space:nowrap;height:40px;padding:0 16px}

.swash{position:relative;display:inline-block;z-index:0;white-space:nowrap}
.swash:before{content:"";position:absolute;z-index:-1;left:-.14em;right:-.12em;bottom:-.02em;height:.74em;background:linear-gradient(100deg,rgba(251,191,36,.15),rgba(251,191,36,.85) 6%,#fcd34d 50%,rgba(251,191,36,.9) 94%,rgba(251,191,36,.2));border-radius:.35em .15em .4em .2em/.5em .3em .45em .25em;transform:rotate(-1.3deg) skewX(-9deg);clip-path:polygon(0 18%,3% 0,12% 12%,40% 4%,70% 10%,96% 0,100% 30%,98% 70%,100% 100%,60% 92%,30% 100%,8% 90%,0 100%)}
.brand-mark{background:none!important;box-shadow:0 5px 12px rgba(217,119,6,.28)!important;flex:none}.brand-mark:before,.brand-mark:after{display:none!important}.brand-mark svg{display:block;width:100%;height:100%}
.header-actions .sun{width:44px;height:44px;margin-left:4px;box-shadow:none;background:conic-gradient(#f59e0b var(--p,0deg),#fde9b0 0);display:grid;place-items:center;position:relative;cursor:default;line-height:1}
.header-actions .sun:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#fffaf0}

.intro{position:fixed;inset:0;z-index:999;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:var(--foreground);opacity:0;transition:opacity .8s ease-in-out;padding:24px;overflow:hidden}

.intro.in .in-wrap{opacity:1;transform:none;filter:none}

.intro .in-line{height:2px;width:0;background:rgba(124,45,18,.25);transition:width 1s ease-in-out}

.intro.first.exit{opacity:0;transition:opacity .4s ease-in .55s}
.intro.first.exit .in-wrap{opacity:0;transform:scale(22);filter:blur(8px);transition:transform .95s cubic-bezier(.76,0,.24,1),opacity .45s ease-in .5s,filter .95s ease-in}
.intro.first.exit.rm,.intro.first.exit.rm .in-wrap{transition:opacity .3s;transform:none;filter:none}
.intro.first.exit.rm{transition-delay:0s}

.intro.back.out{opacity:0}

.avatar.big{width:72px;height:72px;font-size:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.set-av-btns{display:flex;gap:8px;flex-wrap:wrap}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.set-grid label,.set-fb{display:grid;gap:6px;font-weight:700;font-size:13px}
.set-grid input,.set-fb textarea{border:1px solid var(--border);border-radius:11px;background:#fff;padding:0 12px;height:42px;font:inherit;font-weight:500;min-width:0}
.set-fb textarea{height:auto;padding:10px 12px;resize:vertical}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid #f6ead0}
.set-line:first-of-type{border-top:0}
.set-line div:first-child{display:grid;gap:2px}.set-line small{color:var(--muted-foreground);font-size:12px}
.set-line.col{flex-direction:column;align-items:flex-start}
.tgl{width:48px;height:28px;border-radius:999px;border:0;background:#e7dcc0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on{background:#d97706}.tgl.on i{transform:translateX(20px)}
.seg{display:flex;background:#fdf1cf;border-radius:12px;padding:4px;gap:4px}
.seg button,.day-chips button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted-foreground);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:#b45309;box-shadow:0 1px 4px rgba(120,70,0,.15)}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-chips button{border:1px solid var(--border);background:#fff;padding:7px 12px}
.day-chips button.on{background:#d97706;color:#fff;border-color:#d97706}
.set-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.set-stats div{background:#fff8df;border:1px solid #f3e3b4;border-radius:14px;padding:12px;text-align:center;display:grid;gap:2px}
.set-stats b{font-size:22px;color:#b45309}.set-stats span{font-size:12px;color:var(--muted-foreground)}
.danger-zone{border-color:#f5b5b5;background:#fff8f7;margin-top:34px}
.danger-zone h3{color:#b91c1c}
.dz-line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #f8dada}
.dz-line div{display:grid;gap:2px}.dz-line small{color:var(--muted-foreground);font-size:12px}
.hdr-gear{display:none}
@media (max-width:760px){
  .hdr-gear{display:grid}
  nav button[data-p="Cài đặt"]{display:none!important}
  .set-grid{grid-template-columns:1fr}.set-card{padding:18px 16px}
  .set-line:not(.col){flex-wrap:wrap}.dz-line{flex-direction:column;align-items:flex-start}
  .set-stats{grid-template-columns:repeat(2,1fr)}
}

html.fs-s body{zoom:.92}html.fs-l body{zoom:1.12}
html.no-motion *,html.no-motion *::before,html.no-motion *::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
html[data-theme="dark"]{filter:invert(.92) hue-rotate(180deg);background:#fff}
html[data-theme="dark"] img,html[data-theme="dark"] .brand-mark,html[data-theme="dark"] .desert-art,html[data-theme="dark"] .avatar[style],html[data-theme="dark"] #intro,html[data-theme="dark"] .letter-grid,html[data-theme="dark"] #lvx,html[data-theme="dark"] .win-conf,html[data-theme="dark"] .sun,html[data-theme="dark"] .dlg-ic{filter:invert(1) hue-rotate(180deg)}
.dlg-btns button{display:inline-flex;align-items:center;justify-content:center}

.dlg-ic{background:none!important;border:2px solid #e8cf93;color:#b45309;width:60px;height:60px;border-radius:50%}
.dlg-ic.danger{border-color:#f0b4b4;color:#dc2626}
.narr-chips b:empty{display:none}
.lesson-list .lk{display:inline-grid;place-items:center;color:var(--muted-foreground);font-style:normal}
#sndbtn{display:grid;place-items:center}

body.gfull{overflow:hidden}
body.gfull #side,body.gfull header{display:none!important}
body.gfull main,body.gfull.sb-collapsed main{margin-left:0!important;width:100%!important;padding-bottom:0!important}
body.gfull .toast{z-index:260;bottom:calc(26px + env(safe-area-inset-bottom))}
.game-full{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:var(--background);height:100vh;height:100dvh}
.game-full.enter{animation:gfin .22s ease both}
.game-shell:has(>.ws-phone){background:none;border:0;box-shadow:none;padding:0;min-height:0}
@keyframes gfin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.gf-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 22px 12px;background:rgba(255,253,245,.9);border-bottom:1px solid var(--border)}
.gf-title{display:flex;align-items:center;gap:11px;min-width:0}
.gf-title>span{width:38px;height:38px;border-radius:11px;background:var(--muted);color:var(--primary);display:grid;place-items:center;flex:none}
.gf-title>div{display:grid;min-width:0}
.gf-title b{font-size:17px;line-height:1.25}
.gf-title small{font-size:11.7px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-exit{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border:1px solid #f0b4b4;border-radius:11px;background:#fff;color:#dc2626;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.gf-exit:hover{background:#fee2e2}
.gf-body{flex:1;min-height:0;overflow:auto;padding:22px;display:flex;overscroll-behavior:contain}
.gf-body>.game-shell{margin:auto;width:100%;max-width:1100px;min-height:0}
.game-full .letter-grid{--cell:clamp(30px,calc((100dvh - 310px) / 12),46px)}
.game-full .cw-field{height:calc(100dvh - 235px);min-height:340px;max-height:none}
@media (max-width:760px){
  .gf-top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .gf-body{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  .game-full .game-shell{padding:14px}
  .game-full .cw-field{height:calc(100dvh - 250px)}
  body.gfull .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
}

<script>"use strict";
const DAYS = [{"day":1,"title":"Cost of Living and Inflation","topic":"Economic","reading":"Over the past two years, as global energy and food prices climbed, the [[cost of living]] in many cities has [[soared|soar]], leaving ordinary families worried about their monthly budgets. Prices of food, housing and transport have not only risen but also [[fluctuated|fluctuate]] unpredictably, making it difficult to plan ahead. At the same time, wages in several sectors have remained [[stagnant]], so the [[purchasing power]] of each salary has fallen. As a result, the average [[household]] can no longer [[afford]] many things it once considered normal. Many people have been forced to [[cut back on]] non-essential spending. Economists warn that high inflation can [[put pressure on]] small businesses too. To [[curb]] inflation, central banks often raise interest rates, which makes borrowing more expensive and slows down spending. Governments have also been urged to protect the most vulnerable groups, for example by offering targeted support for low-income families. Experts agree, however, that no single policy can solve the problem quickly; instead, a combination of careful budgeting, steady wage growth and responsible economic management is needed to restore confidence.","words":[{"word":"soar","phonetic":"/sɔː/","type":"verb","vi":"tăng vọt","use":"Prices / costs / profits soar; soar to + số; soar by 20%","family":"soaring (adj)","synonym":"skyrocket, surge","antonym":"plummet, plunge","example":"Prices have [[soared]] since the war began."},{"word":"cost of living","phonetic":"/ˌkɒst əv ˈlɪvɪŋ/","type":"noun phrase","vi":"chi phí sinh hoạt","use":"a rise in the cost of living; cost-of-living crisis","family":"live (v), living (n), alive (adj)","synonym":"living expenses","antonym":"-","example":"The [[cost of living]] in big cities is much higher."},{"word":"purchasing power","phonetic":"/ˈpɜːtʃəsɪŋ ˌpaʊə/","type":"noun phrase","vi":"sức mua","use":"increase / reduce / lose purchasing power","family":"purchase (v, n), purchaser (n)","synonym":"buying power","antonym":"-","example":"Inflation reduces the [[purchasing power]] of savings."},{"word":"fluctuate","phonetic":"/ˈflʌktʃueɪt/","type":"verb","vi":"dao động thất thường","use":"fluctuate between A and B; fluctuate widely","family":"fluctuation (n)","synonym":"vary, oscillate","antonym":"stabilise, remain steady","example":"Oil prices [[fluctuate]] between $60 and $90 a barrel."},{"word":"afford","phonetic":"/əˈfɔːd/","type":"verb","vi":"có đủ tiền / khả năng","use":"can afford + noun / to verb","family":"affordable (adj), affordability (n)","synonym":"have the means to","antonym":"be unable to pay for","example":"We can't [[afford]] to buy a new house."},{"word":"cut back on","phonetic":"/kʌt bæk ɒn/","type":"phrasal verb","vi":"cắt giảm","use":"cut back on spending / food / costs","family":"cutback (n)","synonym":"cut down on, reduce","antonym":"increase, expand","example":"Many families are [[cutting back on]] luxuries."},{"word":"stagnant","phonetic":"/ˈstæɡnənt/","type":"adjective","vi":"trì trệ, ngưng trệ","use":"stagnant economy / wages / growth","family":"stagnate (v), stagnation (n)","synonym":"sluggish, inactive","antonym":"thriving, booming","example":"Wages have remained [[stagnant]] for years."},{"word":"household","phonetic":"/ˈhaʊshəʊld/","type":"noun, adjective","vi":"hộ gia đình","use":"household income / expenses / bills","family":"house (n), householder (n)","synonym":"family unit","antonym":"-","example":"[[Household]] income fell by 3% last year."},{"word":"curb","phonetic":"/kɜːb/","type":"verb, noun","vi":"kiềm chế, hạn chế","use":"curb inflation / spending / pollution","family":"-","synonym":"restrain, restrict, limit","antonym":"encourage, stimulate","example":"New measures were introduced to [[curb]] rising prices."},{"word":"put pressure on","phonetic":"/pʊt ˈpreʃə ɒn/","type":"collocation","vi":"gây áp lực lên","use":"put pressure on somebody / something","family":"pressure (n, v), pressurise (v)","synonym":"exert pressure on, strain","antonym":"relieve pressure on","example":"Rising rents [[put pressure on]] young workers."}]},{"day":2,"title":"Globalisation and Trade","topic":"Economic","reading":"Over the past few decades, globalisation has transformed the way countries do business. Goods now cross borders more easily than ever, and a single product may pass through many nations before it reaches a shop. This is possible because of complex [[supply chains|supply chain]] that link producers around the world. Large [[multinational]] companies often [[outsource]] production to countries where labour is cheaper, which helps them reduce costs. Supporters argue that open trade can [[boost]] economic growth and give consumers more choice. Governments, however, do not always welcome foreign competition. Some impose a [[tariff]] on imported goods to protect [[domestic]] industries, while others set up a [[trade barrier]] such as strict quotas or complicated regulations. A country that buys far more than it sells abroad may run a [[trade deficit]], which worries some economists. Despite these disagreements, most nations have become [[interdependent]], because a problem in one economy can quickly affect others. Developing countries in particular call for a [[level playing field]], where small firms can compete fairly with powerful foreign rivals. Many experts believe that cooperation, rather than isolation, is the best way to share the benefits of global trade more widely.","words":[{"word":"tariff","phonetic":"/ˈtærɪf/","type":"noun","vi":"thuế quan","use":"impose / raise / remove a tariff on + goods; import tariffs","family":"-","synonym":"customs duty, import tax","antonym":"subsidy","example":"The government imposed a heavy [[tariff]] on imported steel."},{"word":"supply chain","phonetic":"/səˈplaɪ tʃeɪn/","type":"noun phrase","vi":"chuỗi cung ứng","use":"global supply chain; supply chain disruption / management","family":"supply (v, n), supplier (n)","synonym":"distribution network","antonym":"-","example":"The pandemic caused serious problems in the global [[supply chain]]."},{"word":"outsource","phonetic":"/ˈaʊtsɔːs/","type":"verb","vi":"thuê ngoài, giao cho bên ngoài làm","use":"outsource production / services / jobs to + country or company","family":"outsourcing (n)","synonym":"subcontract","antonym":"keep in-house","example":"Many firms [[outsource]] customer service to call centres overseas."},{"word":"multinational","phonetic":"/ˌmʌltiˈnæʃnəl/","type":"noun, adjective","vi":"công ty đa quốc gia; đa quốc gia","use":"a multinational (company / corporation); multinational firms operate in many countries","family":"nation (n), national (adj), international (adj)","synonym":"transnational corporation","antonym":"local business","example":"A large [[multinational]] has opened a factory near our city."},{"word":"trade barrier","phonetic":"/ˈtreɪd ˌbæriə/","type":"noun phrase","vi":"rào cản thương mại","use":"remove / reduce / impose trade barriers","family":"barrier (n), trade (v, n)","synonym":"trade restriction","antonym":"free trade","example":"Removing every [[trade barrier]] would help small exporters."},{"word":"trade deficit","phonetic":"/ˈtreɪd ˌdefɪsɪt/","type":"noun phrase","vi":"thâm hụt thương mại","use":"run / reduce / narrow a trade deficit","family":"deficit (n)","synonym":"trade gap","antonym":"trade surplus","example":"The country has run a large [[trade deficit]] for several years."},{"word":"domestic","phonetic":"/dəˈmestɪk/","type":"adjective","vi":"trong nước, nội địa","use":"domestic market / industry / demand / flights","family":"domesticate (v), domestically (adv)","synonym":"national, internal","antonym":"foreign, international, overseas","example":"Cheap imports threaten [[domestic]] producers."},{"word":"interdependent","phonetic":"/ˌɪntədɪˈpendənt/","type":"adjective","vi":"phụ thuộc lẫn nhau","use":"interdependent economies / nations; be interdependent","family":"interdependence (n), depend (v), dependent (adj)","synonym":"mutually dependent","antonym":"independent, self-sufficient","example":"Modern economies are deeply [[interdependent]]."},{"word":"boost","phonetic":"/buːst/","type":"verb, noun","vi":"thúc đẩy, tăng cường","use":"boost growth / sales / confidence / the economy; a boost to + noun","family":"booster (n)","synonym":"increase, stimulate, promote","antonym":"reduce, undermine","example":"Tourism can [[boost]] local economies."},{"word":"level playing field","phonetic":"/ˌlevl ˌpleɪɪŋ ˈfiːld/","type":"idiom","vi":"sân chơi công bằng","use":"create / ensure / provide a level playing field (for somebody)","family":"level (adj, n), play (v)","synonym":"fair competition, equal conditions","antonym":"unfair advantage","example":"Small shops want a [[level playing field]] with big supermarkets."}]},{"day":3,"title":"Motivation and Habits","topic":"Psychology","reading":"Many people start a new year with ambitious plans, yet good intentions rarely last for long. One common problem is the tendency to [[procrastinate]], which means delaying important tasks until the last moment. Some people blame a lack of [[willpower]], but psychologists suggest that the real issue is often the environment. A phone buzzing on the desk is a constant [[distraction]] that makes it hard to focus. To [[stick to]] a routine, it helps to start small and to [[keep track of]] daily progress in a notebook or an app. Rewards can also work as an [[incentive]], although researchers note that [[intrinsic]] motivation, the joy of doing something for its own sake, usually lasts longer than money or praise. It is never easy to [[break a habit]], especially one that has been repeated for years. Nevertheless, those who [[persevere]] through the first difficult weeks often find that new behaviour becomes automatic. Friends and family can [[reinforce]] this change by offering encouragement at the right moment. In the end, success depends less on dramatic effort than on small actions repeated consistently every single day.","words":[{"word":"procrastinate","phonetic":"/prəˈkræstɪneɪt/","type":"verb","vi":"trì hoãn, lần lữa","use":"procrastinate about / over + noun; tend to procrastinate","family":"procrastination (n), procrastinator (n)","synonym":"delay, put off, dither","antonym":"act promptly, get on with","example":"Students who [[procrastinate]] often panic before exams."},{"word":"willpower","phonetic":"/ˈwɪlpaʊə/","type":"noun","vi":"sức mạnh ý chí","use":"have / lack willpower; strength of willpower","family":"will (n, v)","synonym":"self-control, determination","antonym":"weakness, indecision","example":"It takes real [[willpower]] to give up sugar."},{"word":"stick to","phonetic":"/ˈstɪk tuː/","type":"phrasal verb","vi":"kiên trì theo, bám sát","use":"stick to a plan / a diet / the rules / a schedule","family":"sticky (adj)","synonym":"adhere to, keep to","antonym":"abandon, give up","example":"She managed to [[stick to]] her study timetable all summer."},{"word":"persevere","phonetic":"/ˌpɜːsəˈvɪə/","type":"verb","vi":"kiên trì, bền bỉ","use":"persevere with / in + noun; persevere despite difficulties","family":"perseverance (n)","synonym":"persist, keep going","antonym":"give up, quit","example":"If you [[persevere]], your English will improve."},{"word":"incentive","phonetic":"/ɪnˈsentɪv/","type":"noun","vi":"động lực, sự khích lệ (thường bằng thưởng)","use":"an incentive to do something; financial / tax incentives","family":"incentivise (v)","synonym":"motivation, inducement, reward","antonym":"deterrent, disincentive","example":"Bonuses give employees an [[incentive]] to work harder."},{"word":"break a habit","phonetic":"/ˌbreɪk ə ˈhæbɪt/","type":"collocation","vi":"bỏ một thói quen","use":"break a bad habit; hard to break the habit of + V-ing","family":"habit (n), habitual (adj), habitually (adv)","synonym":"give up a habit, kick a habit","antonym":"form a habit, pick up a habit","example":"It took him months to [[break a habit]] of staying up late."},{"word":"intrinsic","phonetic":"/ɪnˈtrɪnzɪk/","type":"adjective","vi":"nội tại, vốn có","use":"intrinsic motivation / value / interest","family":"intrinsically (adv)","synonym":"inherent, innate","antonym":"extrinsic, external","example":"Children have an [[intrinsic]] desire to explore."},{"word":"distraction","phonetic":"/dɪˈstrækʃn/","type":"noun","vi":"sự xao nhãng","use":"a distraction from + noun; avoid / minimise distractions","family":"distract (v), distracting (adj), distracted (adj)","synonym":"interruption, diversion","antonym":"concentration, focus","example":"Social media is a major [[distraction]] when studying."},{"word":"reinforce","phonetic":"/ˌriːɪnˈfɔːs/","type":"verb","vi":"củng cố, tăng cường","use":"reinforce a message / behaviour / idea / stereotype","family":"reinforcement (n), force (n, v)","synonym":"strengthen, consolidate","antonym":"weaken, undermine","example":"Regular practice will [[reinforce]] what you learn in class."},{"word":"keep track of","phonetic":"/ˌkiːp ˈtræk əv/","type":"collocation","vi":"theo dõi, nắm được diễn biến","use":"keep track of expenses / progress / time / changes","family":"track (n, v)","synonym":"monitor, keep tabs on","antonym":"lose track of","example":"An app helps me [[keep track of]] my daily spending."}]},{"day":4,"title":"Start-ups and Entrepreneurs","topic":"Economic","reading":"Starting a business has become increasingly popular among young people. An entrepreneur with a clever idea can [[launch]] a company from a small apartment and sell products online. However, finding money is often the biggest challenge. Many founders approach investors for [[venture capital]] in exchange for a share of the company. Some choose to target a [[niche market]], where fewer rivals compete, rather than trying to please everyone. In the first years, most new firms struggle to [[break even]], and only the most careful managers survive. Once sales grow, the owners may decide to [[scale up]] by hiring more staff and renting larger offices. A company's [[turnover]] is a useful sign of its health, but it does not show whether the business is actually making a profit. Successful founders know how to [[seize an opportunity]] when the market changes, and they keep a [[competitive edge]] by constantly improving their products. Even so, failure is always possible. A sudden fall in demand can lead to [[bankruptcy]], leaving owners and [[shareholders|shareholder]] with heavy losses. Despite these risks, many people believe that the freedom of running their own firm is worth it.","words":[{"word":"launch","phonetic":"/lɔːntʃ/","type":"verb, noun","vi":"khởi động, tung ra (sản phẩm, công ty)","use":"launch a business / product / campaign / website","family":"launcher (n)","synonym":"introduce, set up, start","antonym":"withdraw, shut down","example":"They plan to [[launch]] a new app next month."},{"word":"venture capital","phonetic":"/ˌventʃə ˈkæpɪtl/","type":"noun phrase","vi":"vốn đầu tư mạo hiểm","use":"raise / secure venture capital; a venture capital firm","family":"venture (n, v), capital (n)","synonym":"risk capital","antonym":"-","example":"The start-up raised [[venture capital]] to develop its software."},{"word":"break even","phonetic":"/ˌbreɪk ˈiːvn/","type":"phrasal verb","vi":"hoà vốn","use":"break even in the first year; break-even point","family":"break-even (adj, n)","synonym":"cover costs","antonym":"make a loss, make a profit","example":"The café only managed to [[break even]] after two years."},{"word":"niche market","phonetic":"/ˌniːʃ ˈmɑːkɪt/","type":"noun phrase","vi":"thị trường ngách","use":"target / fill / serve a niche market","family":"niche (n, adj)","synonym":"specialised market","antonym":"mass market","example":"She found success in a [[niche market]] for eco-friendly toys."},{"word":"scale up","phonetic":"/ˌskeɪl ˈʌp/","type":"phrasal verb","vi":"mở rộng quy mô","use":"scale up production / operations / a business","family":"scale (n, v)","synonym":"expand, grow","antonym":"scale down, downsize","example":"The company wants to [[scale up]] its operations abroad."},{"word":"bankruptcy","phonetic":"/ˈbæŋkrʌptsi/","type":"noun","vi":"sự phá sản","use":"go into / file for / declare bankruptcy; face bankruptcy","family":"bankrupt (adj, v)","synonym":"insolvency, financial ruin","antonym":"solvency, prosperity","example":"Falling sales pushed the firm into [[bankruptcy]]."},{"word":"turnover","phonetic":"/ˈtɜːnˌəʊvə/","type":"noun","vi":"doanh thu (tổng); tỉ lệ thay thế nhân viên","use":"annual turnover; a turnover of $2 million; staff turnover","family":"turn over (phr v)","synonym":"revenue, sales","antonym":"-","example":"The shop has an annual [[turnover]] of around two million dollars."},{"word":"seize an opportunity","phonetic":"/ˌsiːz ən ˌɒpəˈtjuːnəti/","type":"collocation","vi":"nắm bắt cơ hội","use":"seize the opportunity to do something; seize every opportunity","family":"opportunity (n), opportunist (n)","synonym":"grasp / take advantage of an opportunity","antonym":"miss / let slip an opportunity","example":"Smart founders always [[seize an opportunity]] when it appears."},{"word":"shareholder","phonetic":"/ˈʃeəhəʊldə/","type":"noun","vi":"cổ đông","use":"a major / minority shareholder; shareholder value","family":"share (n, v), shareholding (n)","synonym":"stockholder","antonym":"-","example":"Each [[shareholder]] voted on the proposal at the annual meeting."},{"word":"competitive edge","phonetic":"/kəmˌpetətɪv ˈedʒ/","type":"noun phrase","vi":"lợi thế cạnh tranh","use":"gain / have / maintain a competitive edge over + rivals","family":"compete (v), competition (n), competitor (n)","synonym":"advantage over rivals","antonym":"disadvantage","example":"New technology gave the firm a [[competitive edge]] over its rivals."}]},{"day":5,"title":"The Industrial Revolution","topic":"History","reading":"The Industrial Revolution, which began in Britain in the late eighteenth century, changed society in ways that few people at the time could have imagined. Machines began to replace human hands as manufacturers learned to [[mechanise]] tasks that had once been done slowly by craftsmen. The invention of the steam engine made [[mass production]] possible, and goods that were once expensive became available to ordinary people. Factories needed labour, so thousands of families decided to [[migrate]] from [[rural]] villages to growing towns. This movement led to rapid [[urbanisation]], and many cities became crowded and polluted. The new [[workforce]] often faced harsh conditions, and some employers were willing to [[exploit]] children and women by paying them very low wages. Over time, however, industrial growth helped to [[pave the way for]] reforms in education, health and working hours. It also began to [[give rise to]] new social classes, including a powerful group of factory owners and a large urban working class. In the long run, higher [[living standards]] became one of the most lasting legacies of this historic period.","words":[{"word":"mechanise","phonetic":"/ˈmekənaɪz/","type":"verb","vi":"cơ giới hoá","use":"mechanise production / farming / a process","family":"mechanisation (n), mechanical (adj), machine (n)","synonym":"automate, industrialise","antonym":"-","example":"Farmers began to [[mechanise]] the harvest in the nineteenth century."},{"word":"mass production","phonetic":"/ˌmæs prəˈdʌkʃn/","type":"noun phrase","vi":"sản xuất hàng loạt","use":"the mass production of + goods; mass-produced (adj)","family":"produce (v), production (n), mass-produce (v)","synonym":"large-scale manufacturing","antonym":"handmade production, craftsmanship","example":"[[Mass production]] made cars cheaper for ordinary families."},{"word":"urbanisation","phonetic":"/ˌɜːbənaɪˈzeɪʃn/","type":"noun","vi":"đô thị hoá","use":"rapid / uncontrolled urbanisation; the process of urbanisation","family":"urban (adj), urbanise (v)","synonym":"city growth","antonym":"rural development","example":"Rapid [[urbanisation]] has created serious housing problems."},{"word":"workforce","phonetic":"/ˈwɜːkfɔːs/","type":"noun","vi":"lực lượng lao động","use":"a skilled / large / young workforce; join the workforce","family":"work (v, n), worker (n)","synonym":"labour force, staff","antonym":"-","example":"The factory employs a skilled [[workforce]] of about 500 people."},{"word":"migrate","phonetic":"/maɪˈɡreɪt/","type":"verb","vi":"di cư, di chuyển chỗ ở","use":"migrate from A to B; migrate to find work","family":"migration (n), migrant (n), immigrate (v)","synonym":"relocate, move","antonym":"stay, settle","example":"Many young people [[migrate]] to cities to look for work."},{"word":"rural","phonetic":"/ˈrʊərəl/","type":"adjective","vi":"thuộc nông thôn","use":"rural areas / communities / population","family":"-","synonym":"countryside, agricultural","antonym":"urban","example":"Schools in [[rural]] areas often lack modern equipment."},{"word":"exploit","phonetic":"/ɪkˈsplɔɪt/","type":"verb","vi":"bóc lột; khai thác, tận dụng","use":"exploit workers / children / resources / an opportunity","family":"exploitation (n), exploitative (adj)","synonym":"take advantage of, misuse","antonym":"protect, treat fairly","example":"Some factory owners [[exploit]] workers by paying them very little."},{"word":"give rise to","phonetic":"/ɡɪv ˈraɪz tuː/","type":"phrasal verb","vi":"gây ra, làm nảy sinh","use":"give rise to problems / debate / new industries","family":"rise (v, n)","synonym":"cause, lead to, bring about","antonym":"prevent, result from","example":"Cheap labour can [[give rise to]] serious social problems."},{"word":"pave the way for","phonetic":"/ˌpeɪv ðə ˈweɪ fə/","type":"idiom","vi":"mở đường cho, tạo điều kiện cho","use":"pave the way for reform / change / progress / further research","family":"-","synonym":"open the door to, prepare the ground for","antonym":"block the way for, hinder","example":"The invention of the railway [[paved the way for]] faster trade."},{"word":"living standards","phonetic":"/ˈlɪvɪŋ ˌstændədz/","type":"noun phrase","vi":"mức sống","use":"raise / improve / rising living standards; a high standard of living","family":"live (v), standard (n)","synonym":"quality of life, standard of living","antonym":"-","example":"Economic growth has raised [[living standards]] in many countries."}]},{"day":6,"title":"Online Learning","topic":"Education","reading":"Online learning has expanded rapidly in recent years, especially since schools around the world were forced to close during the pandemic. Through [[distance learning]], students can attend lessons from home and study courses offered by universities in other countries. Many programmes are [[self-paced]], so learners can review difficult material as many times as they need. Modern platforms are often [[interactive]], using quizzes, videos and discussion forums to keep students engaged. Online courses are usually cheaper because there is no need to pay for accommodation, and some institutions charge lower [[tuition]] fees. Nevertheless, there are serious drawbacks. The [[digital divide]] means that students in poor or remote areas may not have a reliable internet connection or a suitable device. Others find it difficult to concentrate, since a short [[attention span]] makes long video lectures tiring. Without a teacher watching them, some learners struggle to [[keep up with]] the schedule and eventually [[drop out]]. Teachers also worry that [[assessment]] is harder to carry out fairly online, because it is easy to cheat. For these reasons, many educators prefer a blended approach that combines the flexibility of the internet with [[face-to-face]] teaching in a real classroom.","words":[{"word":"distance learning","phonetic":"/ˈdɪstəns ˌlɜːnɪŋ/","type":"noun phrase","vi":"học từ xa","use":"a distance learning course / programme; study by distance learning","family":"distant (adj), learn (v), learner (n)","synonym":"remote learning, e-learning","antonym":"classroom learning","example":"She earned her degree through [[distance learning]]."},{"word":"face-to-face","phonetic":"/ˌfeɪs tə ˈfeɪs/","type":"adjective, adverb","vi":"trực tiếp, mặt đối mặt","use":"face-to-face teaching / contact / interaction; meet face-to-face","family":"face (n, v)","synonym":"in person, direct","antonym":"online, remote","example":"Many students prefer [[face-to-face]] lessons to video calls."},{"word":"digital divide","phonetic":"/ˌdɪdʒɪtl dɪˈvaɪd/","type":"noun phrase","vi":"khoảng cách số","use":"bridge / narrow / widen the digital divide","family":"digital (adj), divide (v, n)","synonym":"technology gap","antonym":"-","example":"Free laptops can help to bridge the [[digital divide]]."},{"word":"attention span","phonetic":"/əˈtenʃn ˌspæn/","type":"noun phrase","vi":"khả năng tập trung (thời gian chú ý)","use":"a short / limited attention span; shorten attention spans","family":"attend (v), attentive (adj)","synonym":"concentration time","antonym":"-","example":"Young children have a short [[attention span]]."},{"word":"drop out","phonetic":"/ˌdrɒp ˈaʊt/","type":"phrasal verb","vi":"bỏ học giữa chừng, bỏ cuộc","use":"drop out of school / university / a course; dropout (n)","family":"dropout (n)","synonym":"quit, leave, withdraw","antonym":"complete, graduate, stay on","example":"Many students [[drop out]] of online courses within a month."},{"word":"keep up with","phonetic":"/ˌkiːp ˈʌp wɪð/","type":"phrasal verb","vi":"theo kịp","use":"keep up with the class / the news / technology / demand","family":"-","synonym":"stay level with, match","antonym":"fall behind","example":"It is hard to [[keep up with]] the pace of modern technology."},{"word":"self-paced","phonetic":"/ˌself ˈpeɪst/","type":"adjective","vi":"học theo tốc độ của bản thân","use":"a self-paced course / programme / study","family":"pace (n, v)","synonym":"flexible, at your own speed","antonym":"fixed-schedule, instructor-led","example":"This [[self-paced]] course lets you study at any time."},{"word":"assessment","phonetic":"/əˈsesmənt/","type":"noun","vi":"sự đánh giá, bài đánh giá","use":"continuous / formal assessment; make an assessment of","family":"assess (v), assessor (n)","synonym":"evaluation, appraisal","antonym":"-","example":"Continuous [[assessment]] reduces the pressure of final exams."},{"word":"tuition","phonetic":"/tjuˈɪʃn/","type":"noun","vi":"học phí; sự giảng dạy","use":"tuition fees; private tuition; free tuition","family":"tutor (n, v)","synonym":"teaching, instruction","antonym":"-","example":"Many families struggle to pay university [[tuition]]."},{"word":"interactive","phonetic":"/ˌɪntərˈæktɪv/","type":"adjective","vi":"có tính tương tác","use":"an interactive lesson / whiteboard / website / game","family":"interact (v), interaction (n)","synonym":"participatory, hands-on","antonym":"passive, one-way","example":"[[Interactive]] lessons keep students more engaged."}]},{"day":7,"title":"Consumers and Advertising","topic":"Economic","reading":"Advertising plays a powerful role in modern economies. Companies spend large sums to reach their [[target audience]], using television, social media and even street posters. A successful advertisement is usually [[eye-catching]] and easy to remember. Many brands also pay famous athletes or singers to [[endorse]] their products, hoping that fans will trust the celebrity's choice. Such strategies aim to [[appeal to]] emotions rather than logic, and they often encourage [[impulse buying]]. Shoppers may purchase an item they do not need simply because it looks like a [[bargain]]. In the long run, firms hope to build [[brand loyalty]], so that customers choose the same company again and again. However, [[word of mouth]] remains just as influential, since people tend to trust the opinions of friends more than a paid advertisement. Critics argue that some commercials [[mislead]] viewers by exaggerating the benefits of a product, and that constant advertising promotes [[consumerism]], a culture in which happiness is measured by how much people buy. Many countries therefore have laws that require advertisements to be honest and clearly labelled, so that consumers can make informed decisions.","words":[{"word":"target audience","phonetic":"/ˌtɑːɡɪt ˈɔːdiəns/","type":"noun phrase","vi":"đối tượng khách hàng mục tiêu","use":"reach / appeal to / aim at a target audience","family":"target (n, v), audience (n)","synonym":"intended viewers, target market","antonym":"-","example":"The advert is aimed at a young [[target audience]]."},{"word":"eye-catching","phonetic":"/ˈaɪ ˌkætʃɪŋ/","type":"adjective","vi":"bắt mắt, thu hút","use":"an eye-catching design / poster / headline","family":"catch (v)","synonym":"striking, attractive","antonym":"dull, unremarkable","example":"The shop displayed an [[eye-catching]] poster in its window."},{"word":"endorse","phonetic":"/ɪnˈdɔːs/","type":"verb","vi":"quảng bá, ủng hộ công khai (sản phẩm)","use":"endorse a product / brand / candidate; celebrity endorsement","family":"endorsement (n)","synonym":"support, back, promote","antonym":"criticise, reject","example":"A famous footballer was paid to [[endorse]] the sports drink."},{"word":"appeal to","phonetic":"/əˈpiːl tuː/","type":"phrasal verb","vi":"thu hút, hấp dẫn, đánh vào","use":"appeal to young people / emotions / customers","family":"appeal (n, v), appealing (adj)","synonym":"attract, interest","antonym":"repel, put off","example":"The advert is designed to [[appeal to]] teenagers."},{"word":"impulse buying","phonetic":"/ˈɪmpʌls ˌbaɪɪŋ/","type":"noun phrase","vi":"mua sắm bốc đồng","use":"encourage / lead to impulse buying; an impulse purchase","family":"impulse (n), impulsive (adj), buy (v)","synonym":"spontaneous buying","antonym":"planned purchase","example":"Sweets near the checkout encourage [[impulse buying]]."},{"word":"bargain","phonetic":"/ˈbɑːɡən/","type":"noun, verb","vi":"món hời; mặc cả","use":"a real bargain; bargain hunter; bargain with somebody for","family":"bargaining (n)","synonym":"good deal, steal","antonym":"rip-off","example":"At that price, the laptop is a real [[bargain]]."},{"word":"brand loyalty","phonetic":"/ˈbrænd ˌlɔɪəlti/","type":"noun phrase","vi":"sự trung thành với thương hiệu","use":"build / encourage / show brand loyalty","family":"brand (n, v), loyal (adj), loyalty (n)","synonym":"customer loyalty","antonym":"-","example":"Rewards cards are designed to build [[brand loyalty]]."},{"word":"word of mouth","phonetic":"/ˌwɜːd əv ˈmaʊθ/","type":"noun phrase","vi":"truyền miệng","use":"spread by word of mouth; word-of-mouth advertising / recommendation","family":"-","synonym":"verbal recommendation, grapevine","antonym":"paid advertising","example":"The restaurant became popular by [[word of mouth]]."},{"word":"mislead","phonetic":"/ˌmɪsˈliːd/","type":"verb","vi":"đánh lạc hướng, gây hiểu lầm","use":"mislead consumers / the public / customers; misleading information","family":"misleading (adj)","synonym":"deceive, fool","antonym":"inform, enlighten","example":"False labels can [[mislead]] shoppers about what they are buying."},{"word":"consumerism","phonetic":"/kənˈsjuːmərɪzəm/","type":"noun","vi":"chủ nghĩa tiêu dùng","use":"rampant / modern consumerism; a culture of consumerism","family":"consume (v), consumer (n), consumption (n)","synonym":"materialism","antonym":"minimalism, frugality","example":"Some critics blame [[consumerism]] for the amount of waste we produce."}]},{"day":8,"title":"Stress and Mental Well-being","topic":"Psychology","reading":"Modern life can be demanding, and many people feel [[overwhelmed]] by pressure from school, work and social media. Long-term stress may [[take a toll on]] both the body and the mind, causing headaches, poor sleep and constant [[anxiety]]. In extreme cases, employees suffer from [[burnout]], a state of emotional and physical exhaustion that makes even simple tasks seem impossible. Experts say that a healthy [[work-life balance]] is essential for avoiding this situation. People who can [[cope with]] difficulties calmly tend to show greater [[resilience]], which allows them to recover quickly after failure. There are many simple ways to [[unwind]] after a long day, such as walking, listening to music or talking with friends. Some people practise [[mindfulness]], paying full attention to the present moment instead of worrying about the future. If problems continue, it is important not to suffer in silence. Friends, teachers or doctors are ready to help, and it takes courage to [[reach out to]] them. Mental health should be treated with the same seriousness as physical health, because a person who feels supported is far more likely to lead a happy and productive life.","words":[{"word":"overwhelmed","phonetic":"/ˌəʊvəˈwelmd/","type":"adjective","vi":"choáng ngợp, quá tải","use":"feel overwhelmed by / with + noun; overwhelmed with work","family":"overwhelm (v), overwhelming (adj)","synonym":"overloaded, swamped","antonym":"relaxed, in control","example":"She felt [[overwhelmed]] by the amount of homework."},{"word":"take a toll on","phonetic":"/teɪk ə ˈtəʊl ɒn/","type":"collocation","vi":"gây tổn hại cho, ảnh hưởng xấu đến","use":"take a heavy toll on health / relationships / the body","family":"toll (n)","synonym":"harm, damage, wear down","antonym":"benefit, improve","example":"Long working hours can [[take a toll on]] your health."},{"word":"anxiety","phonetic":"/æŋˈzaɪəti/","type":"noun","vi":"sự lo âu","use":"suffer from anxiety; anxiety about / over + noun; anxiety disorder","family":"anxious (adj), anxiously (adv)","synonym":"worry, unease","antonym":"calmness, peace of mind","example":"Exams often cause [[anxiety]] among students."},{"word":"burnout","phonetic":"/ˈbɜːnaʊt/","type":"noun","vi":"kiệt sức (do làm việc quá tải)","use":"suffer from / experience / prevent burnout; teacher burnout","family":"burn out (phr v)","synonym":"exhaustion, breakdown","antonym":"vitality","example":"Nurses are at high risk of [[burnout]]."},{"word":"work-life balance","phonetic":"/ˌwɜːk ˈlaɪf ˌbæləns/","type":"noun phrase","vi":"cân bằng giữa công việc và cuộc sống","use":"achieve / maintain / improve a healthy work-life balance","family":"balance (n, v)","synonym":"balanced lifestyle","antonym":"-","example":"Flexible hours help staff keep a good [[work-life balance]]."},{"word":"cope with","phonetic":"/ˈkəʊp wɪð/","type":"phrasal verb","vi":"đối phó, xoay xở với","use":"cope with stress / pressure / change / loss","family":"coping (n, adj)","synonym":"deal with, handle, manage","antonym":"succumb to, crumble under","example":"How do you [[cope with]] pressure before exams?"},{"word":"resilience","phonetic":"/rɪˈzɪliəns/","type":"noun","vi":"khả năng phục hồi, sự kiên cường","use":"show / build / develop resilience; emotional resilience","family":"resilient (adj)","synonym":"toughness, adaptability","antonym":"vulnerability, fragility","example":"Sport can help children build [[resilience]]."},{"word":"unwind","phonetic":"/ʌnˈwaɪnd/","type":"verb","vi":"thư giãn, xả hơi","use":"unwind after work / at the weekend; a way to unwind","family":"wind (v)","synonym":"relax, chill out","antonym":"tense up, stress out","example":"I like to [[unwind]] with a book after dinner."},{"word":"mindfulness","phonetic":"/ˈmaɪndflnəs/","type":"noun","vi":"chánh niệm, sự tỉnh thức","use":"practise mindfulness; mindfulness meditation / training","family":"mindful (adj), mind (n, v)","synonym":"awareness, attentiveness","antonym":"distraction, absent-mindedness","example":"Many schools now teach [[mindfulness]] to reduce stress."},{"word":"reach out to","phonetic":"/ˌriːtʃ ˈaʊt tuː/","type":"phrasal verb","vi":"chủ động liên hệ, tìm đến để nhờ giúp","use":"reach out to friends / a counsellor / those in need","family":"outreach (n)","synonym":"contact, turn to, approach","antonym":"withdraw from, isolate oneself","example":"Do not be afraid to [[reach out to]] someone you trust."}]},{"day":9,"title":"Climate Change","topic":"Environment","reading":"Scientists agree that the Earth is getting warmer, and human activity is the main cause. When people burn coal, oil and gas, they release [[greenhouse gases|greenhouse gas]] such as carbon dioxide, which trap heat in the atmosphere. Our dependence on [[fossil fuels|fossil fuel]] for electricity, transport and industry has therefore driven up global [[emissions|emission]] to dangerous levels. [[Deforestation|deforestation]] makes the problem worse, because fewer trees remain to absorb carbon dioxide. The consequences are already visible: glaciers are melting, and [[extreme weather]] such as floods, droughts and storms is becoming more frequent. To [[mitigate]] these effects, governments are investing in [[renewable energy]] from the sun and wind, and many countries plan to [[phase out]] coal power within the next few decades. Individuals can also reduce their [[carbon footprint]] by using public transport, saving energy and wasting less food. Even so, some changes can no longer be avoided, so communities, especially in coastal areas, must learn to [[adapt to]] rising sea levels and hotter summers. Tackling climate change requires cooperation, since no single nation can solve the problem alone.","words":[{"word":"greenhouse gas","phonetic":"/ˈɡriːnhaʊs ɡæs/","type":"noun phrase","vi":"khí nhà kính","use":"release / emit / reduce greenhouse gases; greenhouse gas emissions","family":"greenhouse (n), gas (n)","synonym":"heat-trapping gas","antonym":"-","example":"Cattle farming produces large amounts of [[greenhouse gases]]."},{"word":"fossil fuel","phonetic":"/ˈfɒsl ˌfjuːəl/","type":"noun phrase","vi":"nhiên liệu hoá thạch","use":"burn / depend on fossil fuels; fossil fuel consumption","family":"fuel (n, v), fossil (n)","synonym":"coal, oil and gas","antonym":"renewable energy, clean energy","example":"Burning [[fossil fuels]] pollutes the air."},{"word":"emission","phonetic":"/iˈmɪʃn/","type":"noun","vi":"sự thải ra; khí thải","use":"carbon emissions; cut / reduce / limit emissions","family":"emit (v)","synonym":"discharge, release","antonym":"absorption","example":"The city aims to cut carbon [[emissions]] by half."},{"word":"deforestation","phonetic":"/diːˌfɒrɪˈsteɪʃn/","type":"noun","vi":"nạn phá rừng","use":"tropical deforestation; halt / cause deforestation","family":"forest (n), deforest (v), reforestation (n)","synonym":"forest clearance, logging","antonym":"reforestation, afforestation","example":"[[Deforestation]] destroys the habitats of many species."},{"word":"extreme weather","phonetic":"/ɪkˌstriːm ˈweðə/","type":"noun phrase","vi":"thời tiết cực đoan","use":"extreme weather events / conditions; be hit by extreme weather","family":"extreme (adj), extremely (adv)","synonym":"severe weather","antonym":"mild weather","example":"[[Extreme weather]] has caused heavy losses to farmers."},{"word":"mitigate","phonetic":"/ˈmɪtɪɡeɪt/","type":"verb","vi":"giảm thiểu, làm dịu bớt","use":"mitigate the effects / impact / risk of + noun","family":"mitigation (n)","synonym":"lessen, reduce, alleviate","antonym":"aggravate, worsen","example":"Planting trees can [[mitigate]] the effects of heat in cities."},{"word":"renewable energy","phonetic":"/rɪˌnjuːəbl ˈenədʒi/","type":"noun phrase","vi":"năng lượng tái tạo","use":"invest in / switch to renewable energy; renewable energy sources","family":"renew (v), renewable (adj), energy (n)","synonym":"clean energy, green energy","antonym":"fossil fuel energy","example":"Wind and solar power are forms of [[renewable energy]]."},{"word":"phase out","phonetic":"/ˈfeɪz aʊt/","type":"phrasal verb","vi":"loại bỏ dần","use":"phase out coal / plastic bags / a policy","family":"phase (n, v)","synonym":"gradually eliminate, withdraw","antonym":"phase in, introduce","example":"The government plans to [[phase out]] petrol cars by 2040."},{"word":"carbon footprint","phonetic":"/ˈkɑːbən ˌfʊtprɪnt/","type":"noun phrase","vi":"dấu chân carbon","use":"reduce / cut / calculate your carbon footprint","family":"carbon (n), footprint (n)","synonym":"carbon emissions per person","antonym":"-","example":"Cycling to work reduces your [[carbon footprint]]."},{"word":"adapt to","phonetic":"/əˈdæpt tuː/","type":"phrasal verb","vi":"thích nghi với","use":"adapt to change / new conditions / a new environment","family":"adaptation (n), adaptable (adj), adaptive (adj)","synonym":"adjust to, get used to","antonym":"resist, stay unchanged","example":"Farmers must [[adapt to]] hotter and drier summers."}]},{"day":10,"title":"Poverty and Income Inequality","topic":"Economic","reading":"In many countries, economic growth has not benefited everyone equally. Millions of people still live below the [[poverty line]], earning too little to buy enough food or pay for decent housing. Meanwhile, the [[income gap]] between the richest and poorest citizens continues to [[widen]]. Many low-paid workers struggle to [[make ends meet]], even when they work long hours, which is why some governments raise the [[minimum wage]]. Others rely on [[welfare]] programmes that provide money or services to people in need. Economists also debate how best to [[redistribute]] wealth. One popular method is a [[progressive tax]], under which people with higher incomes pay a larger percentage of their earnings. The revenue can then be used to fund schools and hospitals in communities that are [[disadvantaged]]. Education is considered especially important, because it can help children break the [[cycle of poverty]] that traps families for generations. Without such support, a child born into a poor family has far fewer chances of success than a wealthier classmate. Reducing inequality, therefore, is not only a moral duty but also a way to build a more stable and productive society.","words":[{"word":"poverty line","phonetic":"/ˈpɒvəti laɪn/","type":"noun phrase","vi":"ngưỡng nghèo","use":"live below / above the poverty line","family":"poor (adj), poverty (n)","synonym":"poverty threshold","antonym":"-","example":"Nearly a fifth of the population lives below the [[poverty line]]."},{"word":"income gap","phonetic":"/ˈɪŋkʌm ɡæp/","type":"noun phrase","vi":"khoảng cách thu nhập","use":"a growing / widening income gap; narrow the income gap between A and B","family":"income (n), gap (n)","synonym":"wealth gap, income inequality","antonym":"income equality","example":"The [[income gap]] between city and countryside is wide."},{"word":"minimum wage","phonetic":"/ˌmɪnɪməm ˈweɪdʒ/","type":"noun phrase","vi":"mức lương tối thiểu","use":"raise / earn / be paid the minimum wage","family":"minimum (n, adj), wage (n)","synonym":"lowest legal pay","antonym":"-","example":"Many part-time workers earn only the [[minimum wage]]."},{"word":"welfare","phonetic":"/ˈwelfeə/","type":"noun","vi":"phúc lợi xã hội; sức khoẻ và đời sống","use":"welfare system / state / benefits; child welfare; on welfare","family":"-","synonym":"social security, benefits","antonym":"-","example":"The [[welfare]] system supports the elderly and the unemployed."},{"word":"redistribute","phonetic":"/ˌriːdɪˈstrɪbjuːt/","type":"verb","vi":"phân phối lại","use":"redistribute wealth / income / resources","family":"distribute (v), distribution (n), redistribution (n)","synonym":"reallocate, share out","antonym":"hoard, concentrate","example":"Taxes can [[redistribute]] wealth from rich to poor."},{"word":"disadvantaged","phonetic":"/ˌdɪsədˈvɑːntɪdʒd/","type":"adjective","vi":"thiệt thòi, có hoàn cảnh khó khăn","use":"disadvantaged children / groups / areas / backgrounds","family":"disadvantage (n, v), advantage (n)","synonym":"underprivileged, deprived","antonym":"privileged, well-off","example":"The charity offers free classes to [[disadvantaged]] children."},{"word":"progressive tax","phonetic":"/prəˌɡresɪv ˈtæks/","type":"noun phrase","vi":"thuế luỹ tiến","use":"introduce / impose a progressive tax system","family":"progress (n, v), progressive (adj), tax (n, v)","synonym":"graduated tax","antonym":"regressive tax, flat tax","example":"A [[progressive tax]] makes high earners pay a higher rate."},{"word":"cycle of poverty","phonetic":"/ˌsaɪkl əv ˈpɒvəti/","type":"noun phrase","vi":"vòng luẩn quẩn của đói nghèo","use":"break / escape / trapped in the cycle of poverty","family":"cycle (n, v), poverty (n)","synonym":"poverty trap","antonym":"upward mobility","example":"Free schooling can help families escape the [[cycle of poverty]]."},{"word":"make ends meet","phonetic":"/ˌmeɪk endz ˈmiːt/","type":"idiom","vi":"xoay xở đủ sống","use":"struggle to make ends meet; barely make ends meet","family":"-","synonym":"get by, scrape by","antonym":"live in luxury, be well-off","example":"She works two jobs just to [[make ends meet]]."},{"word":"widen","phonetic":"/ˈwaɪdn/","type":"verb","vi":"mở rộng, nới rộng (khoảng cách)","use":"widen the gap / divide / inequality; the gap is widening","family":"wide (adj), width (n), widely (adv)","synonym":"broaden, expand","antonym":"narrow, close","example":"Rising prices [[widen]] the gap between rich and poor."}]},{"day":11,"title":"Memory and Learning","topic":"Psychology","reading":"Learning is not simply a matter of [[absorbing|absorb]] facts; it is a complex process that involves several [[cognitive]] skills. When we first meet new information, it is stored in our [[short-term memory]], which can hold only a small amount of data for a few seconds. Unless the brain actively processes it, the information quickly disappears. Many students depend on [[rote learning]], repeating words or formulas again and again until they can [[recall]] them in an exam. However, research suggests that this method rarely helps people [[retain]] knowledge for long. Understanding the meaning behind facts and linking them to personal experience is far more effective. Another key factor is attention. It is hard to [[concentrate on]] a difficult text when a phone keeps buzzing and interrup
