ts the flow of thought. Teachers therefore try to [[stimulate]] curiosity by using puzzles, discussions and real-life examples. When learners are interested, they often [[get the hang of]] a new skill much faster than expected. Regular sleep, healthy meals and short breaks also support the brain, allowing it to [[consolidate]] fresh impressions into lasting memories.","words":[{"word":"retain","phonetic":"/rɪˈteɪn/","type":"verb","vi":"giữ lại, ghi nhớ","use":"retain information / knowledge / water; retain control of","family":"retention (n), retentive (adj)","synonym":"remember, keep","antonym":"forget, lose","example":"Some students find it hard to [[retain]] new vocabulary."},{"word":"recall","phonetic":"/rɪˈkɔːl/","type":"verb, noun","vi":"nhớ lại, gợi nhớ lại","use":"recall + noun / V-ing / that-clause; total recall","family":"-","synonym":"remember, recollect","antonym":"forget","example":"I can't [[recall]] where I left my keys."},{"word":"cognitive","phonetic":"/ˈkɒɡnətɪv/","type":"adjective","vi":"thuộc nhận thức","use":"cognitive skills / development / ability / science","family":"cognition (n)","synonym":"mental, intellectual","antonym":"-","example":"Reading aloud improves children's [[cognitive]] development."},{"word":"absorb","phonetic":"/əbˈzɔːb/","type":"verb","vi":"tiếp thu, hấp thụ","use":"absorb information / ideas / water / shock","family":"absorption (n), absorbent (adj), absorbing (adj)","synonym":"take in, soak up","antonym":"release, give off","example":"Young children [[absorb]] new languages very quickly."},{"word":"short-term memory","phonetic":"/ˌʃɔːt tɜːm ˈmeməri/","type":"noun phrase","vi":"trí nhớ ngắn hạn","use":"store in / lose short-term memory","family":"memorise (v), memory (n)","synonym":"working memory","antonym":"long-term memory","example":"Information in the [[short-term memory]] fades within seconds."},{"word":"rote learning","phonetic":"/ˌrəʊt ˈlɜːnɪŋ/","type":"noun phrase","vi":"học vẹt, học thuộc lòng","use":"rely on / depend on rote learning; learn by rote","family":"learn (v), learner (n)","synonym":"memorisation, learning by heart","antonym":"critical thinking, learning with understanding","example":"[[Rote learning]] rarely develops creative thinking."},{"word":"get the hang of","phonetic":"/ɡet ðə ˈhæŋ əv/","type":"idiom","vi":"nắm được cách làm, quen dần","use":"get the hang of + noun / V-ing","family":"-","synonym":"master, pick up","antonym":"-","example":"It took me a week to [[get the hang of]] the new software."},{"word":"stimulate","phonetic":"/ˈstɪmjuleɪt/","type":"verb","vi":"kích thích, khơi dậy","use":"stimulate growth / interest / the economy / the brain","family":"stimulus (n), stimulation (n), stimulating (adj)","synonym":"encourage, arouse","antonym":"discourage, suppress","example":"Good teachers [[stimulate]] students' curiosity."},{"word":"concentrate on","phonetic":"/ˈkɒnsntreɪt ɒn/","type":"phrasal verb","vi":"tập trung vào","use":"concentrate on + noun / V-ing","family":"concentration (n)","synonym":"focus on, centre on","antonym":"be distracted by","example":"She closed the door to [[concentrate on]] her homework."},{"word":"consolidate","phonetic":"/kənˈsɒlɪdeɪt/","type":"verb","vi":"củng cố (trí nhớ, kiến thức)","use":"consolidate memories / knowledge / learning","family":"consolidation (n), consolidated (adj)","synonym":"strengthen, solidify","antonym":"weaken, undermine","example":"Sleep helps the brain [[consolidate]] what we learn during the day."}]},{"day":12,"title":"Banking and Digital Payments","topic":"Economic","reading":"Banking has changed dramatically over the last decade. In the past, customers had to queue at a branch to [[withdraw]] cash or [[deposit]] their salary. Today, most daily [[transactions|transaction]] can be completed on a smartphone within seconds. A growing number of countries are moving towards a [[cashless]] society, where people pay with cards, QR codes or a [[mobile wallet]]. Users can also check their balance in real time, which helps them avoid an [[overdraft]] and manage money more wisely. Banks still play a vital role, of course. They offer loans, and the [[interest rate]] they set affects how easily families can [[pay off]] their debts. However, digital payments bring new risks. Criminals send fake messages to commit [[fraud]], tricking victims into revealing their passwords. For this reason, banks invest heavily in making their systems [[secure]] and advise customers never to share verification codes with anyone. Experts believe that financial education is as important as technology itself. Only when people understand how their accounts work can they enjoy the speed and convenience of modern banking without losing their hard-earned savings.","words":[{"word":"withdraw","phonetic":"/wɪðˈdrɔː/","type":"verb","vi":"rút (tiền); rút lui","use":"withdraw money from an account; withdraw from a contest","family":"withdrawal (n)","synonym":"take out, pull out","antonym":"deposit, pay in","example":"You can [[withdraw]] cash from any ATM."},{"word":"deposit","phonetic":"/dɪˈpɒzɪt/","type":"verb, noun","vi":"gửi (tiền); tiền gửi, tiền đặt cọc","use":"deposit money into an account; pay a deposit","family":"depositor (n)","synonym":"pay in, put in","antonym":"withdraw","example":"She [[deposited]] half of her salary in a savings account."},{"word":"transaction","phonetic":"/trænˈzækʃn/","type":"noun","vi":"giao dịch","use":"a bank / online / financial transaction; complete a transaction","family":"transact (v)","synonym":"deal, payment","antonym":"-","example":"Every online [[transaction]] is recorded by the bank."},{"word":"cashless","phonetic":"/ˈkæʃləs/","type":"adjective","vi":"không dùng tiền mặt","use":"a cashless society / payment / economy","family":"cash (n)","synonym":"electronic, digital","antonym":"cash-based","example":"Many shops in the city have become completely [[cashless]]."},{"word":"mobile wallet","phonetic":"/ˌməʊbaɪl ˈwɒlɪt/","type":"noun phrase","vi":"ví điện tử trên điện thoại","use":"pay with a mobile wallet; top up a mobile wallet","family":"wallet (n)","synonym":"e-wallet, digital wallet","antonym":"-","example":"Most young people pay for coffee with a [[mobile wallet]]."},{"word":"overdraft","phonetic":"/ˈəʊvədrɑːft/","type":"noun","vi":"khoản thấu chi (rút vượt số dư)","use":"go into overdraft; an overdraft fee / facility","family":"overdrawn (adj), overdraw (v)","synonym":"negative balance","antonym":"credit balance, surplus","example":"She paid a fee after her account went into [[overdraft]]."},{"word":"interest rate","phonetic":"/ˈɪntrəst reɪt/","type":"noun phrase","vi":"lãi suất","use":"raise / cut / lower interest rates; a high interest rate","family":"interest (n), interested (adj)","synonym":"rate of interest","antonym":"-","example":"The bank has decided to cut the [[interest rate]]."},{"word":"pay off","phonetic":"/peɪ ɒf/","type":"phrasal verb","vi":"trả hết (nợ); có kết quả tốt","use":"pay off a debt / a loan / a mortgage; Hard work pays off.","family":"payoff (n)","synonym":"settle, clear","antonym":"borrow, run up","example":"It took them ten years to [[pay off]] their loan."},{"word":"fraud","phonetic":"/frɔːd/","type":"noun","vi":"sự gian lận, lừa đảo","use":"commit fraud; credit card / online fraud","family":"fraudulent (adj), fraudster (n)","synonym":"deception, swindle","antonym":"honesty","example":"The police are investigating a case of bank [[fraud]]."},{"word":"secure","phonetic":"/sɪˈkjʊə/","type":"adjective, verb","vi":"an toàn, bảo mật; đảm bảo","use":"a secure password / connection / job; secure a loan","family":"security (n), securely (adv), insecure (adj)","synonym":"safe, protected","antonym":"insecure, vulnerable","example":"Always use a [[secure]] network when paying online."}]},{"day":13,"title":"Ancient Civilisations","topic":"History","reading":"Some of the world's earliest cities appeared along great rivers, where fertile land allowed farming communities to [[flourish]]. In Egypt, a long line of rulers, each belonging to a particular [[dynasty]], built temples and pyramids that still impress visitors today. Many of these monuments [[date back to]] more than four thousand years ago. Elsewhere, powerful kings expanded their territory and created a vast [[empire]] that united different peoples under one government. Almost everything we know about these societies comes from the work of [[archaeologists|archaeologist]]. They [[excavate]] ancient sites carefully, layer by layer, and study every [[relic]], from broken pottery to golden jewellery, to understand how people lived. Written records and oral stories were [[passed down|pass down]] from generation to generation, preserving knowledge about law, religion and science. Yet no civilisation lasts forever. Wars, climate change and political conflict caused many of them to [[decline]] and eventually collapse. Even so, their ideas about government, architecture and writing continue to [[leave a mark on]] the modern world.","words":[{"word":"flourish","phonetic":"/ˈflʌrɪʃ/","type":"verb","vi":"phát triển mạnh, thịnh vượng","use":"art / trade / culture / business flourishes; flourish under","family":"flourishing (adj)","synonym":"thrive, prosper","antonym":"decline, wither","example":"Trade and the arts [[flourished]] along the river."},{"word":"archaeologist","phonetic":"/ˌɑːkiˈɒlədʒɪst/","type":"noun","vi":"nhà khảo cổ học","use":"a team of archaeologists; archaeologists discover / uncover","family":"archaeology (n), archaeological (adj)","synonym":"-","antonym":"-","example":"An [[archaeologist]] found a bronze mask in the tomb."},{"word":"relic","phonetic":"/ˈrelɪk/","type":"noun","vi":"di vật, cổ vật","use":"a relic of the past; ancient / religious relics","family":"-","synonym":"artefact, remains","antonym":"-","example":"The museum displays [[relics]] from the Bronze Age."},{"word":"decline","phonetic":"/dɪˈklaɪn/","type":"verb, noun","vi":"suy giảm, suy tàn; từ chối","use":"be in decline; decline sharply; decline an offer","family":"-","synonym":"decrease, deteriorate","antonym":"grow, flourish, increase","example":"The empire began to [[decline]] after years of war."},{"word":"empire","phonetic":"/ˈempaɪə/","type":"noun","vi":"đế quốc, đế chế","use":"the fall / rise of an empire; the Roman Empire","family":"emperor (n), imperial (adj)","synonym":"kingdom, realm","antonym":"-","example":"The Roman [[Empire]] once controlled most of Europe."},{"word":"dynasty","phonetic":"/ˈdɪnəsti/","type":"noun","vi":"triều đại","use":"the Ming / Ly / Tran dynasty; found a dynasty","family":"dynastic (adj)","synonym":"ruling family, royal house","antonym":"-","example":"The Ly [[dynasty]] moved the capital to Thang Long."},{"word":"excavate","phonetic":"/ˈekskəveɪt/","type":"verb","vi":"khai quật, đào","use":"excavate a site / a tomb / ruins","family":"excavation (n), excavator (n)","synonym":"dig up, unearth","antonym":"bury","example":"Experts will [[excavate]] the ruins next summer."},{"word":"date back to","phonetic":"/deɪt bæk tə/","type":"phrasal verb","vi":"có từ thời, bắt nguồn từ","use":"date back to + mốc thời gian","family":"date (n, v)","synonym":"go back to, originate from","antonym":"-","example":"The temple [[dates back to]] the 11th century."},{"word":"pass down","phonetic":"/pɑːs daʊn/","type":"phrasal verb","vi":"truyền lại (cho thế hệ sau)","use":"pass down traditions / stories / skills (from ... to ...)","family":"-","synonym":"hand down, transmit","antonym":"-","example":"Folk songs were [[passed down]] from parents to children."},{"word":"leave a mark on","phonetic":"/liːv ə mɑːk ɒn/","type":"idiom","vi":"để lại dấu ấn lên","use":"leave a lasting mark on history / society","family":"mark (n, v)","synonym":"influence, make an impression on","antonym":"-","example":"Ancient Greece [[left a mark on]] modern democracy."}]},{"day":14,"title":"University and Careers","topic":"Education","reading":"Choosing what to do after high school is one of the biggest decisions a young person makes. Many students dream of attending university, but rising [[tuition fees]] mean that not every family can pay for it. Fortunately, a [[scholarship]] can cover part or all of the cost for talented applicants. Once accepted, students must [[enrol in]] a programme and [[major in]] a subject that matches their interests, such as engineering or economics. Yet a degree is not the only route to success. Some young people prefer [[vocational]] training, which offers practical courses in fields like nursing, cooking or mechanics. Employers increasingly value [[hands-on]] experience, so many universities encourage undergraduates to complete an [[internship]] during the summer. This gives them a chance to apply theory in a real workplace. When they [[graduate]], those with a recognised [[qualification]] and relevant experience stand a better chance of finding a stable [[career path]]. Whatever route they choose, students should research carefully, talk to professionals and think about their long-term goals before making a final decision.","words":[{"word":"tuition fees","phonetic":"/tjuˈɪʃn fiːz/","type":"noun phrase","vi":"học phí","use":"pay / raise / cut tuition fees; free tuition","family":"tuition (n)","synonym":"school fees","antonym":"-","example":"Tuition [[fees]] have risen sharply in recent years."},{"word":"scholarship","phonetic":"/ˈskɒləʃɪp/","type":"noun","vi":"học bổng","use":"win / receive / apply for a scholarship; a full scholarship","family":"scholar (n)","synonym":"grant, bursary","antonym":"-","example":"She won a [[scholarship]] to study in Australia."},{"word":"enrol in","phonetic":"/ɪnˈrəʊl ɪn/","type":"phrasal verb","vi":"đăng ký học, ghi danh","use":"enrol in a course / programme / school","family":"enrolment (n)","synonym":"sign up for, register for","antonym":"drop out of","example":"He decided to [[enrol in]] an evening class."},{"word":"major in","phonetic":"/ˈmeɪdʒər ɪn/","type":"phrasal verb","vi":"học chuyên ngành","use":"major in physics / law / business","family":"major (n, adj)","synonym":"specialise in","antonym":"-","example":"She plans to [[major in]] biology at university."},{"word":"vocational","phonetic":"/vəʊˈkeɪʃənl/","type":"adjective","vi":"(thuộc) hướng nghiệp, dạy nghề","use":"vocational training / school / courses / education","family":"vocation (n)","synonym":"career-oriented","antonym":"academic","example":"[[Vocational]] schools prepare students for specific jobs."},{"word":"hands-on","phonetic":"/ˌhændz ˈɒn/","type":"adjective","vi":"thực hành, trực tiếp tham gia","use":"hands-on experience / training / learning","family":"-","synonym":"practical","antonym":"theoretical","example":"The course gives students [[hands-on]] experience."},{"word":"internship","phonetic":"/ˈɪntɜːnʃɪp/","type":"noun","vi":"kỳ thực tập","use":"do / complete an internship at / with a company","family":"intern (n, v)","synonym":"work placement","antonym":"-","example":"He did an [[internship]] at a software company."},{"word":"graduate","phonetic":"/ˈɡrædʒueɪt/","type":"verb, noun","vi":"tốt nghiệp; người tốt nghiệp","use":"graduate from a university; graduate in law; a university graduate","family":"graduation (n), postgraduate (n, adj)","synonym":"complete a degree","antonym":"drop out","example":"She [[graduated]] from Hanoi University in 2020."},{"word":"qualification","phonetic":"/ˌkwɒlɪfɪˈkeɪʃn/","type":"noun","vi":"bằng cấp, trình độ chuyên môn","use":"hold / gain / obtain a qualification; academic qualifications","family":"qualify (v), qualified (adj)","synonym":"certificate, credential","antonym":"-","example":"You need a teaching [[qualification]] for this job."},{"word":"career path","phonetic":"/kəˈrɪə pɑːθ/","type":"noun phrase","vi":"con đường sự nghiệp","use":"choose / follow / pursue a career path","family":"career (n)","synonym":"professional route","antonym":"-","example":"He chose a [[career path]] in medicine."}]},{"day":15,"title":"Biodiversity and Wildlife","topic":"Environment","reading":"[[Biodiversity|biodiversity]] refers to the variety of living things on Earth, from tiny insects to enormous whales. Each species lives in a particular [[habitat]], such as a forest, a coral reef or a wetland, and each plays a role in a wider [[ecosystem]]. When one species disappears, the effects can spread along the [[food chain]]; for example, the loss of insects may leave birds without enough to eat. Sadly, human activity is pushing many animals towards [[extinction]]. Large areas of land are cleared every year for farms and cities, leaving wildlife with nowhere to live. [[Poaching|poaching]] for ivory, fur and exotic pets also threatens [[endangered]] species such as tigers and rhinos. Some invasive species can even [[wipe out]] local animals that have no natural defences. Fortunately, governments and charities are taking action. They establish [[nature reserves|nature reserve]] to protect habitats, and they work with local communities to [[conserve]] water, forests and soil. Individuals can help too, by choosing sustainable products and supporting conservation projects.","words":[{"word":"habitat","phonetic":"/ˈhæbɪtæt/","type":"noun","vi":"môi trường sống","use":"natural habitat; destroy / protect a habitat; loss of habitat","family":"inhabit (v), inhabitant (n)","synonym":"environment, home","antonym":"-","example":"Tigers are losing their natural [[habitat]]."},{"word":"ecosystem","phonetic":"/ˈiːkəʊˌsɪstəm/","type":"noun","vi":"hệ sinh thái","use":"a fragile ecosystem; marine / forest ecosystem; damage an ecosystem","family":"ecology (n), ecological (adj)","synonym":"-","antonym":"-","example":"Coral reefs are a delicate [[ecosystem]]."},{"word":"food chain","phonetic":"/ˈfuːd tʃeɪn/","type":"noun phrase","vi":"chuỗi thức ăn","use":"the top / bottom of the food chain; disrupt the food chain","family":"-","synonym":"food web","antonym":"-","example":"Plankton are at the bottom of the [[food chain]]."},{"word":"extinction","phonetic":"/ɪkˈstɪŋkʃn/","type":"noun","vi":"sự tuyệt chủng","use":"on the verge of extinction; face / avoid extinction","family":"extinct (adj)","synonym":"dying out","antonym":"survival","example":"Many frogs are facing [[extinction]]."},{"word":"biodiversity","phonetic":"/ˌbaɪəʊdaɪˈvɜːsəti/","type":"noun","vi":"đa dạng sinh học","use":"protect / preserve / loss of biodiversity; rich in biodiversity","family":"biodiverse (adj), diversity (n), diverse (adj)","synonym":"biological diversity","antonym":"-","example":"Coral reefs support an extraordinary amount of [[biodiversity]]."},{"word":"poaching","phonetic":"/ˈpəʊtʃɪŋ/","type":"noun","vi":"nạn săn trộm","use":"ivory / elephant poaching; crack down on poaching","family":"poach (v), poacher (n)","synonym":"illegal hunting","antonym":"-","example":"Strict laws have been introduced to stop [[poaching]]."},{"word":"endangered","phonetic":"/ɪnˈdeɪndʒəd/","type":"adjective","vi":"có nguy cơ tuyệt chủng, bị đe doạ","use":"an endangered species / animal; critically endangered","family":"endanger (v), danger (n)","synonym":"threatened, at risk","antonym":"thriving, common","example":"The giant panda is an [[endangered]] species."},{"word":"wipe out","phonetic":"/waɪp aʊt/","type":"phrasal verb","vi":"tiêu diệt, xoá sổ","use":"wipe out a species / a disease / a population","family":"-","synonym":"destroy, eradicate","antonym":"create, preserve","example":"The disease nearly [[wiped out]] the local frog population."},{"word":"nature reserve","phonetic":"/ˈneɪtʃə rɪˌzɜːv/","type":"noun phrase","vi":"khu bảo tồn thiên nhiên","use":"set up / visit a nature reserve","family":"reserve (n, v)","synonym":"wildlife sanctuary, protected area","antonym":"-","example":"The government set up a new [[nature reserve]] in the north."},{"word":"conserve","phonetic":"/kənˈsɜːv/","type":"verb","vi":"bảo tồn, tiết kiệm","use":"conserve energy / water / wildlife / resources","family":"conservation (n), conservationist (n)","synonym":"protect, preserve","antonym":"waste, destroy","example":"We must [[conserve]] water during the dry season."}]},{"day":16,"title":"Employment and the Labour Market","topic":"Economic","reading":"The labour market is where employers look for workers and workers look for jobs. When the economy grows, companies tend to [[recruit]] more staff and [[take on]] trainees, and [[unemployment]] falls. During a downturn, however, firms may be forced to [[lay off]] employees to cut costs, leaving thousands of families without income. Because of this, many people value [[job security]] as much as a high salary. Many workers join a [[trade union]] to negotiate better pay and conditions, although employers sometimes disagree about how much influence unions should have. Meanwhile, technology is reshaping the [[labour force]]. [[Automation|automation]] now performs repetitive tasks in factories and offices, reducing demand for some roles while creating new ones that require digital knowledge. As a result, [[skilled]] workers are in short supply in many industries, and companies compete to attract them. At the same time, a growing number of people choose to work as a [[freelance]] designer, writer or programmer, enjoying flexible hours but accepting less stability. To stay competitive, workers need to keep learning new skills throughout their careers.","words":[{"word":"unemployment","phonetic":"/ˌʌnɪmˈplɔɪmənt/","type":"noun","vi":"tình trạng thất nghiệp","use":"high / rising unemployment; the unemployment rate","family":"employ (v), employee (n), employer (n), unemployed (adj)","synonym":"joblessness","antonym":"employment","example":"Youth [[unemployment]] remains a serious problem."},{"word":"recruit","phonetic":"/rɪˈkruːt/","type":"verb, noun","vi":"tuyển dụng; người mới được tuyển","use":"recruit staff / graduates / volunteers","family":"recruitment (n), recruiter (n)","synonym":"hire, employ","antonym":"dismiss, lay off","example":"The company plans to [[recruit]] fifty new engineers."},{"word":"take on","phonetic":"/teɪk ɒn/","type":"phrasal verb","vi":"thuê (nhân viên); đảm nhận","use":"take on staff / workers; take on extra work","family":"-","synonym":"hire, employ; undertake","antonym":"lay off; turn down","example":"The shop [[took on]] two assistants for the holiday season."},{"word":"lay off","phonetic":"/leɪ ɒf/","type":"phrasal verb","vi":"sa thải (do cắt giảm), cho nghỉ việc","use":"lay off workers / staff; be laid off","family":"layoff (n)","synonym":"dismiss, make redundant","antonym":"take on, recruit","example":"The factory had to [[lay off]] 200 workers."},{"word":"job security","phonetic":"/ˌdʒɒb sɪˈkjʊərəti/","type":"noun phrase","vi":"sự ổn định công việc","use":"offer / lack job security; worry about job security","family":"secure (adj), security (n)","synonym":"stable employment","antonym":"job insecurity","example":"Many people prefer public-sector jobs for [[job security]]."},{"word":"trade union","phonetic":"/ˈtreɪd ˌjuːniən/","type":"noun phrase","vi":"công đoàn","use":"join / form / be a member of a trade union; trade union leader","family":"union (n), unionise (v)","synonym":"labour union, workers' union","antonym":"management, employer","example":"The [[trade union]] demanded shorter working hours."},{"word":"labour force","phonetic":"/ˈleɪbə fɔːs/","type":"noun phrase","vi":"lực lượng lao động","use":"join the labour force; a young / skilled labour force","family":"labour (n, v), labourer (n)","synonym":"workforce","antonym":"-","example":"Women make up nearly half of the [[labour force]]."},{"word":"automation","phonetic":"/ˌɔːtəˈmeɪʃn/","type":"noun","vi":"sự tự động hoá","use":"factory / industrial automation; threaten jobs","family":"automate (v), automatic (adj)","synonym":"mechanisation","antonym":"manual work","example":"[[Automation]] may replace many routine jobs."},{"word":"skilled","phonetic":"/skɪld/","type":"adjective","vi":"có kỹ năng, lành nghề","use":"skilled workers / labour / craftsman; highly skilled","family":"skill (n), skilful (adj)","synonym":"trained, expert","antonym":"unskilled, inexperienced","example":"There is a shortage of [[skilled]] workers in construction."},{"word":"freelance","phonetic":"/ˈfriːlɑːns/","type":"adjective, verb","vi":"làm tự do (không thuộc công ty cố định)","use":"a freelance writer / designer; work freelance","family":"freelancer (n)","synonym":"self-employed","antonym":"salaried, full-time","example":"She works as a [[freelance]] photographer."}]},{"day":17,"title":"Emotions and Relationships","topic":"Psychology","reading":"Human beings are social creatures, and our emotions shape the way we connect with others. A close friendship or family [[bond]] grows when people show [[empathy]], the ability to understand how someone else feels. Relationships also depend on [[mutual respect]]: each person must value the other's opinions, even when they disagree. Of course, no relationship is perfect. A simple [[misunderstanding]] can turn into a serious quarrel if nobody explains what they really meant. Some people [[bottle up]] their feelings because they fear being judged, but this habit often leads to [[resentment]], a deep and lasting anger. Psychologists recommend talking openly and listening carefully. Distance can weaken even strong friendships: when students move to different schools or cities, old friends may [[drift apart]] if they stop keeping in touch. Building a good [[rapport]] with new people takes time, but sharing stories and showing genuine interest helps a great deal. Those who learn to [[get along with]] classmates and colleagues usually enjoy better mental health. Finally, healthy [[self-esteem]] matters greatly: people who believe in their own worth are more confident in making friends and ending harmful relationships.","words":[{"word":"bond","phonetic":"/bɒnd/","type":"noun, verb","vi":"mối gắn kết; gắn bó","use":"a strong / close bond; the bond between mother and child","family":"bonding (n)","synonym":"connection, tie","antonym":"-","example":"There is a strong [[bond]] between the two sisters."},{"word":"empathy","phonetic":"/ˈempəθi/","type":"noun","vi":"sự đồng cảm","use":"show / feel empathy for / with somebody","family":"empathise (v), empathetic (adj)","synonym":"understanding, compassion","antonym":"indifference, apathy","example":"A good doctor shows [[empathy]] towards patients."},{"word":"mutual respect","phonetic":"/ˌmjuːtʃuəl rɪˈspekt/","type":"noun phrase","vi":"sự tôn trọng lẫn nhau","use":"based on mutual respect and trust","family":"respect (n, v), respectful (adj)","synonym":"-","antonym":"disrespect","example":"A good team is built on [[mutual respect]]."},{"word":"misunderstanding","phonetic":"/ˌmɪsʌndəˈstændɪŋ/","type":"noun","vi":"sự hiểu lầm","use":"a misunderstanding between / about; clear up a misunderstanding","family":"misunderstand (v)","synonym":"mix-up, confusion","antonym":"understanding","example":"It was just a [[misunderstanding]], so please don't be angry."},{"word":"bottle up","phonetic":"/ˌbɒtl ˈʌp/","type":"phrasal verb","vi":"kìm nén (cảm xúc)","use":"bottle up feelings / anger / emotions","family":"-","synonym":"suppress, repress","antonym":"express, let out","example":"It is unhealthy to [[bottle up]] your emotions."},{"word":"resentment","phonetic":"/rɪˈzentmənt/","type":"noun","vi":"sự oán giận, bực tức","use":"feel / harbour resentment towards somebody; deep resentment","family":"resent (v), resentful (adj)","synonym":"bitterness, grudge","antonym":"goodwill, gratitude","example":"He felt [[resentment]] at being treated unfairly."},{"word":"drift apart","phonetic":"/ˌdrɪft əˈpɑːt/","type":"phrasal verb","vi":"xa cách dần, dần xa nhau","use":"friends / couples drift apart; drift apart over time","family":"drift (v, n)","synonym":"grow apart, become distant","antonym":"grow closer, stay in touch","example":"After they changed schools, the two friends began to [[drift apart]]."},{"word":"rapport","phonetic":"/ræˈpɔː/","type":"noun","vi":"mối quan hệ thân thiết, sự hòa hợp","use":"build / establish a good rapport with sb","family":"-","synonym":"connection, understanding","antonym":"hostility","example":"The teacher quickly built a good [[rapport]] with her students."},{"word":"get along with","phonetic":"/ɡet əˈlɒŋ wɪð/","type":"phrasal verb","vi":"hòa hợp với","use":"get along well / badly with somebody","family":"-","synonym":"get on with","antonym":"fall out with","example":"I [[get along with]] all my classmates."},{"word":"self-esteem","phonetic":"/ˌself ɪˈstiːm/","type":"noun","vi":"lòng tự trọng, sự tự tin vào giá trị bản thân","use":"have low / high self-esteem; boost self-esteem","family":"esteem (n, v)","synonym":"self-respect, self-confidence","antonym":"self-doubt","example":"Praise can boost a child's [[self-esteem]]."}]},{"day":18,"title":"Independence and Struggle","topic":"History","reading":"For centuries, many Asian, African and Latin American countries were ruled by foreign powers. Under [[colonial]] governments, local people often faced harsh taxes, forced labour and the loss of their land. This [[oppression]] gradually produced a strong desire for freedom. In many places, farmers and workers carried out a local [[uprising]] against their rulers, although these early revolts were usually defeated. Over time, resistance became better organised. Leaders wrote newspapers, formed political parties and encouraged ordinary citizens to join peaceful protests, while in other cases people had to [[take up arms]] to defend their rights. Every act of [[resistance]] required courage, and countless men and women made great [[sacrifices|sacrifice]], losing their homes, their freedom or even their lives. Their [[patriotic]] spirit inspired later generations. Eventually, many nations managed to [[liberate]] themselves, and they declared their [[independence]]. Yet winning formal freedom was only the first step. Protecting national [[sovereignty]] and rebuilding damaged economies remained difficult tasks, and the memory of the struggle still teaches people today about the value of unity.","words":[{"word":"colonial","phonetic":"/kəˈləʊniəl/","type":"adjective","vi":"(thuộc) thực dân, thuộc địa","use":"colonial rule / power / era / government","family":"colony (n), colonise (v), colonialism (n)","synonym":"imperial","antonym":"-","example":"The country was under [[colonial]] rule for almost a century."},{"word":"oppression","phonetic":"/əˈpreʃn/","type":"noun","vi":"sự áp bức","use":"fight against / suffer oppression; political oppression","family":"oppress (v), oppressive (adj), oppressor (n)","synonym":"persecution, tyranny","antonym":"freedom, liberty","example":"People rose against years of [[oppression]]."},{"word":"uprising","phonetic":"/ˈʌpraɪzɪŋ/","type":"noun","vi":"cuộc khởi nghĩa, nổi dậy","use":"an armed / popular uprising; crush an uprising","family":"rise up (v)","synonym":"revolt, rebellion","antonym":"-","example":"The [[uprising]] was crushed within a few months."},{"word":"take up arms","phonetic":"/teɪk ʌp ˈɑːmz/","type":"idiom","vi":"cầm vũ khí, đứng lên chiến đấu","use":"take up arms against / to defend","family":"arms (n)","synonym":"fight, rebel","antonym":"lay down arms","example":"Villagers [[took up arms]] to defend their homeland."},{"word":"resistance","phonetic":"/rɪˈzɪstəns/","type":"noun","vi":"sự kháng cự, cuộc kháng chiến","use":"armed / peaceful resistance; resistance to / against","family":"resist (v), resistant (adj)","synonym":"opposition, defiance","antonym":"surrender, submission","example":"The war of [[resistance]] lasted nine years."},{"word":"sacrifice","phonetic":"/ˈsækrɪfaɪs/","type":"noun, verb","vi":"sự hy sinh; hy sinh","use":"make a sacrifice; sacrifice one's life / time for","family":"-","synonym":"giving up, offering","antonym":"gain, selfishness","example":"Soldiers made great [[sacrifices]] for their country."},{"word":"patriotic","phonetic":"/ˌpeɪtriˈɒtɪk/","type":"adjective","vi":"yêu nước","use":"a patriotic song / spirit / duty","family":"patriot (n), patriotism (n)","synonym":"nationalistic","antonym":"unpatriotic","example":"The film is full of [[patriotic]] feeling."},{"word":"liberate","phonetic":"/ˈlɪbəreɪt/","type":"verb","vi":"giải phóng","use":"liberate a city / a country / prisoners","family":"liberation (n), liberty (n), liberator (n)","synonym":"free, set free","antonym":"enslave, occupy","example":"The army [[liberated]] the capital in 1945."},{"word":"independence","phonetic":"/ˌɪndɪˈpendəns/","type":"noun","vi":"nền độc lập, sự tự lập","use":"gain / declare / win independence from; Independence Day","family":"independent (adj), independently (adv)","synonym":"freedom, self-rule","antonym":"dependence","example":"The nation declared its [[independence]] in 1945."},{"word":"sovereignty","phonetic":"/ˈsɒvrənti/","type":"noun","vi":"chủ quyền","use":"national sovereignty; defend / respect sovereignty over","family":"sovereign (adj, n)","synonym":"supreme power, autonomy","antonym":"-","example":"Every country must respect the [[sovereignty]] of others."}]},{"day":19,"title":"Teaching and Lifelong Learning","topic":"Education","reading":"In a world that changes quickly, education no longer ends on graduation day. The idea of [[lifelong learning]] suggests that people should continue to study throughout their lives, whether in classrooms or online. Schools play an important part in this process. A well-designed [[curriculum]] does not merely list facts; it helps pupils [[acquire]] skills such as critical thinking and teamwork. Good teachers also [[enrich]] lessons with stories, experiments and discussions, making ideas easier to understand. Regular [[feedback]] shows learners where they are strong and where they need to improve, but test scores should not become the only goal of education. Adults face challenges too. Workers must regularly [[upskill]] to master new technology, and many also need a high level of [[proficiency]] in English to work for international companies. Starting a new subject can feel difficult at first because of the steep [[learning curve]], so a patient [[mentor]] can make a real difference by giving advice and encouragement. Teachers themselves must read widely and attend training courses in order to stay [[up-to-date]] with the latest research and teaching methods. Ultimately, curiosity is the best teacher.","words":[{"word":"lifelong learning","phonetic":"/ˌlaɪflɒŋ ˈlɜːnɪŋ/","type":"noun phrase","vi":"học tập suốt đời","use":"promote / encourage lifelong learning","family":"lifelong (adj), learn (v)","synonym":"continuing education","antonym":"-","example":"[[Lifelong learning]] helps workers stay employable."},{"word":"curriculum","phonetic":"/kəˈrɪkjələm/","type":"noun","vi":"chương trình giảng dạy","use":"the national / school curriculum; revise the curriculum","family":"curricular (adj)","synonym":"syllabus, programme of study","antonym":"-","example":"The school has added coding to its [[curriculum]]."},{"word":"acquire","phonetic":"/əˈkwaɪə/","type":"verb","vi":"đạt được, tiếp thu (kỹ năng, kiến thức)","use":"acquire skills / knowledge / a language / habits","family":"acquisition (n)","synonym":"gain, obtain, pick up","antonym":"lose, give up","example":"Children [[acquire]] language naturally through play."},{"word":"enrich","phonetic":"/ɪnˈrɪtʃ/","type":"verb","vi":"làm phong phú, làm giàu thêm","use":"enrich the soil / lives / experience / vocabulary","family":"enrichment (n), rich (adj)","synonym":"enhance, improve","antonym":"impoverish, diminish","example":"Travel can [[enrich]] your understanding of other cultures."},{"word":"feedback","phonetic":"/ˈfiːdbæk/","type":"noun","vi":"phản hồi, nhận xét","use":"give / receive / constructive feedback; feedback on sth","family":"-","synonym":"comments, response","antonym":"-","example":"The teacher gave students detailed [[feedback]] on their essays."},{"word":"upskill","phonetic":"/ˌʌpˈskɪl/","type":"verb","vi":"nâng cao kỹ năng","use":"upskill employees / workers; need to upskill","family":"skill (n), skilled (adj), upskilling (n)","synonym":"retrain, improve skills","antonym":"deskill","example":"Many employees [[upskill]] online after work."},{"word":"proficiency","phonetic":"/prəˈfɪʃnsi/","type":"noun","vi":"sự thành thạo, trình độ","use":"language proficiency; a high level of proficiency in sth","family":"proficient (adj)","synonym":"competence, mastery","antonym":"incompetence","example":"The job requires a high level of [[proficiency]] in English."},{"word":"learning curve","phonetic":"/ˈlɜːnɪŋ kɜːv/","type":"noun phrase","vi":"quá trình/độ khó khi học một điều mới","use":"a steep learning curve","family":"-","synonym":"-","antonym":"-","example":"Using this software involves a steep [[learning curve]]."},{"word":"mentor","phonetic":"/ˈmentɔː/","type":"noun, verb","vi":"người cố vấn, người hướng dẫn; kèm cặp","use":"act as a mentor; mentor young teachers","family":"mentoring (n)","synonym":"adviser, guide, tutor","antonym":"-","example":"My [[mentor]] helped me prepare for the interview."},{"word":"up-to-date","phonetic":"/ˌʌp tə ˈdeɪt/","type":"adjective","vi":"cập nhật, mới nhất","use":"up-to-date information / equipment; keep up to date","family":"update (v, n)","synonym":"current, modern","antonym":"outdated, old-fashioned","example":"Make sure your knowledge is [[up-to-date]]."}]},{"day":20,"title":"Energy and Pollution","topic":"Environment","reading":"Modern life depends on energy, but the way we produce and use it has serious consequences. For more than a century, most countries have burned coal, oil and gas, and the result is poor [[air quality]] in many large cities. Traffic and factories also create thick [[smog]] that damages people's lungs. Pollution does not only affect the air: [[toxic]] chemicals from industry can [[contaminate]] rivers and soil, putting both wildlife and farmers at risk. Waste is another problem. Cities must [[dispose of]] millions of tonnes of rubbish every year, and much of it ends up in a [[landfill]] where it takes decades to break down. Because supplies are limited, some experts warn that humans may eventually [[run out of]] easily accessible oil, and that careless mining and drilling will [[deplete]] natural resources faster than nature can replace them. Many governments therefore invest in [[renewable]] sources. Engineers have learned to [[harness]] the power of wind, sunlight and flowing water, and new technology makes these sources cheaper every year. Although the transition will take time, cleaner energy offers a healthier future.","words":[{"word":"air quality","phonetic":"/ˈeə ˌkwɒləti/","type":"noun phrase","vi":"chất lượng không khí","use":"poor / improve / monitor air quality; air quality index","family":"air (n), quality (n)","synonym":"air purity","antonym":"air pollution","example":"Heavy traffic has lowered the [[air quality]] in the city centre."},{"word":"toxic","phonetic":"/ˈtɒksɪk/","type":"adjective","vi":"độc hại","use":"toxic chemicals / waste / gas; highly toxic","family":"toxin (n), toxicity (n)","synonym":"poisonous, harmful","antonym":"harmless, non-toxic","example":"The factory released [[toxic]] waste into the river."},{"word":"dispose of","phonetic":"/dɪˈspəʊz əv/","type":"phrasal verb","vi":"vứt bỏ, xử lý","use":"dispose of waste / rubbish safely","family":"disposal (n), disposable (adj)","synonym":"get rid of, throw away","antonym":"keep, retain","example":"Factories must [[dispose of]] chemicals safely."},{"word":"smog","phonetic":"/smɒɡ/","type":"noun","vi":"khói bụi (sương mù ô nhiễm)","use":"thick smog; smog over the city","family":"smoggy (adj)","synonym":"-","antonym":"clean air","example":"[[Smog]] covered the city for several days."},{"word":"contaminate","phonetic":"/kənˈtæmɪneɪt/","type":"verb","vi":"làm ô nhiễm, nhiễm bẩn","use":"contaminate water / soil / food","family":"contamination (n), contaminant (n)","synonym":"pollute, poison","antonym":"purify, clean","example":"Waste from the factory [[contaminated]] the river."},{"word":"run out of","phonetic":"/rʌn aʊt əv/","type":"phrasal verb","vi":"cạn kiệt, hết","use":"run out of fuel / time / money / water","family":"-","synonym":"use up, exhaust","antonym":"-","example":"We are going to [[run out of]] clean water if we waste it."},{"word":"landfill","phonetic":"/ˈlændfɪl/","type":"noun","vi":"bãi chôn lấp rác","use":"a landfill site; send waste to landfill","family":"land (n), fill (v)","synonym":"rubbish dump, tip","antonym":"recycling","example":"Most household rubbish still ends up in a [[landfill]]."},{"word":"renewable","phonetic":"/rɪˈnjuːəbl/","type":"adjective","vi":"có thể tái tạo","use":"renewable energy / sources / resources","family":"renew (v), renewal (n)","synonym":"sustainable","antonym":"non-renewable, finite","example":"Solar and wind are [[renewable]] sources of energy."},{"word":"harness","phonetic":"/ˈhɑːnɪs/","type":"verb, noun","vi":"khai thác, tận dụng (sức mạnh tự nhiên)","use":"harness the power of wind / the sun / technology","family":"-","synonym":"exploit, utilise","antonym":"waste","example":"Engineers [[harness]] the power of rivers to make electricity."},{"word":"deplete","phonetic":"/dɪˈpliːt/","type":"verb","vi":"làm cạn kiệt","use":"deplete resources / reserves / the ozone layer","family":"depletion (n), depleted (adj)","synonym":"use up, exhaust","antonym":"replenish, restore","example":"Overfishing can [[deplete]] fish stocks very quickly."}]},{"day":21,"title":"Technology and Artificial Intelligence","topic":"Science","reading":"[[Artificial intelligence|artificial intelligence]] has moved from science fiction into everyday life within a single generation. Researchers have achieved a remarkable [[breakthrough]] in language and image recognition, and companies now use [[cutting-edge]] systems to [[automate|automate]] tasks that once required human judgement. Every film suggestion on a streaming platform is produced by an [[algorithm]] that studies our viewing habits. Many workers fear that their skills will become [[obsolete]], yet history suggests that new technologies also create new kinds of jobs. The real challenge is to [[keep pace with]] change through lifelong learning. Meanwhile, schools, hospitals and banks increasingly [[rely on]] digital tools, which makes [[data privacy]] a serious concern. Careless handling of personal information may [[pose a threat to]] individuals and even to national security. Governments are therefore drafting rules to make sure that innovation remains safe, fair and transparent. Experts agree that machines should support human decisions rather than replace them completely, and that every citizen should understand how these systems work. Only then can society enjoy the benefits of progress without losing public trust.","words":[{"word":"artificial intelligence","phonetic":"/ˌɑːtɪfɪʃl ɪnˈtelɪdʒəns/","type":"noun phrase","vi":"trí tuệ nhân tạo","use":"AI; develop / use / be powered by artificial intelligence","family":"artificial (adj), intelligent (adj), intelligence (n)","synonym":"machine intelligence","antonym":"natural intelligence","example":"[[Artificial intelligence]] can now translate speech in real time."},{"word":"automate","phonetic":"/ˈɔːtəmeɪt/","type":"verb","vi":"tự động hoá","use":"automate a process / task / production line","family":"automation (n), automatic (adj), automated (adj)","synonym":"mechanise, computerise","antonym":"do by hand","example":"The factory has [[automated]] most of its production line."},{"word":"cutting-edge","phonetic":"/ˌkʌtɪŋ ˈedʒ/","type":"adjective","vi":"tiên tiến nhất, hiện đại nhất","use":"cutting-edge technology / research / design","family":"-","synonym":"state-of-the-art, advanced, innovative","antonym":"outdated, old-fashioned","example":"The laboratory is equipped with [[cutting-edge]] technology."},{"word":"breakthrough","phonetic":"/ˈbreɪkθruː/","type":"noun","vi":"bước đột phá","use":"a major / scientific / medical breakthrough; make a breakthrough in sth","family":"break through (phr v)","synonym":"advance, discovery","antonym":"setback","example":"Scientists have made a major [[breakthrough]] in cancer research."},{"word":"keep pace with","phonetic":"/kiːp ˈpeɪs wɪð/","type":"collocation","vi":"theo kịp","use":"keep pace with technology / demand / inflation","family":"pace (n, v)","synonym":"keep up with","antonym":"fall behind","example":"Schools must [[keep pace with]] rapid changes in technology."},{"word":"rely on","phonetic":"/rɪˈlaɪ ɒn/","type":"phrasal verb","vi":"dựa vào, phụ thuộc vào","use":"rely on somebody / something for sth; rely on sb to do sth","family":"reliable (adj), reliability (n), reliance (n)","synonym":"depend on, count on","antonym":"-","example":"Many people [[rely on]] their phones to find directions."},{"word":"data privacy","phonetic":"/ˈdeɪtə ˈprɪvəsi/","type":"noun phrase","vi":"quyền riêng tư dữ liệu","use":"protect / violate data privacy; data privacy laws","family":"private (adj), privately (adv)","synonym":"information security","antonym":"-","example":"New laws were introduced to protect [[data privacy]] online."},{"word":"algorithm","phonetic":"/ˈælɡərɪðəm/","type":"noun","vi":"thuật toán","use":"a search / recommendation algorithm; design an algorithm","family":"algorithmic (adj)","synonym":"set of rules, formula","antonym":"-","example":"The app uses an [[algorithm]] to suggest songs you might like."},{"word":"obsolete","phonetic":"/ˈɒbsəliːt/","type":"adjective","vi":"lỗi thời, không còn dùng nữa","use":"become / render obsolete; obsolete equipment / skills","family":"obsolescence (n)","synonym":"outdated, out of date","antonym":"up-to-date, current","example":"Typewriters became [[obsolete]] once computers were widely used."},{"word":"pose a threat to","phonetic":"/ˌpəʊz ə ˈθret tuː/","type":"collocation","vi":"gây mối đe doạ cho","use":"pose a serious / real threat to sb / sth","family":"threat (n), threaten (v), threatening (adj)","synonym":"endanger, jeopardise","antonym":"protect, safeguard","example":"Cyber attacks [[pose a threat to]] banks and hospitals."}]},{"day":22,"title":"Tourism and Local Economy","topic":"Economic","reading":"Tourism has become one of the most important sources of income for many coastal and mountain regions. A famous [[tourist attraction]] can [[generate revenue]] not only for hotels but also for small restaurants, drivers and craft sellers. Visitors who want to go [[off the beaten track]] often bring money to remote villages that had few other opportunities, helping to [[revitalise]] the local economy. For many families, tourism is the main [[livelihood]]. However, rapid growth brings problems. Popular destinations may become [[overcrowded]] in peak months, and the jobs they offer are often [[seasonal]], leaving workers uncertain during the low season. Roads, airports and water supplies need modern [[infrastructure]] to cope with the demand. Another worry is the loss of local [[heritage]] when traditions are changed simply to please visitors. Many experts therefore call for [[sustainable]] tourism, which protects the environment and culture while still providing fair income for residents. When local people take part in planning and share the profits, they are more willing to protect their own villages, beaches and festivals for the future.","words":[{"word":"tourist attraction","phonetic":"/ˈtɔːrɪst əˈtrækʃn/","type":"noun phrase","vi":"điểm thu hút khách du lịch","use":"a popular / major tourist attraction; visit a tourist attraction","family":"tour (n, v), tourism (n), attract (v), attractive (adj)","synonym":"sight, landmark","antonym":"-","example":"The ancient citadel is the city's main [[tourist attraction]]."},{"word":"generate revenue","phonetic":"/ˈdʒenəreɪt ˈrevənjuː/","type":"collocation","vi":"tạo ra doanh thu","use":"generate revenue from tourism / sales / advertising","family":"generation (n), generator (n)","synonym":"bring in income, earn money","antonym":"lose money","example":"Festivals [[generate revenue]] for local businesses."},{"word":"revitalise","phonetic":"/ˌriːˈvaɪtəlaɪz/","type":"verb","vi":"làm hồi sinh, tiếp thêm sức sống","use":"revitalise the economy / a community / an area","family":"revitalisation (n), vital (adj)","synonym":"rejuvenate, regenerate","antonym":"weaken, undermine","example":"New investment helped to [[revitalise]] the town centre."},{"word":"heritage","phonetic":"/ˈherɪtɪdʒ/","type":"noun","vi":"di sản","use":"cultural / national heritage; a World Heritage Site","family":"inherit (v), inheritance (n)","synonym":"legacy, tradition","antonym":"-","example":"The old town is part of the nation's cultural [[heritage]]."},{"word":"sustainable","phonetic":"/səˈsteɪnəbl/","type":"adjective","vi":"bền vững","use":"sustainable tourism / development / growth","family":"sustain (v), sustainability (n), sustainably (adv)","synonym":"eco-friendly, viable","antonym":"unsustainable, harmful","example":"The resort uses [[sustainable]] energy to protect the environment."},{"word":"livelihood","phonetic":"/ˈlaɪvlihʊd/","type":"noun","vi":"kế sinh nhai, sinh kế","use":"earn / make a livelihood; threaten sb's livelihood","family":"-","synonym":"means of living, income","antonym":"-","example":"Fishing is the main [[livelihood]] of the island's villagers."},{"word":"off the beaten track","phonetic":"/ˌɒf ðə ˌbiːtn ˈtræk/","type":"idiom","vi":"xa những lối mòn, nơi ít người biết đến","use":"go / travel off the beaten track","family":"beat (v)","synonym":"remote, unexplored, secluded","antonym":"touristy, crowded","example":"We stayed in a small village [[off the beaten track]]."},{"word":"infrastructure","phonetic":"/ˈɪnfrəstrʌktʃə/","type":"noun","vi":"cơ sở hạ tầng","use":"transport / modern infrastructure; invest in infrastructure","family":"-","synonym":"facilities, public works","antonym":"-","example":"Poor [[infrastructure]] discourages tourists from visiting remote areas."},{"word":"seasonal","phonetic":"/ˈsiːzənl/","type":"adjective","vi":"theo mùa, có tính thời vụ","use":"seasonal work / workers / demand","family":"season (n), seasonally (adv)","synonym":"periodic, temporary","antonym":"year-round, permanent","example":"Many hotel staff only have [[seasonal]] jobs."},{"word":"overcrowded","phonetic":"/ˌəʊvəˈkraʊdɪd/","type":"adjective","vi":"quá đông đúc","use":"overcrowded beaches / cities / classrooms","family":"overcrowding (n), crowd (n, v)","synonym":"congested, packed","antonym":"deserted, empty","example":"The beach was [[overcrowded]] during the summer holidays."}]},{"day":23,"title":"Urbanisation and Housing","topic":"Society","reading":"Rapid city growth is one of the most powerful trends of the modern age. Every year, millions of people [[relocate]] from the countryside to cities in search of better jobs, schools and hospitals. This movement drives economic growth, but it also creates serious pressure. In some capitals, [[overpopulation]] has led to a severe [[shortage]] of homes, so that low-income workers cannot find [[affordable housing]] and are forced to live in crowded [[slums|slum]] on the edge of the city. Even those who find a flat may struggle, because the average [[tenant]] spends nearly half of their income on rent. At the same time, new [[residential]] areas keep spreading outwards, a process known as [[urban sprawl]], which swallows farmland and increases the distance between home and work. Many residents must [[commute]] for two hours a day, and traffic [[congestion]] wastes time and money and pollutes the air. To solve these problems, planners propose building well-connected public transport, protecting parks, and encouraging developers to build more reasonably priced apartments in town centres rather than far away. If cities are planned wisely, they can remain healthy and pleasant places in which to live.","words":[{"word":"tenant","phonetic":"/ˈtenənt/","type":"noun","vi":"người thuê nhà","use":"a tenant pays rent to a landlord; evict a tenant","family":"tenancy (n)","synonym":"renter, lodger","antonym":"landlord","example":"The [[tenant]] must pay the rent on the first day of each month."},{"word":"relocate","phonetic":"/ˌriːləʊˈkeɪt/","type":"verb","vi":"chuyển đến nơi khác, di dời","use":"relocate to a city / abroad; relocate staff","family":"relocation (n), location (n)","synonym":"move, resettle","antonym":"stay put, remain","example":"Many young people [[relocate]] to cities after graduation."},{"word":"overpopulation","phonetic":"/ˌəʊvəˌpɒpjuˈleɪʃn/","type":"noun","vi":"tình trạng dân số quá tải","use":"suffer from overpopulation; problems caused by overpopulation","family":"populate (v), population (n), overpopulated (adj)","synonym":"overcrowding","antonym":"underpopulation","example":"[[Overpopulation]] puts a strain on water and food supplies."},{"word":"affordable housing","phonetic":"/əˌfɔːdəbl ˈhaʊzɪŋ/","type":"noun phrase","vi":"nhà ở giá phải chăng","use":"provide / build affordable housing; a lack of affordable housing","family":"afford (v), affordability (n), house (v)","synonym":"low-cost housing","antonym":"luxury housing","example":"The city plans to build more [[affordable housing]] for young families."},{"word":"shortage","phonetic":"/ˈʃɔːtɪdʒ/","type":"noun","vi":"sự thiếu hụt","use":"a shortage of + noun; a housing / food / labour shortage","family":"short (adj), shorten (v)","synonym":"lack, scarcity","antonym":"surplus, abundance","example":"There is a serious [[shortage]] of teachers in rural areas."},{"word":"slum","phonetic":"/slʌm/","type":"noun","vi":"khu ổ chuột","use":"live in a slum; slum areas / dwellers","family":"-","synonym":"shantytown","antonym":"-","example":"Many families still live in [[slums]] without clean water."},{"word":"residential","phonetic":"/ˌrezɪˈdenʃl/","type":"adjective","vi":"(thuộc) khu dân cư, để ở","use":"a residential area / building / district","family":"reside (v), resident (n), residence (n)","synonym":"domestic","antonym":"commercial, industrial","example":"They bought a flat in a quiet [[residential]] area."},{"word":"commute","phonetic":"/kəˈmjuːt/","type":"verb, noun","vi":"đi lại hằng ngày (từ nhà đến chỗ làm)","use":"commute to work; a long commute; commute by train","family":"commuter (n)","synonym":"travel to work","antonym":"-","example":"She [[commutes]] to the city centre by bus every day."},{"word":"congestion","phonetic":"/kənˈdʒestʃən/","type":"noun","vi":"sự tắc nghẽn, ùn tắc","use":"traffic congestion; ease / reduce congestion","family":"congest (v), congested (adj)","synonym":"gridlock, traffic jam","antonym":"free flow","example":"A new metro line should reduce traffic [[congestion]]."},{"word":"urban sprawl","phonetic":"/ˌɜːbən ˈsprɔːl/","type":"noun phrase","vi":"sự đô thị hoá lan rộng, tràn ra vùng ven","use":"control / limit / prevent urban sprawl","family":"urban (adj), sprawl (v, n)","synonym":"suburban expansion","antonym":"compact city","example":"Poor planning has led to uncontrolled [[urban sprawl]]."}]},{"day":24,"title":"Personality and Decision-making","topic":"Psychology","reading":"Why do some people make decisions quickly while others take weeks to choose? Psychologists believe that personality plays an important part. An [[outgoing]] person usually enjoys talking to others and often asks friends for advice, whereas a more reserved person prefers to think alone. Another important [[trait|trait]] is how people deal with risk. An [[impulsive]] buyer may purchase an expensive phone in a few minutes and regret it later, but a careful person will [[weigh up]] the advantages and disadvantages first. Good decision-makers try to be [[rational]]: they collect reliable information, [[take into account]] the opinions of others, and think about the long-term [[consequences|consequence]] of each option. They are also [[open-minded]], which means that they are willing to change their view when new evidence appears. Of course, too much analysis can be harmful. Some people [[hesitate]] for so long that the opportunity disappears. In the end, however, someone has to [[make up their mind|make up one's mind]]. Learning to balance emotion with logic is a skill that can be practised, and it helps young people at every stage of their lives.","words":[{"word":"trait","phonetic":"/treɪt/","type":"noun","vi":"nét tính cách, đặc điểm","use":"a personality / character / genetic trait; share a trait","family":"-","synonym":"characteristic, feature, quality","antonym":"-","example":"Honesty is a [[trait]] that employers value highly."},{"word":"outgoing","phonetic":"/ˌaʊtˈɡəʊɪŋ/","type":"adjective","vi":"hướng ngoại, cởi mở","use":"an outgoing personality / person / nature","family":"go out (phr v)","synonym":"sociable, extrovert","antonym":"shy, reserved, introverted","example":"He is an [[outgoing]] boy who makes friends easily."},{"word":"impulsive","phonetic":"/ɪmˈpʌlsɪv/","type":"adjective","vi":"bốc đồng, hành động theo cảm tính","use":"an impulsive decision / person / purchase","family":"impulse (n), impulsively (adv)","synonym":"hasty, rash, spontaneous","antonym":"cautious, careful","example":"Her [[impulsive]] decision to quit surprised everyone."},{"word":"weigh up","phonetic":"/ˌweɪ ˈʌp/","type":"phrasal verb","vi":"cân nhắc","use":"weigh up the pros and cons / options / evidence","family":"weight (n), weigh (v)","synonym":"consider, evaluate","antonym":"ignore","example":"You should [[weigh up]] the risks before investing."},{"word":"rational","phonetic":"/ˈræʃnəl/","type":"adjective","vi":"có lý trí, hợp lý","use":"a rational decision / explanation / person","family":"rationally (adv), rationality (n), rationalise (v)","synonym":"logical, sensible, reasonable","antonym":"irrational, emotional","example":"A [[rational]] person thinks carefully before acting."},{"word":"take into account","phonetic":"/ˌteɪk ˈɪntu əˈkaʊnt/","type":"collocation","vi":"tính đến, xem xét đến","use":"take sth into account; take into account + factors / opinions","family":"account (n, v)","synonym":"consider, bear in mind","antonym":"overlook, disregard","example":"The committee must [[take into account]] the views of local residents."},{"word":"consequence","phonetic":"/ˈkɒnsɪkwəns/","type":"noun","vi":"hậu quả, kết quả","use":"serious / far-reaching consequences; as a consequence of","family":"consequent (adj), consequently (adv)","synonym":"result, outcome, effect","antonym":"cause","example":"Every choice has its [[consequences]]."},{"word":"open-minded","phonetic":"/ˌəʊpən ˈmaɪndɪd/","type":"adjective","vi":"cởi mở, sẵn sàng tiếp thu ý kiến","use":"an open-minded attitude / person; be open-minded about sth","family":"open mind (n)","synonym":"tolerant, receptive","antonym":"narrow-minded, prejudiced","example":"A good leader is [[open-minded]] and listens to criticism."},{"word":"hesitate","phonetic":"/ˈhezɪteɪt/","type":"verb","vi":"do dự, ngập ngừng","use":"hesitate to do sth; hesitate over / about sth; don't hesitate to ask","family":"hesitation (n), hesitant (adj)","synonym":"pause, waver","antonym":"act immediately","example":"Don't [[hesitate]] to ask if you need help."},{"word":"make up one's mind","phonetic":"/ˌmeɪk ʌp wʌnz ˈmaɪnd/","type":"idiom","vi":"quyết định, hạ quyết tâm","use":"make up your mind about / whether…; make one's mind up","family":"-","synonym":"decide, come to a decision","antonym":"be undecided","example":"She still can't [[make up her mind]] which university to choose."}]},{"day":25,"title":"Trade Routes and Cultural Exchange","topic":"History","reading":"For centuries, [[trade routes|trade route]] connected distant parts of the world and did far more than move goods. The Silk Road, a network of land and sea paths linking Asia with Europe, is the most famous example. [[Merchants|merchant]] travelled in a long [[caravan]] of camels, carrying silk, spices and tea, and every valuable [[commodity]] passed through many hands before reaching its final buyer. Cities located at important crossroads [[prospered|prosper]], because they collected taxes and offered rest to tired travellers. Along the [[maritime]] routes of Southeast Asia, ships carried pottery and rice from port to port. Yet people exchanged ideas as well as products. Religions, languages, music and technologies spread with the traders, and this [[cultural exchange]] enriched every society it touched. Local communities often [[adopted|adopt]] foreign customs and adapted them to their own needs. Contact between distant peoples [[fostered|foster]] new art styles and new cuisines. Later, improvements in navigation [[facilitated|facilitate]] the great voyages of exploration, which linked the continents even more closely. Today, the legacy of these ancient connections can still be seen in museums, festivals and everyday food.","words":[{"word":"trade route","phonetic":"/ˈtreɪd ruːt/","type":"noun phrase","vi":"tuyến đường thương mại","use":"an ancient / major / maritime trade route; control a trade route","family":"trade (n, v), trader (n)","synonym":"commercial route","antonym":"-","example":"The Silk Road was the most famous ancient [[trade route]]."},{"word":"merchant","phonetic":"/ˈmɜːtʃənt/","type":"noun","vi":"thương nhân, người buôn bán","use":"a wealthy / foreign merchant; merchant ship","family":"merchandise (n)","synonym":"trader, dealer","antonym":"-","example":"Arab [[merchants]] brought spices to European markets."},{"word":"caravan","phonetic":"/ˈkærəvæn/","type":"noun","vi":"đoàn lữ hành, đoàn người và thú vật đi buôn","use":"a camel caravan; join a caravan","family":"-","synonym":"convoy, expedition","antonym":"-","example":"The [[caravan]] crossed the desert in six weeks."},{"word":"commodity","phonetic":"/kəˈmɒdəti/","type":"noun","vi":"hàng hoá, mặt hàng","use":"a valuable / basic commodity; commodity prices / markets","family":"-","synonym":"goods, product","antonym":"-","example":"Salt was once a precious [[commodity]]."},{"word":"prosper","phonetic":"/ˈprɒspə/","type":"verb","vi":"thịnh vượng, phát đạt","use":"prosper economically; businesses / towns prosper","family":"prosperity (n), prosperous (adj)","synonym":"thrive, succeed","antonym":"decline, fail","example":"Towns along the Silk Road [[prospered]] from trade."},{"word":"maritime","phonetic":"/ˈmærɪtaɪm/","type":"adjective","vi":"(thuộc) hàng hải, biển","use":"maritime trade / law / history / routes","family":"-","synonym":"naval, nautical, seafaring","antonym":"inland","example":"Hoi An was an important [[maritime]] trading port."},{"word":"cultural exchange","phonetic":"/ˌkʌltʃərəl ɪksˈtʃeɪndʒ/","type":"noun phrase","vi":"giao lưu văn hoá","use":"promote / encourage cultural exchange; a cultural exchange programme","family":"culture (n), exchange (n, v)","synonym":"cultural interaction","antonym":"cultural isolation","example":"Student programmes encourage [[cultural exchange]] between nations."},{"word":"adopt","phonetic":"/əˈdɒpt/","type":"verb","vi":"tiếp nhận, áp dụng, nhận nuôi","use":"adopt a policy / method / custom / attitude","family":"adoption (n), adoptive (adj)","synonym":"take on, embrace","antonym":"reject, abandon","example":"Many countries have [[adopted]] new methods of teaching."},{"word":"foster","phonetic":"/ˈfɒstə/","type":"verb","vi":"thúc đẩy, nuôi dưỡng","use":"foster creativity / cooperation / understanding","family":"-","synonym":"encourage, promote","antonym":"hinder, discourage","example":"Trade can [[foster]] understanding between nations."},{"word":"facilitate","phonetic":"/fəˈsɪlɪteɪt/","type":"verb","vi":"tạo điều kiện thuận lợi, làm cho dễ dàng","use":"facilitate trade / communication / learning","family":"facility (n), facilitation (n)","synonym":"enable, make easier","antonym":"hinder, obstruct","example":"Better roads [[facilitate]] trade between regions."}]},{"day":26,"title":"E-commerce and Competition","topic":"Economic","reading":"Online shopping has changed the way people buy almost everything. [[E-commerce|e-commerce]] allows a [[consumer]] to compare prices from home, read reviews and receive a parcel within days. For a [[retailer]], an online shop reaches customers in distant provinces without the cost of renting a large store. As a result, many traditional [[brick-and-mortar]] shops are struggling, and some have been forced to [[go out of business]]. To survive, companies must [[gain an edge over]] their [[competitors|competitor]]. Some [[undercut]] rivals by offering lower prices, though this strategy cannot last for long because profits become very small. Others invest in fast delivery and efficient [[logistics]], so that goods arrive on time and in perfect condition. Still others focus on [[customer loyalty]], using membership cards, personal recommendations and excellent after-sales service to keep buyers coming back. Competition benefits shoppers by lowering prices and improving quality, but it can be harsh on small sellers that lack money for advertising. Many experts suggest that the most successful businesses will combine physical stores with online platforms, offering convenience and a personal touch at the same time.","words":[{"word":"e-commerce","phonetic":"/ˈiː ˌkɒmɜːs/","type":"noun","vi":"thương mại điện tử","use":"e-commerce platform / sales / giant; the growth of e-commerce","family":"commerce (n), commercial (adj)","synonym":"online trading","antonym":"-","example":"[[E-commerce]] has grown rapidly since the pandemic."},{"word":"consumer","phonetic":"/kənˈsjuːmə/","type":"noun","vi":"người tiêu dùng","use":"consumer goods / spending / rights / confidence","family":"consume (v), consumption (n), consumerism (n)","synonym":"buyer, shopper, customer","antonym":"producer, manufacturer","example":"[[Consumers]] are increasingly buying products online."},{"word":"retailer","phonetic":"/ˈriːteɪlə/","type":"noun","vi":"nhà bán lẻ","use":"an online / high-street retailer; a major retailer","family":"retail (n, v, adj)","synonym":"shopkeeper, seller","antonym":"wholesaler","example":"The [[retailer]] offers free delivery on orders over a certain value."},{"word":"brick-and-mortar","phonetic":"/ˌbrɪk ən ˈmɔːtə/","type":"adjective","vi":"(cửa hàng) truyền thống, có mặt bằng thực","use":"a brick-and-mortar store / shop / business","family":"-","synonym":"traditional, physical","antonym":"online, virtual","example":"Many [[brick-and-mortar]] stores have opened online shops."},{"word":"gain an edge over","phonetic":"/ˌɡeɪn ən ˈedʒ ˈəʊvə/","type":"collocation","vi":"giành lợi thế hơn","use":"gain / have / give sb an edge over rivals","family":"edge (n, v)","synonym":"get ahead of, outdo","antonym":"fall behind","example":"Fast delivery helps the firm [[gain an edge over]] its rivals."},{"word":"customer loyalty","phonetic":"/ˈkʌstəmə ˈlɔɪəlti/","type":"noun phrase","vi":"sự trung thành của khách hàng","use":"build / earn / reward customer loyalty; a loyalty card","family":"customer (n), loyal (adj), loyalty (n)","synonym":"brand loyalty","antonym":"-","example":"Good service helps to build [[customer loyalty]]."},{"word":"logistics","phonetic":"/ləˈdʒɪstɪks/","type":"noun","vi":"hậu cần, khâu vận chuyển và kho bãi","use":"logistics company / network / costs; supply chain logistics","family":"logistic (adj), logistical (adj)","synonym":"distribution, supply chain","antonym":"-","example":"Efficient [[logistics]] ensure that parcels arrive on time."},{"word":"undercut","phonetic":"/ˌʌndəˈkʌt/","type":"verb","vi":"bán rẻ hơn (đối thủ)","use":"undercut a competitor / rival / price","family":"-","synonym":"sell cheaper than, underprice","antonym":"overcharge","example":"Small shops cannot [[undercut]] large supermarkets."},{"word":"go out of business","phonetic":"/ˌɡəʊ aʊt əv ˈbɪznəs/","type":"collocation","vi":"phá sản, ngừng kinh doanh","use":"force / drive sb out of business; go out of business","family":"bankrupt (adj), bankruptcy (n)","synonym":"go bankrupt, close down","antonym":"set up a business","example":"Dozens of small bookshops have [[gone out of business]]."},{"word":"competitor","phonetic":"/kəmˈpetɪtə/","type":"noun","vi":"đối thủ cạnh tranh","use":"a rival / major competitor; outperform a competitor","family":"compete (v), competition (n), competitive (adj)","synonym":"rival, opponent","antonym":"partner, ally","example":"The company lowered its prices to beat its [[competitors]]."}]},{"day":27,"title":"Health and Medicine","topic":"Science","reading":"Advances in medicine have helped people live longer and healthier lives. Thanks to [[vaccines|vaccine]], diseases that once killed thousands of children are now rare, because a vaccine trains the [[immune system]] to recognise a germ before it can cause serious harm. When a patient [[comes down with|come down with]] a fever or cough, a doctor examines the [[symptoms|symptom]] and may write a [[prescription]] for suitable medicine. Most people [[recover from]] common infections within a week, although a few treatments cause an unpleasant [[side effect]] such as sleepiness. Today, however, many illnesses are [[chronic]], which means they last for years; diabetes and heart disease are typical examples. They are often linked to unhealthy diets and lack of exercise, so doctors emphasise [[preventive]] care: regular check-ups, balanced meals and physical activity. Better hygiene and healthcare services have raised [[life expectancy]] in most countries, but they have also created new challenges, because ageing populations need more long-term care. Public health experts therefore argue that governments should spend more on education and early treatment instead of waiting until patients become seriously ill.","words":[{"word":"vaccine","phonetic":"/ˈvæksiːn/","type":"noun","vi":"vắc-xin","use":"a flu / measles vaccine; develop / receive a vaccine","family":"vaccinate (v), vaccination (n)","synonym":"jab, immunisation","antonym":"-","example":"Children receive a [[vaccine]] against measles at an early age."},{"word":"immune system","phonetic":"/ɪˈmjuːn ˌsɪstəm/","type":"noun phrase","vi":"hệ miễn dịch","use":"a strong / weak immune system; boost / weaken the immune system","family":"immune (adj), immunity (n), immunise (v)","synonym":"body's defences","antonym":"-","example":"Sleep and a balanced diet strengthen the [[immune system]]."},{"word":"come down with","phonetic":"/ˌkʌm ˈdaʊn wɪð/","type":"phrasal verb","vi":"mắc (bệnh)","use":"come down with flu / a cold / a fever","family":"-","synonym":"catch, contract, fall ill with","antonym":"recover from","example":"He [[came down with]] a fever after the trip."},{"word":"symptom","phonetic":"/ˈsɪmptəm/","type":"noun","vi":"triệu chứng","use":"show / develop symptoms; symptoms of flu / stress","family":"symptomatic (adj)","synonym":"sign, indication","antonym":"cure","example":"Coughing and a high temperature are common [[symptoms]] of flu."},{"word":"prescription","phonetic":"/prɪˈskrɪpʃn/","type":"noun","vi":"đơn thuốc","use":"write / fill a prescription; on prescription; prescription drugs","family":"prescribe (v)","synonym":"medical order","antonym":"-","example":"You need a [[prescription]] to buy this medicine."},{"word":"recover from","phonetic":"/rɪˈkʌvə frɒm/","type":"phrasal verb","vi":"hồi phục sau (bệnh, cú sốc)","use":"recover from an illness / injury / operation; make a full recovery","family":"recovery (n)","synonym":"get over, bounce back","antonym":"relapse, deteriorate","example":"She is slowly [[recovering from]] a serious operation."},{"word":"side effect","phonetic":"/ˈsaɪd ɪˌfekt/","type":"noun","vi":"tác dụng phụ","use":"cause / suffer side effects; side effects of a drug","family":"-","synonym":"adverse reaction","antonym":"benefit","example":"The drug can have unpleasant [[side effects]]."},{"word":"chronic","phonetic":"/ˈkrɒnɪk/","type":"adjective","vi":"mạn tính, kinh niên","use":"a chronic disease / illness / pain; chronic shortage","family":"chronically (adv)","synonym":"long-term, persistent","antonym":"acute, temporary","example":"He suffers from [[chronic]] back pain."},{"word":"preventive","phonetic":"/prɪˈventɪv/","type":"adjective","vi":"phòng ngừa","use":"preventive medicine / care / measures / healthcare","family":"prevent (v), prevention (n)","synonym":"protective, precautionary","antonym":"-","example":"[[Preventive]] care is cheaper than treating serious disease."},{"word":"life expectancy","phonetic":"/ˈlaɪf ɪkˌspektənsi/","type":"noun phrase","vi":"tuổi thọ trung bình","use":"average / rising / increase life expectancy","family":"expect (v), expectation (n)","synonym":"lifespan","antonym":"-","example":"Average [[life expectancy]] has risen in the last century."}]},{"day":28,"title":"Equality and Community","topic":"Society","reading":"A fair society gives every citizen the same chance to succeed, regardless of gender, background or income. In reality, however, [[equality]] is difficult to achieve. [[Discrimination|discrimination]] in schools and workplaces still affects many people, and children from low-income families often start life with fewer opportunities than their classmates. Elderly people, refugees and other [[vulnerable]] groups may also be left without the support they need. Minority groups and people with disabilities may feel [[marginalised|marginalise]], as though their voices do not count. To build an [[inclusive]] community, schools and employers need to listen to everyone and adjust their rules. Governments can also [[bridge the gap]] between rich and poor through scholarships, fair wages and public services that reach remote areas. Yet laws alone are not enough. Ordinary people play an equally important role. Many students choose to [[volunteer]] at shelters or libraries, and neighbours often [[lend a hand]] when a family faces an emergency. Such acts show [[solidarity]] and help to strengthen [[social cohesion]], the sense of belonging that keeps a community together in difficult times. When everyone feels respected, society becomes more stable, more creative and more peaceful for future generations.","words":[{"word":"equality","phonetic":"/iˈkwɒləti/","type":"noun","vi":"sự bình đẳng","use":"gender / racial / equal equality; equality of opportunity; equality before the law","family":"equal (adj), equalise (v), equally (adv)","synonym":"fairness, parity","antonym":"inequality","example":"The law guarantees [[equality]] between men and women."},{"word":"discrimination","phonetic":"/dɪˌskrɪmɪˈneɪʃn/","type":"noun","vi":"sự phân biệt đối xử","use":"discrimination against sb; racial / age / gender discrimination","family":"discriminate (v), discriminatory (adj)","synonym":"prejudice, bias, unfair treatment","antonym":"equality, fairness","example":"Laws forbid [[discrimination]] against older workers."},{"word":"vulnerable","phonetic":"/ˈvʌlnərəbl/","type":"adjective","vi":"dễ bị tổn thương, yếu thế","use":"vulnerable groups / people; vulnerable to sth","family":"vulnerability (n)","synonym":"defenceless, at risk","antonym":"secure, protected","example":"Elderly people are especially [[vulnerable]] to extreme heat."},{"word":"inclusive","phonetic":"/ɪnˈkluːsɪv/","type":"adjective","vi":"hoà nhập, bao gồm mọi người","use":"an inclusive society / education / policy","family":"include (v), inclusion (n)","synonym":"all-embracing, open to all","antonym":"exclusive, restrictive","example":"The school promotes [[inclusive]] education for all children."},{"word":"volunteer","phonetic":"/ˌvɒlənˈtɪə/","type":"verb, noun","vi":"tình nguyện; tình nguyện viên","use":"volunteer for / to do sth; volunteer work; a volunteer at / for","family":"voluntary (adj), voluntarily (adv)","synonym":"offer, help for free","antonym":"-","example":"She [[volunteers]] at a children's hospital every weekend."},{"word":"solidarity","phonetic":"/ˌsɒlɪˈdærəti/","type":"noun","vi":"sự đoàn kết","use":"show / express solidarity with sb; solidarity among members","family":"solid (adj)","synonym":"unity, togetherness","antonym":"division, disunity","example":"People showed great [[solidarity]] after the flood."},{"word":"marginalise","phonetic":"/ˈmɑːdʒɪnəlaɪz/","type":"verb","vi":"gạt ra bên lề, khiến bị cô lập","use":"marginalise minorities / the poor; feel marginalised","family":"margin (n), marginal (adj)","synonym":"sideline, exclude","antonym":"include, integrate","example":"Poverty can [[marginalise]] entire communities."},{"word":"bridge the gap","phonetic":"/ˌbrɪdʒ ðə ˈɡæp/","type":"idiom","vi":"thu hẹp khoảng cách","use":"bridge the gap between A and B (rich and poor / generations)","family":"bridge (n, v), gap (n)","synonym":"narrow the gap, close the gap","antonym":"widen the gap","example":"Education can help [[bridge the gap]] between rich and poor."},{"word":"social cohesion","phonetic":"/ˌsəʊʃl kəʊˈhiːʒn/","type":"noun phrase","vi":"sự gắn kết xã hội","use":"promote / strengthen / undermine social cohesion","family":"social (adj), cohesive (adj)","synonym":"community spirit, unity","antonym":"social division","example":"Shared festivals strengthen [[social cohesion]]."},{"word":"lend a hand","phonetic":"/ˌlend ə ˈhænd/","type":"idiom","vi":"giúp một tay","use":"lend a hand with / to do sth; lend sb a hand","family":"-","synonym":"help out, assist","antonym":"hinder","example":"Neighbours came to [[lend a hand]] after the storm."}]},{"day":29,"title":"Happiness and Personal Growth","topic":"Psychology","reading":"Many people believe that happiness comes from money or success, but research suggests that it depends more on [[well-being]] and a sense of purpose. A person who feels [[fulfilment]] in daily work or study is more likely to be content than someone who simply chases a high salary. Personal growth, however, rarely follows a straight line. Every learner meets a [[setback]] sooner or later, such as a failed exam or a rejected application. The ability to [[bounce back]] helps us recover and try again. People with strong [[self-awareness]] understand their own strengths and weaknesses, so they accept criticism more calmly. Psychologists also recommend practising [[gratitude]], which means noticing and appreciating the good things in life instead of dwelling on problems. Many people also find [[inner peace]] through quiet walks or meditation, which reduces worry about the future. Strong [[motivation]] is another key factor, since it keeps us working towards our goals even when progress is slow. Finally, growth requires us to leave our [[comfort zone]] and try unfamiliar activities, such as joining a club or speaking in public. Those who accept such challenges often discover talents they never knew they had and learn to [[thrive]] in new situations.","words":[{"word":"well-being","phonetic":"/ˌwel ˈbiːɪŋ/","type":"noun","vi":"sức khoẻ và hạnh phúc, trạng thái an lạc","use":"mental / emotional / physical well-being; improve well-being","family":"well-being is uncountable","synonym":"welfare, happiness","antonym":"distress","example":"Regular exercise improves both physical and mental [[well-being]]."},{"word":"fulfilment","phonetic":"/fʊlˈfɪlmənt/","type":"noun","vi":"sự thoả mãn, cảm giác viên mãn","use":"a sense of fulfilment; personal / job fulfilment","family":"fulfil (v), fulfilled (adj)","synonym":"satisfaction, contentment","antonym":"frustration, disappointment","example":"Teaching gives her a deep sense of [[fulfilment]]."},{"word":"setback","phonetic":"/ˈsetbæk/","type":"noun","vi":"trở ngại, sự thất bại","use":"suffer / experience / face a setback; a major setback","family":"set back (phr v)","synonym":"obstacle, difficulty, reverse","antonym":"progress, advance","example":"The injury was a serious [[setback]] for the young athlete."},{"word":"bounce back","phonetic":"/ˌbaʊns ˈbæk/","type":"phrasal verb","vi":"phục hồi nhanh, lấy lại phong độ","use":"bounce back from failure / defeat / a setback","family":"-","synonym":"recover, rebound","antonym":"give up, collapse","example":"She managed to [[bounce back]] after failing the exam."},{"word":"self-awareness
