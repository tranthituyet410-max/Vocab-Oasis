function buildQuiz(src, dayArg) {

  var LEGAL_DATA = {"terms":{"vi":{"title":"Điều khoản sử dụng","sub":"Vocab Oasis | Cập nhật lần cuối: 25/10/2026","updated":"Cập nhật lần cuối: 25/10/2026","sections":[["1. Chấp nhận điều khoản",["Khi tạo tài khoản, đăng nhập hoặc sử dụng Vocab Oasis (“Dịch vụ”), bạn đồng ý bị ràng buộc bởi Điều khoản sử dụng này (“Điều khoản”) và Chính sách bảo mật của chúng tôi. Nếu không đồng ý, vui lòng không sử dụng Dịch vụ."]],["2. Về Dịch vụ",["Vocab Oasis là nền tảng trực tuyến giúp người dùng học và ôn tập từ vựng thông qua danh sách từ, thẻ ghi nhớ (flashcard), bài kiểm tra và các công cụ học tập liên quan. Dịch vụ được vận hành phi lợi nhuận, hoàn toàn miễn phí và không thu bất kỳ khoản phí nào; hiện chúng tôi chưa có kế hoạch cung cấp dịch vụ trả phí. Chúng tôi có thể thêm, thay đổi hoặc gỡ bỏ tính năng bất cứ lúc nào."]],["3. Điều kiện sử dụng và tài khoản",[["Bạn phải từ đủ 13 tuổi trở lên để sử dụng Dịch vụ. Nếu bạn chưa đủ tuổi thành niên theo quy định, bạn cần có sự đồng ý của cha mẹ hoặc người giám hộ hợp pháp.","Bạn phải cung cấp thông tin chính xác khi đăng ký và luôn cập nhật thông tin đó.","Bạn chịu trách nhiệm bảo mật mật khẩu và mọi hoạt động diễn ra trên tài khoản của mình. Hãy thông báo ngay cho chúng tôi nếu nghi ngờ tài khoản bị truy cập trái phép.","Mỗi người không được tạo nhiều tài khoản nhằm mục đích lạm dụng Dịch vụ."]]],["4. Quy tắc sử dụng",["Bạn đồng ý không:",["Sử dụng Dịch vụ cho mục đích bất hợp pháp, gây hại, gian lận hoặc lạm dụng;","Cố gắng tấn công, dò quét, làm quá tải, gây gián đoạn hoặc truy cập trái phép vào Dịch vụ, tài khoản hoặc máy chủ;","Dùng bot, công cụ thu thập dữ liệu hoặc công cụ tự động để lấy dữ liệu, nội dung từ Dịch vụ khi chưa có sự cho phép bằng văn bản của chúng tôi;","Tải lên mã độc, thư rác hoặc nội dung xúc phạm, thù ghét, khiêu dâm, hoặc xâm phạm quyền của người khác;","Sao chép, bán lại hoặc phân phối lại Dịch vụ hay nội dung của Dịch vụ vì mục đích thương mại khi chưa được phép."]]],["5. Nội dung học tập và quyền sở hữu trí tuệ",["Dịch vụ, bao gồm thiết kế, phần mềm, logo, danh sách từ vựng, câu ví dụ và các tài liệu khác, thuộc quyền sở hữu của Vocab Oasis hoặc các bên cấp phép và được bảo vệ bởi pháp luật về sở hữu trí tuệ. Chúng tôi cấp cho bạn quyền sử dụng có giới hạn, cá nhân, không độc quyền, không thể chuyển nhượng và có thể bị thu hồi để học tập phi thương mại."]],["6. Nội dung do người dùng tạo",["Nếu bạn tạo hoặc tải lên nội dung (ví dụ: danh sách từ riêng, ghi chú, bình luận), bạn vẫn giữ quyền sở hữu nội dung đó. Bạn cấp cho chúng tôi giấy phép không độc quyền, trên phạm vi toàn cầu, miễn phí để lưu trữ, hiển thị và xử lý nội dung đó chỉ nhằm vận hành và cải thiện Dịch vụ. Bạn chịu trách nhiệm đảm bảo nội dung của mình không vi phạm pháp luật hoặc quyền của bên thứ ba. Chúng tôi có thể gỡ bỏ nội dung vi phạm Điều khoản này."]],["7. Tính khả dụng và thay đổi",["Chúng tôi cố gắng duy trì Dịch vụ hoạt động nhưng không đảm bảo Dịch vụ luôn liên tục hoặc không có lỗi. Chúng tôi có thể tạm ngừng hoặc điều chỉnh Dịch vụ để bảo trì, cập nhật hoặc vì lý do khác, có hoặc không có thông báo trước."]],["8. Miễn trừ bảo đảm",["Dịch vụ được cung cấp trên cơ sở “nguyên trạng” và “như hiện có”, không kèm bất kỳ bảo đảm nào, dù rõ ràng hay ngụ ý. Chúng tôi không đảm bảo Dịch vụ đáp ứng mục tiêu học tập của bạn hoặc nội dung hoàn toàn chính xác, không có sai sót."]],["9. Giới hạn trách nhiệm",["Trong phạm vi tối đa mà pháp luật cho phép, Vocab Oasis cùng chủ sở hữu, thành viên và đối tác không chịu trách nhiệm đối với các thiệt hại gián tiếp, ngẫu nhiên, đặc biệt hoặc hệ quả, cũng như việc mất dữ liệu hoặc lợi nhuận phát sinh từ việc bạn sử dụng hoặc không thể sử dụng Dịch vụ."]],["10. Tạm ngừng và chấm dứt",["Bạn có thể ngừng sử dụng Dịch vụ và xóa tài khoản bất cứ lúc nào. Chúng tôi có thể tạm ngừng hoặc chấm dứt quyền truy cập của bạn nếu bạn vi phạm Điều khoản này hoặc theo yêu cầu của pháp luật, có hoặc không có thông báo trước."]],["11. Thay đổi điều khoản",["Chúng tôi có thể cập nhật Điều khoản này theo thời gian. Khi đó, chúng tôi sẽ cập nhật ngày “Cập nhật lần cuối” và, khi phù hợp, thông báo cho bạn trên Dịch vụ hoặc qua email. Việc bạn tiếp tục sử dụng sau khi thay đổi có hiệu lực đồng nghĩa với việc bạn chấp nhận Điều khoản đã cập nhật."]],["12. Luật áp dụng",["Điều khoản này được điều chỉnh bởi pháp luật nước Cộng hòa Xã hội Chủ nghĩa Việt Nam. Mọi tranh chấp trước hết sẽ được giải quyết thông qua thương lượng thiện chí; nếu không thành, sẽ được đưa ra tòa án có thẩm quyền tại Việt Nam."]],["13. Liên hệ",["Nếu có câu hỏi về Điều khoản này, vui lòng liên hệ: bykendy.ng@gmail.com."]]]},"en":{"title":"Terms of Use","sub":"Vocab Oasis | Last updated: October 25, 2026","updated":"Last updated: October 25, 2026","sections":[["1. Acceptance of Terms",["By creating an account, logging in, or using Vocab Oasis (the “Service”), you agree to be bound by these Terms of Use (“Terms”) and our Privacy Policy. If you do not agree, please do not use the Service."]],["2. About the Service",["Vocab Oasis is an online platform that helps users learn and review vocabulary through word lists, flashcards, quizzes, and related learning tools. The Service is operated on a non-profit basis, is free to use, and does not charge any fees; we currently have no plans to introduce paid services. We may add, change, or remove features at any time."]],["3. Eligibility and Accounts",[["You must be at least 13 years old to use the Service. If you are under the age of majority in your country, you must have permission from a parent or legal guardian.","You must provide accurate information when registering and keep it up to date.","You are responsible for keeping your password confidential and for all activity under your account. Notify us immediately if you suspect unauthorized access.","One person may not maintain multiple accounts for the purpose of abusing the Service."]]],["4. Acceptable Use",["You agree not to:",["Use the Service for any unlawful, harmful, sequential damages, or for loss of data or profits, arising from your use of or inability to use the Service."]],["10. Suspension and Termination",["You may stop using the Service and delete your account at any time. We may suspend or terminate your access if you violate these Terms or if required by law, with or without prior notice."]],["11. Changes to These Terms",["We may update these Terms from time to time. When we do, we will update the “Last updated” date and, where appropriate, notify you on the Service or by email. Continued use after changes take effect means you accept the updated Terms."]],["12. Governing Law",["These Terms are governed by the laws of the Socialist Republic of Vietnam. Any dispute will first be resolved through good-faith negotiation; if unresolved, it will be brought before the competent courts in Vietnam."]],["13. Contact",["If you have questions about these Terms, contact us at: bykendy.ng@gmail.com."]]]}},"privacy":{"vi":{"title":"Chính sách bảo mật","sub":"Vocab Oasis | Cập nhật lần cuối: 25/10/2026","updated":"Cập nhật lần cuối: 25/10/2026","sections":[["1. Giới thiệu",["Chính sách bảo mật này giải thích cách Vocab Oasis (“chúng tôi”) thu thập, sử dụng, lưu trữ và bảo vệ dữ liệu cá nhân của bạn khi bạn sử dụng Dịch vụ học từ vựng của chúng tôi. Khi sử dụng Dịch vụ, bạn xác nhận đã đọc và đồng ý với Chính sách này."]],["2. Thông tin chúng tôi thu thập",[["Thông tin tài khoản: tên hoặc tên người dùng, địa chỉ email, mật khẩu (được lưu dưới dạng mã hóa/băm), ảnh đại diện nếu bạn cung cấp. Bạn có thể đăng nhập bằng email hoặc tài khoản Google; khi dùng đăng nhập Google, chúng tôi nhận tên, địa chỉ email và ảnh đại diện từ Google.","Dữ liệu học tập: các từ bạn học hoặc lưu, danh sách từ riêng, kết quả bài kiểm tra, tiến độ, chuỗi ngày học và cài đặt học tập.","Dữ liệu kỹ thuật: địa chỉ IP, loại thiết bị, trình duyệt, hệ điều hành, ngôn ngữ, các trang đã truy cập và dữ liệu nhật ký.","Cookie và công nghệ tương tự: dùng để duy trì đăng nhập, ghi nhớ tùy chọn và phân tích việc sử dụng (xem Mục 6).","Thông tin liên lạc: các tin nhắn bạn gửi cho chúng tôi (ví dụ: yêu cầu hỗ trợ hoặc phản hồi)."]]],["3. Cách chúng tôi sử dụng thông tin",[["Tạo và quản lý tài khoản, cung cấp Dịch vụ cho bạn;","Lưu tiến độ học và cá nhân hóa trải nghiệm học tập;","Duy trì, bảo vệ và cải thiện Dịch vụ, bao gồm sửa lỗi và ngăn chặn gian lận, lạm dụng;","Liên lạc với bạn về Dịch vụ, cập nhật và hỗ trợ;","Tuân thủ các nghĩa vụ pháp lý."]]],["4. Sự đồng ý và cơ sở pháp lý",["Chúng tôi xử lý dữ liệu cá nhân của bạn dựa trên sự đồng ý của bạn, nhu cầu thực hiện thỏa thuận với bạn (Điều khoản sử dụng), lợi ích hợp pháp của chúng tôi trong việc vận hành và bảo vệ Dịch vụ, và các yêu cầu của pháp luật. Bạn có thể rút lại sự đồng ý bất cứ lúc nào, tuy nhiên điều này có thể ảnh hưởng đến khả năng sử dụng một số tính năng."]],["5. Chia sẻ thông tin",["Chúng tôi không bán dữ liệu cá nhân của bạn. Chúng tôi chỉ có thể chia sẻ dữ liệu:",["Với các nhà cung cấp dịch vụ hỗ trợ vận hành Dịch vụ (ví dụ: lưu trữ, xác thực, phân tích, email) và có nghĩa vụ bảo mật;","Khi pháp luật hoặc cơ quan có thẩm quyền yêu cầu;","Để bảo vệ quyền lợi của chúng tôi, người dùng hoặc sự an toàn của Dịch vụ;","Khi có sự đồng ý của bạn, hoặc trong trường hợp sáp nhập, mua lại hay chuyển giao Dịch vụ (chúng tôi sẽ thông báo khi pháp luật yêu cầu)."]]],["6. Cookie",["Chúng tôi sử dụng cookie và công nghệ tương tự cho các chức năng thiết yếu (đăng nhập và bảo mật), tùy chọn cá nhân và phân tích. Bạn có thể quản lý hoặc tắt cookie trong cài đặt trình duyệt, nhưng một số tính năng có thể không hoạt động đúng."]],["7. Thời gian lưu trữ dữ liệu",["Chúng tôi lưu giữ dữ liệu của bạn trong thời gian tài khoản còn hoạt động hoặc khi cần thiết để cung cấp Dịch vụ. Khi bạn xóa tài khoản, chúng tôi sẽ xóa hoặc ẩn danh hóa dữ liệu cá nhân của bạn trong một khoảng thời gian hợp lý, trừ khi phải lưu giữ để tuân thủ pháp luật hoặc giải quyết tranh chấp."]],["8. Bảo mật dữ liệu",["Chúng tôi áp dụng các biện pháp kỹ thuật và tổ chức hợp lý (như mã hóa khi truyền tải, băm mật khẩu và kiểm soát truy cập) để bảo vệ dữ liệu của bạn. Tuy nhiên, không hệ thống nào an toàn tuyệt đối và chúng tôi không thể đảm bảo an toàn tuyệt đối. Vui lòng giữ bí mật mật khẩu của bạn."]],["9. Quyền của bạn",["Theo quy định pháp luật hiện hành, bạn có quyền:",["Truy cập và nhận bản sao dữ liệu cá nhân của mình;","Chỉnh sửa dữ liệu không chính xác hoặc chưa đầy đủ;","Xóa dữ liệu hoặc tài khoản của bạn;","Phản đối hoặc hạn chế một số hoạt động xử lý;","Rút lại sự đồng ý bất cứ lúc nào."],"Để thực hiện các quyền này, vui lòng liên hệ chúng tôi theo thông tin tại Mục 13."]],["10. Quyền riêng tư của trẻ em",["Dịch vụ không dành cho trẻ em dưới 13 tuổi. Chúng tôi không cố ý thu thập dữ liệu cá nhân của trẻ em dưới 13 tuổi. Nếu bạn cho rằng trẻ em đã cung cấp dữ liệu cá nhân cho chúng tôi, vui lòng liên hệ để chúng tôi xóa dữ liệu đó."]],["11. Chuyển dữ liệu ra nước ngoài",["Dữ liệu của bạn có thể được xử lý trên máy chủ đặt ngoài quốc gia bạn sinh sống. Trong trường hợp đó, chúng tôi thực hiện các bước hợp lý để đảm bảo dữ liệu được bảo vệ theo quy định pháp luật và Chính sách này."]],["12. Thay đổi chính sách",["Chúng tôi có thể cập nhật Chính sách này theo thời gian. Chúng tôi sẽ cập nhật ngày “Cập nhật lần cuối” và, khi phù hợp, thông báo cho bạn trên Dịch vụ hoặc qua email. Việc tiếp tục sử dụng Dịch vụ sau khi thay đổi đồng nghĩa với việc bạn chấp nhận Chính sách đã cập nhật."]],["13. Liên hệ",["Mọi câu hỏi hoặc yêu cầu liên quan đến Chính sách này hoặc dữ liệu cá nhân của bạn, vui lòng liên hệ: bykendy.ng@gmail.com."]]]},"en":{"title":"Privacy Policy","sub":"Vocab Oasis | Last updated: October 25, 2026","updated":"Last updated: October 25, 2026","sections":[["1. Introduction",["This Privacy Policy explains how Vocab Oasis (“we”, “us”) collects, uses, stores, and protects your personal data when you use our vocabulary learning Service. By using the Service, you acknowledge that you have read and agree to this Policy."]],["2. Information We Collect",[["Account information: name or username, email address, password (stored in encrypted/hashed form), and profile picture if you provide one. You can sign in with email or with your Google account; when you use Google sign-in, we receive your name, email address, and profile picture from Google.","Learning data: words you study or save, custom word lists, quiz results, progress, streaks, and learning settings.","Technical data: IP address, device type, browser, operating system, language, pages visited, and log data.","Cookies and similar technologies: used to keep you signed in, remember preferences, and analyze usage (see Section 6).","Communications: messages you send us (e.g., support requests or feedback)."]]],["3. How We Use Your Information",[["To create and manage your account and provide the Service;","To save your progress and personalize your learning experience;","To maintain, secure, and improve the Service, including fixing bugs and preventing fraud or abuse;","To communicate with you about the Service, updates, and support;","To comply with legal obligations."]]],["4. Consent and Legal Basis",["We process your personal data based on your consent, the need to perform our agreement with you (the Terms of Use), our legitimate interests in operating and securing the Service, and legal requirements. You may withdraw your consent at any time, although this may affect your ability to use some features."]],["5. Sharing of Information",["We do not sell your personal data. We may share data only:",["With service providers that help us operate the Service (e.g., hosting, authentication, analytics, email), under confidentiality obligations;","When required by law or a competent authority;","To protect our rights, users, or the safety of the Service;","With your consent, or in connection with a merger, acquisition, or transfer of the Service (we will notify you where required)."]]],["6. Cookies",["We use cookies and similar technologies for essential functions (login and security), preferences, and analytics. You can manage or disable cookies in your browser settings, but some features may not work properly."]],["7. Data Retention",["We keep your data for as long as your account is active or as needed to provide the Service. When you delete your account, we will delete or anonymize your personal data within a reasonable period, unless we must keep it to comply with the law or resolve disputes."]],["8. Data Security",["We apply reasonable technical and organizational measures (such as encryption in transit, hashed passwords, and access controls) to protect your data. However, no system is completely secure, and we cannot guarantee absolute security. Please keep your password confidential."]],["9. Your Rights",["Subject to applicable law, you have the right to:",["Access and receive a copy of your personal data;","Correct inaccurate or incomplete data;","Delete your data or your account;","Object to or restrict certain processing;","Withdraw consent at any time."],"To exercise these rights, contact us using the details in Section 13."]],["10. Children’s Privacy",["The Service is not intended for children under 13. We do not knowingly collect personal data from children under 13. If you believe a child has provided us with personal data, please contact us and we will delete it."]],["11. International Data Transfers",["Your data may be processed on servers located outside your country of residence. Where this happens, we take reasonable steps to ensure your data is protected in accordance with applicable law and this Policy."]],["12. Changes to This Policy",["We may update this Policy from time to time. We will update the “Last updated” date and, where appropriate, notify you on the Service or by email. Continued use of the Service after changes means you accept the updated Policy."]],["13. Contact Us",["For questions or requests regarding this Policy or your personal data, contact us at: bykendy.ng@gmail.com."]]]}}};

  var EMAIL_RE = /([\w.+-]+@[\w-]+\.[\w.-]+[\w-])/;

  function appendText(parent, text) {
    text.split(EMAIL_RE).forEach(function (part, i) {
      if (i % 2 === 1) {
        var a = document.createElement('a');
        a.href = 'mailto:' + part;
        a.textContent = part;
        parent.appendChild(a);
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
  }

  function renderLegal() {
    var doc = LEGAL_DATA[legalType][legalLang];
    var wrap = document.createElement('div');

    var meta = document.createElement('p');
    meta.className = 'doc-meta';
    meta.textContent = doc.sub;
    wrap.appendChild(meta);

    doc.sections.forEach(function (sec) {
      var h3 = document.createElement('h3');
      h3.textContent = sec[0];
      wrap.appendChild(h3);
      sec[1].forEach(function (block) {
        if (Array.isArray(block)) {
          var ul = document.createElement('ul');
          block.forEach(function (item) {
            var li = document.createElement('li');
            appendText(li, item);
            ul.appendChild(li);
          });
          wrap.appendChild(ul);
        } else {
          var p = document.createElement('p');
          appendText(p, block);
          wrap.appendChild(p);
        }
      });
    });

    legalBody.replaceChildren(wrap);
    legalBody.scrollTop = 0;
    $('legal-title').textContent = doc.title;
    $('legal-modal').setAttribute('aria-label', doc.title);
    $('legal-updated').textContent = doc.updated;
    root.querySelectorAll('.lang-switch button').forEach(function (b) {
      var on = b.getAttribute('data-lang') === legalLang;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }

  function openLegal(type, opener) {
    legalType = type;
    legalOpener = opener || null;
    renderLegal();
    overlay.hidden = false;
    legalBody.focus({ preventScroll: true });
  }
  function closeLegal() {
    overlay.hidden = true;
    if (legalOpener) legalOpener.focus();
  }

  root.querySelectorAll('.lang-switch button').forEach(function (b) {
    b.addEventListener('click', function () {
      legalLang = b.getAttribute('data-lang');
      renderLegal();
    });
  });

  root.querySelectorAll('[data-legal]').forEach(function (b) {
    b.addEventListener('click', function () { openLegal(b.getAttribute('data-legal'), b); });
  });
  $('legal-close').addEventListener('click', closeLegal);
  overlay.addEventListener('mousedown', closeLegal);
  $('legal-modal').addEventListener('mousedown', function (e) { e.stopPropagation(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hidden) closeLegal();
  });

  render();
})();
</script>
<script>
(function () {
  const host = document.getElementById('fbHost');
  const root = host.shadowRoot;
  const FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycbyP4uj92YrQQBS99xCmSZgFFNM6qqKE49hvLpgboBgdhORvdyeLUYIENp5twsUyHHvHcw/exec";

  const $ = (id) => root.getElementById(id);
  const form = $("fb"), btn = $("btn");

  function showErr(id, text) { $(id).textContent = text || ""; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showErr("msgErr"); showErr("mailErr"); showErr("sendErr");

    const feedback = $("msg").value.trim();
    const email = $("email").value.trim();
    let ok = true;

    if (!feedback) { showErr("msgErr", "Bạn viết giúp mình vài dòng góp ý nha."); ok = false; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr("mailErr", "Email này chưa đúng định dạng, bạn kiểm tra lại nhé (hoặc để trống cũng được)."); ok = false; }
    if (!ok) { (feedback ? $("email") : $("msg")).focus(); return; }

    if ($("hp").value) { return finish(); }

    btn.disabled = true; btn.textContent = "Đang gửi...";
    try {
      if (FORM_ENDPOINT) {
        await fetch(FORM_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ feedback, email, sentAt: new Date().toISOString() })
        });
      }
      finish();
    } catch (err) {
      showErr("sendErr", "Chưa gửi được rồi, bạn kiểm tra mạng và bấm gửi lại giúp mình nhé.");
    } finally {
      btn.disabled = false; btn.textContent = "Gửi góp ý";
    }
  });

  function finish() {
    $("formView").hidden = true;
    $("doneView").hidden = false;
    form.reset();
  }
  $("again").addEventListener("click", () => {
    $("doneView").hidden = true;
    $("formView").hidden = false;
    $("msg").focus();
  });

  function openFb() {
    if (!host.classList.contains('hidden')) return;
    if (!$("doneView").hidden) { $("doneView").hidden = true; $("formView").hidden = false; }
    host.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    host.scrollTop = 0;
    setTimeout(() => { try { $("msg").focus({ preventScroll: true }); } catch (e) { } }, 60);
  }
  function closeFb() {
    host.classList.add('hidden');
    document.body.style.overflow = '';
    const b = document.getElementById('fbbtn'); if (b) b.focus({ preventScroll: true });
  }
  $("fbBack").addEventListener("click", closeFb);
  $("back2").addEventListener("click", closeFb);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !host.classList.contains('hidden') && !document.getElementById('dlg')) closeFb();
  });
  window.VocabFeedback = { open: openFb, close: closeFb };
})();
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MAIN_TITLE = 'Vocab Oasis · 30 ngày chinh phục từ vựng';
  var gate = window.VocabGate = {
    entered: false, resolved: false,
    hideBoot: function () { var b = $('boot'); if (b) b.remove(); },
    showLogin: function () {
      this.resolved = true; this.hideBoot();
      $('appRoot').classList.add('hidden'); $('authHost').classList.remove('hidden');
      document.title = 'Vocab Oasis – Đăng nhập';
    },
    enter: function (user) {
      this.resolved = true;
      window.VocabUser = { name: user.displayName || '', email: user.email || '' };
      if (this.entered) return;
      this.entered = true;
      var self = this;
      var go = function () {
        if (!self.entered) return;
        self.hideBoot();
        if (window.VocabAuthUI && window.VocabAuthUI.reset) window.VocabAuthUI.reset();
        $('authHost').classList.add('hidden'); $('appRoot').classList.remove('hidden');
        document.title = MAIN_TITLE;
        window.VocabApp.start();
      };
      var cloud = window.VocabCloud;
      if (cloud && cloud.load) {
        Promise.race([cloud.load(user), new Promise(function (r) { setTimeout(r, 8000); })]).catch(function () { }).then(go);
      } else go();
    },
    leave: function () {
      if (this.entered) { this.entered = false; window.VocabApp.stop(); }
      window.VocabUser = null; this.showLogin();
    }
  };
  setTimeout(function () { if (!gate.resolved) gate.showLogin(); }, 6000);
})();
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  getAuth, setPersistence, browserLocalPersistence, browserSessionPersistence,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup,
  GoogleAuthProvider, sendPasswordResetEmail, updateProfile, onAuthStateChanged, signOut
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDmiTr8SnSMVhg8t-WLdDWhMlWIlPyxIf0',
  authDomain: 'vocab-oasis.firebaseapp.com',
  projectId: 'vocab-oasis',
  storageBucket: 'vocab-oasis.firebasestorage.app',
  messagingSenderId: '500315907538',
  appId: '1:500315907538:web:6eb5700eaf7b098421940b'
};
const USERS_COLLECTION = 'users';

const ui = window.VocabAuthUI;

const MESSAGES = {
  'auth/invalid-email': 'Email chưa đúng định dạng.',
  'auth/missing-password': 'Bạn chưa nhập mật khẩu.',
  'auth/invalid-credential': 'Email hoặc mật khẩu chưa đúng.',
  'auth/user-not-found': 'Email hoặc mật khẩu chưa đúng.',
  'auth/wrong-password': 'Email hoặc mật khẩu chưa đúng.',
  'auth/email-already-in-use': 'Email này đã có tài khoản rồi, bạn thử đăng nhập nhé.',
  'auth/weak-password': 'Mật khẩu hơi yếu, dùng ít nhất 8 ký tự nhé.',
  'auth/too-many-requests': 'Bạn thử quá nhiều lần, đợi một lát rồi thử lại nhé.',
  'auth/network-request-failed': 'Mất kết nối mạng, bạn thử lại nhé.',
  'auth/popup-closed-by-user': 'Bạn đã đóng cửa sổ đăng nhập Google.',
  'auth/popup-blocked': 'Trình duyệt đang chặn cửa sổ đăng nhập Google, hãy cho phép pop-up rồi thử lại.',
  'auth/account-exists-with-different-credential': 'Email này đã đăng ký theo cách khác, bạn đăng nhập bằng email và mật khẩu nhé.',
  'auth/unauthorized-domain': 'Tên miền này chưa có trong Authorized domains của Firebase.',
  'auth/operation-not-allowed': 'Phương thức đăng nhập này chưa được bật trong Firebase Authentication.',
  'auth/operation-not-supported-in-this-environment': 'Hãy mở trang qua http://localhost (không mở trực tiếp file) để đăng nhập Google.',
  'auth/invalid-api-key': 'apiKey trong firebaseConfig chưa đúng.',
  'auth/user-disabled': 'Tài khoản này đã bị vô hiệu hóa.'
};
const SILENT = ['auth/cancelled-popup-request'];

function showError(err) {
  const code = err && err.code;
  if (SILENT.includes(code)) return;
  console.error(err);
  ui.setMessage('error', MESSAGES[code] || 'Có lỗi xảy ra, bạn thử lại sau nhé.');
}

const configured = !firebaseConfig.apiKey.startsWith('YOUR_');

if (!configured) {
  const todo = () => ui.setMessage('error', 'Chưa điền firebaseConfig trong file (tìm "CẤU HÌNH FIREBASE").');
  ui.handlers = { submit: todo, google: todo, forgot: todo, logout: () => {} };
  window.VocabGate.showLogin();
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  auth.languageCode = 'vi';
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();
  googleProvider.setCustomParameters({ prompt: 'select_account' });

  async function saveProfile(user, provider, name) {
    const ref = doc(db, USERS_COLLECTION, user.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      await updateDoc(ref, { lastLoginAt: serverTimestamp() });
      return;
    }
    await setDoc(ref, {
      uid: user.uid,
      displayName: (name || user.displayName || (user.email || '').split('@')[0] || 'Bạn').slice(0, 80),
      email: user.email || '',
      photoURL: user.photoURL || null,
      provider,
      createdAt: serverTimestamp(),
      lastLoginAt: serverTimestamp()
    });
  }

  async function finishSignIn(user, provider, name) {
    try {
      await saveProfile(user, provider, name);
    } catch (err) {
      console.error('Không lưu được hồ sơ vào Firestore (kiểm tra Rules):', err);
    }
  }

  const CLOUD = window.VocabCloud = (function () {
    const st = () => window.VocabStore;
    let uid = null, ready = false, lastUpd = 0, timer = null, pushing = false;
    const setStatus = (state) => { const s = st(); if (s) s.status = { state, at: Date.now() }; };
    const refDoc = () => doc(db, USERS_COLLECTION, uid);
    async function fetchCloud() {
      const snap = await getDoc(refDoc());
      const d = snap.exists() ? snap.data() : {};
      return { str: typeof d.progress === 'string' ? d.progress : null, upd: Number(d.progressUpd) || 0 };
    }
    async function push() {
      if (!ready || !uid || pushing) return;
      pushing = true;
      try {
        const c = await fetchCloud();
        if (c.str && c.upd > lastUpd) {
          if (st().busy()) { schedule(); return; }
          st().apply(c.str); lastUpd = c.upd; setStatus('ok');
          return;
        }
        const snap = st().snapshot();
        await setDoc(refDoc(), { progress: snap.str, progressUpd: snap.upd, progressSavedAt: serverTimestamp() }, { merge: true });
        lastUpd = snap.upd; setStatus('ok');
      } catch (err) {
        console.error('Không đồng bộ được tiến độ lên Firestore (kiểm tra Rules):', err);
        setStatus('error');
      } finally { pushing = false; }
    }
    function schedule() { if (!ready || timer) return; timer = setTimeout(() => { timer = null; push(); }, 5000); }
    async function flush() { if (timer) { clearTimeout(timer); timer = null; } await push(); }
    async function load(user) {
      uid = user.uid; ready = false;
      const s = st();
      try {
        const m0 = s.meta();
        if (m0.uid && m0.uid !== uid) s.reset();
        const c = await fetchCloud();
        const m = s.meta();
        let useCloud = false;
        if (c.str) {
          if (m.uid === uid) useCloud = c.upd > m.upd;
          else if (!m.uid) { let cx = 0; try { cx = JSON.parse(c.str).xp || 0; } catch (e) { } useCloud = m.xp <= cx; }
          else useCloud = true;
        }
        if (useCloud) { s.apply(c.str); lastUpd = c.upd; } else { lastUpd = c.upd; }
        s.setUid(uid);
        ready = true; setStatus('ok');
        if (!useCloud) push();
      } catch (err) {
        console.error('Không tải được tiến độ từ Firestore (kiểm tra Rules):', err);
        setStatus('error');
      }
    }
    async function pull() {
      if (!ready || pushing) return;
      try {
        const c = await fetchCloud();
        if (c.str && c.upd > lastUpd && !st().busy()) { st().apply(c.str); lastUpd = c.upd; setStatus('ok'); }
      } catch (e) { }
    }
    function stop() { ready = false; uid = null; if (timer) { clearTimeout(timer); timer = null; } }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); else flush(); });
    return { load, schedule, flush, stop, uid: () => (ready ? uid : null) };
  })();

  let authBusy = false;
  async function run(remember, job) {
    ui.clearMessage();
    ui.setBusy(true);
    authBusy = true;
    try {
      await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
      await job();
      if (auth.currentUser) window.VocabGate.enter(auth.currentUser);
    } catch (err) {
      showError(err);
    } finally {
      authBusy = false;
      ui.setBusy(false);
    }
  }

  async function registerWithEmail(name, email, password) {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const cleanName = name.slice(0, 80);
    await updateProfile(cred.user, { displayName: cleanName });
    await finishSignIn(cred.user, 'password', cleanName);
  }
  async function loginWithEmail(email, password) {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await finishSignIn(cred.user, 'password');
  }
  async function loginWithGoogle() {
    const cred = await signInWithPopup(auth, googleProvider);
    await finishSignIn(cred.user, 'google.com');
  }

  ui.handlers = {
    submit(mode, v, remember) {
      if (mode === 'register' && v.password.length < 8) {
        ui.setMessage('error', 'Mật khẩu cần tối thiểu 8 ký tự.');
        return;
      }
      return run(remember, () =>
        mode === 'register' ? registerWithEmail(v.name, v.email, v.password) : loginWithEmail(v.email, v.password)
      );
    },
    google(remember) {
      return run(remember, loginWithGoogle);
    },
    async forgot(email) {
      if (!email) {
        ui.setMessage('error', 'Nhập email vào ô Email trước, rồi bấm lại "Quên mật khẩu?" nhé.');
        return;
      }
      ui.clearMessage();
      ui.setBusy(true);
      try {
        await sendPasswordResetEmail(auth, email);
        ui.setMessage('success', 'Đã gửi link đặt lại mật khẩu tới ' + email + '. Nhớ xem cả mục Spam nhé.');
      } catch (err) {
        showError(err);
      } finally {
        ui.setBusy(false);
      }
    },
    async logout() {
      try { await CLOUD.flush(); } catch (e) { }
      CLOUD.stop();
      return signOut(auth).then(() => ui.clearMessage());
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (authBusy) return;
    if (user) window.VocabGate.enter(user); else { CLOUD.stop(); window.VocabGate.leave(); }
  });
}
</script>
