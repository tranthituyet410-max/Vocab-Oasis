<style>
:root {
  --background: #fffbeb;
  --surface: #fffdf5;
  --card: #fff8dc;
  --foreground: #44200a;
  --muted-foreground: #94643d;
  --primary: #d97706;
  --primary-dark: #b45309;
  --secondary: #fde68a;
  --muted: #fef3c7;
  --accent: #06b6d4;
  --accent-soft: #cffafe;
  --coral: #ef806f;
  --green: #65a30d;
  --green-soft: #ecfccb;
  --border: #f2d6a2;
  --shadow: 0 8px 30px rgba(120, 53, 15, .08);
  --radius: 18px;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Nunito", sans-serif; }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(6,182,212,.32); outline-offset: 2px; }
.app-shell { min-height: 100vh; display: flex; }
.sidebar { width: 248px; height: 100vh; position: fixed; inset: 0 auto 0 0; padding: 26px 18px 20px; background: rgba(255,253,245,.96); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 28px; }
.brand-mark { width: 39px; height: 39px; border-radius: 12px; background: var(--primary); position: relative; overflow: hidden; box-shadow: 0 5px 12px rgba(217,119,6,.25); }
.brand-mark:before { content: ""; width: 17px; height: 27px; background: #fff7ed; border-radius: 10px 10px 3px 3px; position: absolute; left: 11px; top: 8px; }
.brand-mark:after { content: ""; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; position: absolute; left: 15px; top: 13px; }
.brand strong { display: block; font-size:20.8px; line-height: 1.1; }
.brand small { display: block; color: var(--muted-foreground); font-size:12.3px; margin-top: 4px; letter-spacing: .02em; }
nav { display: grid; gap: 6px; }
nav button { border: 0; background: transparent; min-height: 46px; padding: 0 13px; display: flex; align-items: center; gap: 12px; border-radius: 12px; color: var(--muted-foreground); font-weight: 700; text-align: left; transition: .2s; }
nav button:hover { background: var(--card); color: var(--primary-dark); transform: translateX(2px); }
nav button.active { background: var(--muted); color: var(--primary-dark); box-shadow: inset 3px 0 var(--primary); }
nav button em { margin-left: auto; font-style: normal; width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--coral); font-size:14.3px; }
.journey { margin: auto 0 16px; padding: 16px; border: 1px solid var(--border); background: var(--card); border-radius: 15px; }
.journey-top { display: flex; justify-content: space-between; font-size:14.3px; font-weight: 800; }
.journey-top b { color: var(--primary); }
.journey-track, .flash-progress i, .quiz-progress i, .game-progress i { display: block; height: 6px; background: #f7dfb4; border-radius: 10px; overflow: hidden; margin: 9px 0 7px; }
.journey-track i { display: block; height: 100%; width: 23%; background: var(--primary); border-radius: inherit; }
.journey p { margin: 0; font-size:13px; color: var(--muted-foreground); }
.streak { display: flex; gap: 9px; align-items: center; padding-top: 14px; margin-top: 13px; border-top: 1px dashed var(--border); color: var(--primary); }
.streak div { display: grid; }
.streak b { font-size:16.9px; }
.streak span { color: var(--muted-foreground); font-size:11.7px; }
.profile { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 8px; text-align: left; }
.profile > span:nth-child(2) { display: grid; flex: 1; }
.profile b { font-size:15.6px; }
.profile small { font-size:13px; color: var(--muted-foreground); }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--accent); font-weight: 800; font-size:14.3px; }
main { margin-left: 248px; width: calc(100% - 248px); min-width: 0; }
header { height: 88px; padding: 0 34px; background: rgba(255,253,245,.78); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }

.header-actions { display: flex; align-items: center; gap: 11px; }
.search { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--border); border-radius: 11px; background: white; color: var(--muted-foreground); }
.search input { width: 165px; border: 0; outline: 0; color: var(--foreground); background: transparent; font-size:14.3px; }
.search.large { width: 260px; }
.search.large input { width: 100%; }
.icon-btn { width: 38px; height: 38px; border: 1px solid var(--border); background: white; border-radius: 11px; display: grid; place-items: center; position: relative; }
.icon-btn i { position: absolute; width: 6px; height: 6px; right: 7px; top: 7px; background: var(--coral); border-radius: 50%; border: 1px solid white; }
.sun { width: 27px; height: 27px; background: #fbbf24; border-radius: 50%; box-shadow: 0 0 0 5px rgba(251,191,36,.16); margin-left: 2px; }
.page { padding: 28px 34px 42px; max-width: 1500px; margin: 0 auto; }
.welcome { min-height: 244px; background: linear-gradient(110deg, #fff3c4 0%, #fde6a6 62%, #f7c86f 100%); border: 1px solid #f3cd78; border-radius: 22px; overflow: hidden; position: relative; box-shadow: var(--shadow); }
.welcome-copy { padding: 31px 35px; position: relative; z-index: 2; }
.eyebrow { font-size:11.7px; font-weight: 800; color: var(--primary-dark); letter-spacing: .13em; text-transform: uppercase; }
.welcome h2 { font-size:28px; line-height: 1.22; margin: 8px 0 9px; }
.welcome p { font-size:14.3px; color: var(--muted-foreground); margin: 0 0 20px; }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--primary); color: white; padding: 11px 17px; border-radius: 10px; font-size:14.3px; font-weight: 800; box-shadow: 0 5px 13px rgba(217,119,6,.22); transition: .2s; }
.primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.primary:disabled { opacity: .45; cursor: not-allowed; }
.desert-art { position: absolute; inset: 0 0 0 55%; overflow: hidden; }
.sun-art { position: absolute; width: 68px; height: 68px; border-radius: 50%; background: #f59e0b; right: 72px; top: 31px; box-shadow: 0 0 0 12px rgba(245,158,11,.13), 0 0 50px #fef3c7; }
.dune { position: absolute; border-radius: 55% 50% 0 0; bottom: -80px; transform: rotate(-4deg); }
.dune.far { background: #e9ab45; width: 430px; height: 170px; right: -40px; }
.dune.near { background: #d68624; width: 410px; height: 130px; right: -70px; bottom: -54px; transform: rotate(6deg); }
.cloud { position: absolute; width: 80px; height: 13px; border-radius: 20px; background: rgba(255,255,255,.55); }
.cloud:before,.cloud:after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud:before { width: 29px; height: 29px; left: 15px; bottom: 0; }.cloud:after { width: 20px; height: 20px; right: 13px; bottom: 0; }
.cloud.one { right: 180px; top: 47px; transform: scale(.7); }.cloud.two { right: 15px; top: 102px; transform: scale(.45); }
.cactus { width: 22px; height: 94px; background: #547d3a; border-radius: 12px 12px 3px 3px; position: absolute; z-index: 2; bottom: 24px; right: 155px; box-shadow: inset -5px 0 rgba(33,74,31,.2); }
.cactus i { position: absolute; width: 10px; height: 40px; border-radius: 8px; background: #547d3a; }
.cactus i:first-child { left: -14px; top: 30px; transform: rotate(-5deg); }.cactus i:first-child:after,.cactus i:nth-child(2):after { content:""; position: absolute; height: 10px; width: 18px; background:#547d3a; bottom:0; }
.cactus i:nth-child(2) { right: -13px; top: 14px; }.oasis { position:absolute;width:120px;height:19px;border-radius:50%;background:#30bdd0;bottom:12px;right:45px;z-index:2;box-shadow:0 0 0 6px rgba(6,182,212,.12); }
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-top: 16px; }
.stat-card { min-height: 108px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); display: flex; align-items: center; gap: 14px; padding: 17px; box-shadow: 0 4px 16px rgba(120,53,15,.04); }
.stat-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; flex: none; }
.stat-icon.amber { background: var(--muted); color: var(--primary); }.stat-icon.cyan { background: var(--accent-soft); color: var(--accent); }.stat-icon.coral { background: #fee2e2; color: var(--coral); }.stat-icon.green { background: var(--green-soft); color: var(--green); }
.stat-card div { display: grid; }
.stat-card small { color: var(--muted-foreground); font-size:11.7px; }
.stat-card strong { font-size:22px; line-height: 1.3; }
.stat-card p { margin: 0; color: var(--muted-foreground); font-size:11.1px; }.stat-card p b { color: var(--green); }
.chart-grid { display: grid; grid-template-columns: 1.65fr 1fr; gap: 16px; margin-top: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 4px 18px rgba(120,53,15,.04); padding: 20px; }
.panel-title { display: flex; align-items: flex-start; justify-content: space-between; }
.panel-title h3 { font-size:18.2px; margin: 0 0 2px; }.panel-title p { margin: 0; font-size:11.7px; color: var(--muted-foreground); }
.panel-title button { border: 1px solid var(--border); background: white; padding: 6px 9px; border-radius: 8px; display: flex; align-items: center; gap: 5px; font-size:11.7px; font-weight: 700; }
.line-chart { height: 195px; position: relative; padding: 12px 0 18px 26px; }
.line-chart svg { width: 100%; height: 160px; overflow: visible; border-bottom: 1px solid #f4e3c7; background: repeating-linear-gradient(to bottom, transparent 0, transparent 39px, #f8e9d1 40px); }
.line-chart .line { fill: none; stroke: var(--primary); stroke-width: 3; vector-effect: non-scaling-stroke; }.line-chart .area { fill: url(#area); }.line-chart circle { fill: white; stroke: var(--primary); stroke-width: 3; vector-effect: non-scaling-stroke; }
.y-labels { position: absolute; left: 0; top: 9px; height: 159px; display: flex; flex-direction: column; justify-content: space-between; font-size:11px; color: var(--muted-foreground); }
.x-labels { display: flex; justify-content: space-between; padding-top: 6px; font-size:11px; color: var(--muted-foreground); }
.donut-row { display: flex; align-items: center; gap: 24px; padding-top: 30px; }

.donut:after { content:""; position:absolute; inset:17px; background:var(--surface); border-radius:50%; }.donut div { z-index:1; display:grid; text-align:center; }.donut b { font-size:21px; }.donut span { font-size:11px;color:var(--muted-foreground); }

.bottom-grid { display: grid; grid-template-columns: 1.65fr 1fr; gap: 16px; margin-top: 16px; }
.text-btn { color: var(--primary-dark); border: 0!important; background: transparent!important; }
.review-bars { display:grid;grid-template-columns:1fr 1fr;gap:13px 20px;margin-top:17px; }.review-item{display:flex;align-items:center;gap:10px}.date-pill{background:var(--muted);color:var(--primary-dark);border-radius:8px;width:49px;height:36px;display:grid;place-items:center;font-size:11px;font-weight:800}.bar-info{flex:1}.bar-info>div{display:flex;justify-content:space-between;font-size:11px;font-weight:700}.bar-info small{color:var(--muted-foreground);font-size:11px}.bar-info i{display:block;height:4px;background:#f5e3c7;border-radius:4px;margin-top:5px;overflow:hidden}.bar-info i b{display:block;height:100%;background:var(--accent);border-radius:inherit}.review-item>button{border:0;background:transparent;color:var(--muted-foreground)}
.bar-chart{height:115px;display:flex;align-items:end;justify-content:space-between;gap:9px;padding-top:18px}.bar-chart div{height:100%;flex:1;display:flex;align-items:center;flex-direction:column;justify-content:end;gap:5px}.bar-chart span{display:block;width:100%;max-width:19px;border-radius:5px 5px 2px 2px;background:#f1d59e}.bar-chart span.today{background:var(--primary)}.bar-chart small{font-size:11px;color:var(--muted-foreground)}
.section-heading { display:flex;align-items:flex-end;justify-content:space-between;margin:5px 0 24px; }.section-heading h2{font-size:28px;margin:5px 0}.section-heading p{font-size:14.3px;color:var(--muted-foreground);margin:0}.section-heading.centered{text-align:center;justify-content:center}.day-progress{width:100px;height:66px;border:1px solid var(--border);border-radius:14px;background:var(--surface);display:grid;place-items:center;align-content:center}.day-progress b{font-size:18px;color:var(--primary)}.day-progress span{font-size:11px;color:var(--muted-foreground)}

html{-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font-family:inherit}
select{font:inherit;font-size:13px;border:1px solid var(--border);background:white;border-radius:10px;padding:8px 10px;color:var(--foreground);max-width:100%}
.ghost{border:1px solid var(--border);background:white;color:var(--primary-dark);padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{background:var(--muted)}
.ghost.on{background:var(--green-soft);border-color:#b9da83;color:var(--green)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-8px 0 18px}
.toolbar label{font-size:12px;color:var(--muted-foreground);font-weight:700;display:flex;align-items:center;gap:7px}
.empty{padding:28px;text-align:center;color:var(--muted-foreground);font-size:13px;line-height:1.7}
.empty b{color:var(--foreground)}
.note{margin:10px 0 0;font-size:12px;color:var(--muted-foreground)}
.profile{width:100%;cursor:pointer}
.reset-link{border:0;background:transparent;color:var(--muted-foreground);font-size:11px;text-decoration:underline;margin:2px 0 0 8px;padding:4px;text-align:left}
.lesson-list button.done>span{color:var(--green)}
.lesson-list button svg{color:var(--muted-foreground)}
.lesson-list button.done svg{color:var(--green)}
.reading-text mark{cursor:pointer}
.reading-text mark:hover{background:linear-gradient(transparent 40%,#fcd34d 40%)}
.word-pop{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f0fbfd;border-left:3px solid var(--accent);font-size:13px;line-height:1.6}
.word-pop small{color:var(--muted-foreground)}
.reading-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.mini-word .dotst{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:#f1d8c0}
.mini-word .dotst.known{background:var(--green)}.mini-word .dotst.learning{background:var(--primary)}.mini-word .dotst.due{background:var(--coral)}
.word-table .rows{max-height:68vh;overflow:auto}
.word-table .rows>button{display:grid;grid-template-columns:1.25fr 1fr 85px 18px;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid #f8e9d1;background:transparent;padding:13px 16px;text-align:left}
.word-table .rows>button:hover,.word-table .rows>button.selected{background:#fff8df}
.word-table .rows>button>div:nth-child(2){display:grid}
.word-table .rows>button>div:nth-child(2) small{font-size:11px;color:var(--muted-foreground)}
.word-table .rows>button>div:nth-child(2)>span{font-size:13px}
.word-main small{display:block}
.status.learning{background:var(--muted);color:var(--primary-dark)}
.detail-actions{display:flex;gap:8px;margin-top:14px}
.detail-actions button{flex:1;border:1px solid;border-radius:10px;background:white;padding:9px;font-weight:800;font-size:12px}
.detail-actions .again{color:#be5147;border-color:#f2bcb7}.detail-actions .remember{color:var(--green);border-color:#b9da83}
.chip-day{display:inline-block;background:var(--muted);color:var(--primary-dark);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;margin-left:6px}
.date-pill{width:66px!important}
.flash-face .ex{font-family:Georgia,serif;font-style:italic}
.flash-face .ex b{color:var(--primary-dark)}
.flash-face .tag{font-size:12px;color:var(--muted-foreground)}
.result-card{max-width:560px;margin:10px auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:30px;text-align:center}
.result-card h2{margin:6px 0 4px;font-size:26px}
.result-card .big{font-size:54px;font-weight:800;color:var(--primary);line-height:1.1}
.result-card p{color:var(--muted-foreground);font-size:13px;line-height:1.6}
.result-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.wrong-list{text-align:left;margin:14px 0 0;padding:12px 14px;background:#fff0ed;border-radius:12px;font-size:13px}
.wrong-list li{margin:4px 0}
.letter-grid{grid-template-columns:repeat(var(--n,8),var(--cell,34px))!important}
.letter-grid button{width:var(--cell,34px)!important;height:var(--cell,34px)!important;font-size:calc(var(--cell,34px)*.42)!important;padding:0;user-select:none}
.letter-grid button.start{background:#06b6d4;color:white}
.find-list>span{font-size:12px!important;align-items:center;flex-wrap:wrap}
.find-list>span small{font-weight:600;color:var(--muted-foreground);text-decoration:none;display:inline-block}
.find-list>span.done small{color:var(--green)}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:11px 22px;max-width:680px;margin:26px auto}
.match-cols button{min-height:58px;border-radius:12px;border:1px solid var(--border);background:white;font-weight:800;font-size:14px;padding:8px 12px}
.match-cols .en{border-left:4px solid var(--primary)}.match-cols .vi{border-left:4px solid var(--accent)}
.match-cols button.picked{background:var(--muted);border-color:var(--primary)}
.match-cols button.matched{background:var(--green-soft);border-color:var(--green);color:var(--green);opacity:.75;cursor:default}
.match-cols button.wrong{background:#fff0ed;border-color:var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sentence{font-family:Georgia,serif;font-size:16px;line-height:1.8;background:var(--card);border-radius:12px;padding:12px 14px;margin:-8px 0 18px}
.explanation p{margin:2px 0!important}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--foreground);color:white;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panel-title button.on{background:var(--muted);border-color:var(--primary)}
.bar-chart span{min-height:3px}
.dot.learning{background:var(--accent)}
.donut{background:var(--donut,#f1d8c0)}
.review-item>button{cursor:pointer}
.stat-card p{font-size:12px!important}
.hero-done{font-size:13px;margin:0 0 18px;color:var(--muted-foreground)}

/* ===== Quiz: kích thước theo đúng bản mock 1440x900 (1u = 1px của mock, co theo cả chiều rộng lẫn chiều cao màn hình) ===== */
.qz-full{--u:calc(min(calc(100vw / 1440),calc((100vh - 102px) / 798)) * .85)}
.qz-shell:has(.qz-prog){width:calc(var(--u)*1164);max-width:94vw;margin:calc(var(--u)*36) auto auto;padding:calc(var(--u)*38) calc(var(--u)*52) calc(var(--u)*40);border:1px solid #F2D6A2;border-radius:calc(var(--u)*32);box-shadow:0 calc(var(--u)*24) calc(var(--u)*70) rgba(120,53,15,.18);background:transparent}
.qz-shell:has(.qz-prog) .qz-prog{display:flex;align-items:center;gap:calc(var(--u)*18);margin:0;padding-top:calc(var(--u)*26)}
.qz-shell:has(.qz-prog) .qz-track{order:1;flex:1;margin:0;height:calc(var(--u)*14);border-radius:calc(var(--u)*7);background:rgba(255,255,255,.55)}
.qz-shell:has(.qz-prog) .qz-track em{top:calc(var(--u)*5);width:calc(var(--u)*4);height:calc(var(--u)*4)}
.qz-shell:has(.qz-prog) .qz-plabel{order:2;font-size:max(14px,calc(var(--u)*20));font-weight:900;line-height:1;white-space:nowrap}
.qz-shell:has(.qz-prog) .qz-camel{width:calc(var(--u)*44);height:calc(var(--u)*34)}
.qz-shell .quiz-card{padding:0}
.qz-shell .question-number{display:block;margin-top:calc(var(--u)*24);font-size:max(12px,calc(var(--u)*16));letter-spacing:.14em;color:#92400E}
.qz-shell .quiz-card>h2{font-size:max(22px,calc(var(--u)*42));line-height:1.25;font-weight:900;margin:calc(var(--u)*8) 0 calc(var(--u)*24)}
.qz-shell .sentence{font-size:max(15px,calc(var(--u)*22));padding:calc(var(--u)*14) calc(var(--u)*18);margin:calc(var(--u)*-8) 0 calc(var(--u)*20)}
.qz-shell .answers{gap:calc(var(--u)*20)}
.qz-shell .answers button{display:flex;align-items:center;gap:calc(var(--u)*20);min-height:max(56px,calc(var(--u)*104));padding:0 calc(var(--u)*26);border-width:2px;border-radius:calc(var(--u)*22);font-size:max(15px,calc(var(--u)*28));font-weight:800;text-align:left;background:rgba(255,251,235,.72)}
.qz-shell .answers button>span{display:grid;place-items:center;flex:none;width:max(32px,calc(var(--u)*52));height:max(32px,calc(var(--u)*52));border-radius:calc(var(--u)*14);font-size:max(14px,calc(var(--u)*24));font-weight:900;color:#92400E}
.qz-shell .answers button svg{margin-left:auto;flex:none}
.qz-shell .explanation{gap:calc(var(--u)*14);margin-top:calc(var(--u)*16);padding:calc(var(--u)*12) calc(var(--u)*18);border-radius:calc(var(--u)*16)}
.qz-shell .explanation svg{flex:none;width:max(18px,calc(var(--u)*24));height:max(18px,calc(var(--u)*24))}
.qz-shell .explanation b{font-size:max(15px,calc(var(--u)*22));font-weight:900}
.qz-shell .explanation p{font-size:max(14px,calc(var(--u)*19));line-height:1.35;margin:calc(var(--u)*3) 0!important}
.qz-shell .quiz-footer{margin-top:calc(var(--u)*20)}
.qz-shell .quiz-footer .primary{height:max(44px,calc(var(--u)*64));padding:0 calc(var(--u)*34);border-radius:calc(var(--u)*18);font-size:max(14px,calc(var(--u)*22));font-weight:900}
@media (max-width:760px){

.gf-dunes{position:absolute;left:0;bottom:0;width:100%;height:clamp(150px,28vh,280px);display:block}
.gf-oasis-pond{position:absolute;right:max(1vw,env(safe-area-inset-right,0px));bottom:4px;width:clamp(180px,30vw,340px);height:auto;display:block}
.gf-body{padding-bottom:calc(12px + env(safe-area-inset-bottom))}

/* --- Chép chính tả --- */
.sp-wrap{--sp-card:#FFFCEF;--sp-line:#EBD18F;--sp-ink:#5A4224;--sp-soft:#86693F;--sp-gold:#EFC155;--sp-gold-deep:#D3A03A;--sp-gold-ink:#4A3513;--sp-oasis:#2F8577;--sp-oasis-ink:#fff;--sp-alert:#B84A34;--sp-chip:#F8E4A8;--sp-heart:#E0644A;
  max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:20px;color:var(--sp-ink);font-weight:600}
.sp-wrap svg{display:block}
.sp-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sp-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--sp-chip);font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:17px;line-height:1;white-space:nowrap}
.sp-pill svg{width:20px;height:20px;flex:none}
.sp-hearts{gap:4px;padding-inline:14px}
.sp-hearts svg{width:22px;height:22px;fill:var(--sp-heart);transition:transform .25s}
.sp-hearts svg.lost{fill:var(--sp-line);transform:scale(.82)}
.sp-star{fill:var(--sp-gold-deep)}
.sp-pin{color:var(--sp-oasis)}
.sp-card{background:var(--sp-card);border:2px solid var(--sp-line);border-radius:30px;padding:30px clamp(16px,4vw,40px);box-shadow:0 14px 34px -18px rgba(150,104,28,.45);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.sp-prompt{font-size:15px;color:var(--sp-soft);letter-spacing:.02em}
.sp-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 28px;width:100%;min-height:56px;cursor:text}
.sp-word{display:flex;gap:6px;align-items:flex-end}
.sp-slot{width:var(--slot,32px);height:calc(var(--slot,32px)*1.4);display:grid;place-items:end center;border-bottom:5px solid var(--sp-gold-deep);border-radius:2px;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:calc(var(--slot,32px)*.85);line-height:1;color:var(--sp-ink);text-transform:lowercase;transition:border-color .2s,color .2s;padding-bottom:2px}
.sp-slot.next{border-color:var(--sp-oasis)}
.sp-slot.hint{color:var(--sp-oasis)}
.sp-slot.ok{color:var(--sp-oasis);border-color:var(--sp-oasis)}
.sp-slot.bad{color:var(--sp-alert);border-color:var(--sp-alert)}
.sp-sep{align-self:flex-end;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:26px;color:var(--sp-gold-deep);line-height:1;padding-bottom:6px}
.sp-slots.shake{animation:spshake .4s}
@keyframes spshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.sp-meaning{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:600;font-size:clamp(22px,4vw,28px);line-height:1.2}
.sp-tag{display:inline-block;padding:5px 16px;border-radius:999px;background:var(--sp-chip);font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:15px}
.sp-msg{min-height:26px;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:17px;text-align:center;color:var(--sp-soft)}
.sp-msg.ok{color:var(--sp-oasis)}.sp-msg.bad{color:var(--sp-alert)}
.sp-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.sp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2px solid transparent;padding:12px 26px;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:18px;line-height:1.1;cursor:pointer;transition:transform .12s,filter .12s}
.sp-btn:hover{filter:brightness(1.04)}.sp-btn:active{transform:scale(.97)}
.sp-btn svg{width:20px;height:20px;flex:none}
.sp-teal{background:var(--sp-oasis);color:var(--sp-oasis-ink);box-shadow:0 8px 16px -10px var(--sp-oasis)}
.sp-gold{background:var(--sp-gold);color:var(--sp-gold-ink);box-shadow:0 8px 16px -10px var(--sp-gold-deep)}
.sp-ghost{background:var(--sp-card);color:var(--sp-ink);border-color:var(--sp-line)}
.sp-btn[disabled]{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.sp-link{background:none;border:0;color:var(--sp-soft);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:4px;padding:6px 10px;cursor:pointer}
.sp-link[disabled]{opacity:.5;cursor:not-allowed}
.sp-answer{display:flex;gap:12px;align-items:stretch}
.sp-answer input{flex:1;min-width:0;border:2px solid var(--sp-gold-deep);background:var(--sp-card);border-radius:999px;padding:13px 24px;text-align:center;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;color:var(--sp-ink)}
.sp-answer input::placeholder{color:var(--sp-soft);opacity:.75;letter-spacing:.08em}
.sp-answer input:focus-visible{outline:3px solid var(--sp-oasis);outline-offset:2px;border-color:var(--sp-oasis)}
.sp-below{display:flex;justify-content:center}
.sp-end{align-items:center;gap:16px}
.sp-end h2{margin:0;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;color:var(--sp-ink)}
.sp-end .sp-lead{margin:0;max-width:46ch;color:var(--sp-soft);font-size:16px}
.sp-stars{display:flex;gap:6px}
.sp-stars svg{width:44px;height:44px;fill:var(--sp-line)}
.sp-stars svg.on{fill:var(--sp-gold-deep)}
.sp-summary{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sp-missed{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.sp-missed h3{margin:6px 0 0;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-size:18px}
.sp-mrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--sp-chip)}
.sp-mrow .w{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:19px}
.sp-mrow .m{color:var(--sp-soft);font-size:15px;flex:1;min-width:0}
.sp-mrow button{width:38px;height:38px;border-radius:50%;border:0;background:var(--sp-oasis);color:var(--sp-oasis-ink);display:grid;place-items:center;flex:none;cursor:pointer}
.sp-mrow button svg{width:18px;height:18px}
@media (max-width:520px){.sp-answer{flex-direction:column}.sp-answer .sp-btn{width:100%}.sp-card{padding-block:24px}.sp-sep{font-size:22px}.sp-pill{font-size:16px;padding:8px 13px}}

/* --- Memory Match --- */
.mm-wrap{--mm-cream:#FFF8E1;--mm-glass:rgba(255,249,228,.88);--mm-butter:#F7E0A0;--mm-gold:#E8B94A;--mm-gold-deep:#C99A2E;--mm-line:#E2C879;--mm-ink:#5E3D1E;--mm-soft:#7A5A36;--mm-oasis-deep:#4F7D5B;--mm-clay:#D58B5E;--mm-back:#F5DC8B;--mm-front:#FFFBEC;
  --cols:4;--boardw:560px;--scols:3;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;color:var(--mm-ink);font-family:"Be Vietnam Pro","Nunito",system-ui,sans-serif;font-weight:500;line-height:1.5}
.mm-wrap[data-level="easy"]{--cols:4;--boardw:520px;--scols:4}
.mm-wrap[data-level="medium"]{--cols:4;--boardw:560px;--scols:3}
.mm-wrap[data-level="hard"]{--cols:5;--boardw:760px;--scols:5}
.mm-lede{margin:0;max-width:56ch;color:var(--mm-soft);font-size:14px}
.mm-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.mm-seg{flex:1 1 300px;min-width:0;display:flex;gap:4px;padding:4px;background:var(--mm-glass);border:1.5px solid var(--mm-line);border-radius:18px}
.mm-seg-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;border:0;background:transparent;border-radius:14px;padding:6px 8px;cursor:pointer;color:var(--mm-soft);transition:background .2s,color .2s}
.mm-seg-btn:hover{background:rgba(247,224,160,.5)}
.mm-seg-btn[aria-pressed="true"]{background:#F6D77A;color:var(--mm-ink);box-shadow:inset 0 -3px 0 #E2B94F}
.mm-seg-label{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:1.1rem;line-height:1.2}
.mm-seg-sub{font-size:.72rem;line-height:1.2}
.mm-new{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border:0;border-radius:16px;background:var(--mm-gold);color:var(--mm-ink);font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:0 3px 0 var(--mm-gold-deep);transition:transform .1s,box-shadow .1s}
.mm-new:hover{background:#EDC25C}.mm-new:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mm-gold-deep)}
.mm-new svg{width:20px;height:20px}
.mm-ghost{min-height:52px;padding:0 20px;border:1.5px solid var(--mm-line);border-radius:16px;background:transparent;font:inherit;font-weight:600;cursor:pointer;color:var(--mm-ink)}
.mm-ghost:hover{background:rgba(247,224,160,.45)}
.mm-wrap :is(.mm-new,.mm-ghost,.mm-seg-btn,.mm-card):focus-visible{outline:3px solid var(--mm-oasis-deep);outline-offset:3px}
.mm-hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0}
.mm-stat{background:var(--mm-glass);border:1.5px solid var(--mm-line);border-radius:14px;padding:8px 14px 6px;min-width:0}
.mm-stat dt{font-size:.68rem;font-weight:600;letter-spacing:.06em;color:var(--mm-soft)}
.mm-stat dd{margin:0;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:1.5rem;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.mm-board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(8px,1.8vw,14px);width:100%;max-width:var(--boardw);margin-inline:auto}
.mm-card{appearance:none;border:0;background:none;padding:0;margin:0;width:100%;aspect-ratio:1.08/1;perspective:700px;border-radius:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
.mm-card:disabled{cursor:default}
.mm-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.mm-card.is-flipped .mm-inner{transform:rotateY(180deg)}
.mm-card:not(.is-flipped):not(:disabled):hover .mm-inner{transform:translateY(-3px)}
.mm-face{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mm-back{background:var(--mm-back);border:2px solid #E9C867;box-shadow:inset 0 0 0 4px var(--mm-back),inset 0 0 0 6px rgba(255,249,225,.85),0 4px 0 #D9B04D}
.mm-back svg{width:56%;height:56%;display:block}
.mm-front{background:var(--mm-front);border:2px solid #EBD28A;box-shadow:0 4px 0 #E0C16A;transform:rotateY(180deg);padding:6px;transition:background .3s,border-color .3s}
.mm-front.vi{background:#F6F8E6}
.mm-txt{display:block;text-align:center;overflow-wrap:anywhere;hyphens:auto;line-height:1.15;color:var(--mm-ink)}
.mm-front.en .mm-txt{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700}
.mm-front.vi .mm-txt{font-weight:600}
.mm-txt.s1{font-size:1.2rem}.mm-txt.s2{font-size:1rem}.mm-txt.s3{font-size:.86rem}.mm-txt.s4{font-size:.74rem}
.mm-card.is-matched .mm-front{background:#EFF5D8;border-color:#B9D3A0;box-shadow:0 4px 0 #A9C58F}
.mm-card.is-matched{animation:mmpop .5s ease}
.mm-card.is-wrong .mm-front{background:#FFF1E4;border-color:var(--mm-clay)}
.mm-card.is-wrong{animation:mmnudge .4s ease}
@keyframes mmpop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes mmnudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mm-coll{display:flex;flex-direction:column;gap:10px}
.mm-sec{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--mm-soft)}
.mm-sec span{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-size:1rem;color:var(--mm-ink);font-variant-numeric:tabular-nums}
.mm-found{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--scols),minmax(0,1fr));gap:8px}
.mm-found li{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border-radius:12px;border:1.5px dashed #DCC27A;text-align:center}
.mm-found li.is-found{border-style:solid;border-color:#C9DDB1;background:rgba(239,245,216,.9)}
.mm-slot{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(235,207,138,.35)}
.mm-q{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;color:var(--mm-soft)}
.mm-slot svg{display:none;width:34px;height:34px}
.is-found .mm-slot{background:transparent}.is-found .mm-slot svg{display:block}.is-found .mm-q{display:none}
.mm-name{min-height:2.4em;font-size:.72rem;line-height:1.2;color:var(--mm-soft);overflow-wrap:anywhere}
.mm-ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(94,61,30,.38)}
.mm-dialog{width:min(420px,100%);background:var(--mm-cream);border:2px solid var(--mm-line);border-radius:26px;padding:26px 22px 22px;text-align:center;box-shadow:0 8px 0 rgba(201,154,46,.5)}
.mm-win-sun{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:var(--mm-butter);display:grid;place-items:center}
.mm-win-sun svg{width:46px;height:46px}
.mm-dialog h2{margin:0;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;font-size:1.7rem;line-height:1.15}
.mm-stars{display:flex;justify-content:center;gap:6px;margin:10px 0 6px}
.mm-star{width:40px;height:40px;fill:transparent;stroke:#D8BE72;stroke-width:1.5;stroke-linejoin:round}
.mm-star.is-on{fill:var(--mm-gold);stroke:var(--mm-gold-deep);animation:mmpop .5s ease backwards}
.mm-star.is-on:nth-child(2){animation-delay:.15s}.mm-star.is-on:nth-child(3){animation-delay:.3s}
.mm-win-stats{margin:0;font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.mm-win-xp{margin:2px 0 0;font-weight:800;color:#b45309}
.mm-win-note{margin:6px 0 0;color:var(--mm-soft);min-height:3em;font-size:.92rem}
.mm-win-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
html[data-theme="dark"] .mm-slot svg,html[data-theme="dark"] .mm-back svg,html[data-theme="dark"] .mm-win-sun svg{filter:invert(1) hue-rotate(180deg)}
@media (max-width:560px){.mm-wrap[data-level="hard"]{--cols:4;--scols:4}.mm-wrap[data-level="easy"]{--scols:4}.mm-hud{grid-template-columns:repeat(2,minmax(0,1fr))}.mm-new{flex:1 1 100%}.mm-txt.s1{font-size:1rem}.mm-txt.s2{font-size:.86rem}.mm-txt.s3{font-size:.76rem}.mm-txt.s4{font-size:.68rem}}

/* ===== Hangman Sa Mạc ===== */
.game-full.gf-hang{background:#FFF8E1}
.gf-hang .gf-top{position:relative;z-index:2;background:transparent;border:0;backdrop-filter:none}
.gf-hang .gf-body{position:relative;z-index:1;padding:0;overflow:auto}
.gf-hang .gf-body>.game-shell{flex:1;display:flex;flex-direction:column;width:100%;max-width:none;margin:0;padding:0;min-height:0;background:none;border:0;box-shadow:none;border-radius:0}
.hm-scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hm-stage{position:relative;flex:1;min-height:560px;overflow:hidden;background:transparent;font-family:var(--hm-font-body);color:var(--hm-ink)}
.hm-stage *,.hm-stage *::before,.hm-stage *::after{box-sizing:border-box}
.hm-stage button{font:inherit;color:inherit}
.hm-stage button:focus-visible{outline:3px solid var(--hm-oasis);outline-offset:2px}
.hm-stage [hidden]{display:none!important}
.hm-ui{position:absolute;inset:0}
.hm-stage {
  --hm-cream: #FFF8E1;
  --hm-butter: #FBE9A8;
  --hm-sand: #F0D88C;
  --hm-dune: #DDBA64;
  --hm-ink: #5B4A2E;
  --hm-ink-soft: #85714A;
  --hm-oasis: #4F8F80;
  --hm-oasis-soft: #CFE6DC;
  --hm-clay: #C0694B;
  --hm-clay-soft: #F2D6C6;
  --hm-leaf: #86AE93;
  --hm-font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hm-font-display: 'Fredoka', 'Be Vietnam Pro', system-ui, sans-serif;
  
}
.hm-ui {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* top bar */
.hm-status { margin-left: auto; }
.hm-top { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hm-clue {
  width: min(320px, 56vw);
  background: rgba(255, 248, 225, .95);
  border: 2px solid var(--hm-dune);
  border-radius: 12px;
  padding: 10px 14px 12px;
  opacity: 0;
  will-change: transform;
}
.hm-clue.hm-shown { opacity: 1; }
.hm-clue .hm-kind { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--hm-ink-soft); }
.hm-clue .hm-text { margin: 4px 0 0; font-size: 15px; line-height: 1.4; font-weight: 500; overflow-wrap: anywhere; }
.hm-clue .hm-text.hm-syn { font-family: var(--hm-font-display); font-size: 24px; font-weight: 600; line-height: 1.2; }
.hm-clue .hm-len { margin: 6px 0 0; font-size: 12px; color: var(--hm-ink-soft); }

.hm-status {
  background: rgba(255, 248, 225, .95);
  border: 2px solid var(--hm-dune);
  border-radius: 12px;
  padding: 8px 12px;
  display: grid; gap: 6px; justify-items: end;
  font-size: 12px; font-weight: 500; color: var(--hm-ink-soft);
}
.hm-pips { display: flex; gap: 5px; }
.hm-pips span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--hm-ink); transition: background .25s; }
.hm-pips span.hm-on { background: var(--hm-clay); border-color: var(--hm-clay); }
.hm-status b { color: var(--hm-ink); font-weight: 700; }
.hm-mute {
  border: 2px solid var(--hm-dune); border-radius: 999px; background: var(--hm-butter);
  font-size: 12px; font-weight: 700; padding: 3px 10px; cursor: pointer;
}
.hm-mute:hover { background: var(--hm-sand); }
.hm-mute[aria-pressed="true"] { background: var(--hm-cream); color: var(--hm-ink-soft); }

/* middle column */
.hm-col { flex: 1; min-height: 0; width: 100%; max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; }
.hm-figure { flex: 1; min-height: 0; }
.hm-figure svg { width: 100%; height: 100%; display: block; }

.hm-word {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 6px;
  padding: 4px 0 14px; min-height: 56px;
  opacity: 0; transition: opacity .5s;
}
.hm-word.hm-on { opacity: 1; }
.hm-slot {
  width: clamp(22px, 7.4vw, 36px); height: clamp(36px, 6vh, 46px);
  border-bottom: 3px solid var(--hm-ink);
  display: grid; place-items: end center;
  font-family: var(--hm-font-display); font-weight: 600; font-size: clamp(22px, 4vh, 30px); line-height: 1.15;
}
.hm-slot.hm-miss { color: var(--hm-clay); border-color: var(--hm-clay); }

.hm-keys {
  --hm-n: 9; --hm-gap: 6px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: var(--hm-gap);
  width: 100%; max-width: 440px; margin-inline: auto;
  transition: opacity .3s;
}
.hm-keys button { flex: 0 0 calc((100% - (var(--hm-n) - 1) * var(--hm-gap)) / var(--hm-n)); min-width: 0; }
.hm-keys button.hm-flash { background: var(--hm-sand); transform: translateY(1px); }
.hm-keys.hm-locked { opacity: .55; pointer-events: none; }
.hm-keys button {
  height: clamp(38px, 6.2vh, 46px);
  border: 2px solid var(--hm-dune); border-radius: 10px;
  background: rgba(255, 248, 225, .94);
  font-family: var(--hm-font-display); font-weight: 600; font-size: 18px;
  cursor: pointer; padding: 0;
}
.hm-keys button:hover:not(:disabled) { background: var(--hm-butter); }
.hm-keys button:active:not(:disabled) { transform: translateY(1px); }
.hm-keys button:disabled { cursor: default; }
.hm-keys button.hm-hit { background: var(--hm-oasis-soft); border-color: var(--hm-oasis); color: #2F5F54; }
.hm-keys button.hm-miss { background: var(--hm-clay-soft); border-color: #D9A58E; color: var(--hm-clay); opacity: .7; }

/* overlays */
.hm-overlay { position: absolute; inset: 0; z-index: 5; display: flex; justify-content: center; align-items: center; padding: 16px 16px 18vh; pointer-events: none; }
.hm-card {
  pointer-events: auto;
  width: min(360px, 100%);
  background: var(--hm-cream);
  border: 2px solid var(--hm-dune);
  border-radius: 16px;
  padding: 22px 22px 20px;
  text-align: center;
  display: grid; gap: 10px; justify-items: center;
}
.hm-card[hidden] { display: none; }
.hm-card h1, .hm-card h2 { margin: 0; font-family: var(--hm-font-display); font-weight: 600; font-size: 30px; line-height: 1.15; text-wrap: balance; }
.hm-card p { margin: 0; font-size: 15px; line-height: 1.5; max-width: 34ch; }
.hm-card .hm-answer strong { font-family: var(--hm-font-display); font-size: 22px; letter-spacing: .12em; color: var(--hm-oasis); }
.hm-btn {
  margin-top: 6px; border: 2px solid var(--hm-ink); border-radius: 999px;
  background: var(--hm-butter); font-weight: 700; font-size: 16px;
  padding: 10px 26px; cursor: pointer;
}
.hm-btn:hover { background: var(--hm-sand); }

#hm-count {
  position: absolute; left: 50%; top: 58%; z-index: 4;
  transform: translate(-50%, -50%);
  font-family: var(--hm-font-display); font-weight: 600;
  font-size: clamp(72px, 16vh, 120px); line-height: 1;
  color: var(--hm-ink); opacity: 0; pointer-events: none;
}
#hm-count.hm-pop { animation: hmpop 1s ease-out both; }
@keyframes hmpop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
}

.hm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* gallows drawing */
.hm-g { fill: none; stroke: var(--hm-ink); stroke-linecap: round; stroke-linejoin: round; }
.hm-draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .7s ease; }
.hm-on1 .hm-p1, .hm-on2 .hm-p2, .hm-on3 .hm-p3 { stroke-dashoffset: 0; }
.hm-p3.hm-ring { transition-delay: .6s; }
.hm-leafy { stroke: var(--hm-leaf); }

#hm-man { transition: transform .6s cubic-bezier(.3, 1.4, .5, 1); }
.hm-on4 #hm-man { transform: translateY(-38px); }
#hm-head { transform-origin: 128px 168px; transition: transform .7s cubic-bezier(.3, 1.5, .5, 1); }
.hm-on5 #hm-head { transform: rotate(52deg); }

.hm-eyes-x, .hm-m-sad { display: none; }
.hm-on3 .hm-m-sad { display: block; }
.hm-on3 .hm-m-smile { display: none; }
.hm-on5 .hm-eyes-x { display: block; }
.hm-on5 .hm-eyes-ok { display: none; }
.hm-win #hm-man { transform: none; }
.hm-win .hm-m-smile { display: block; }
.hm-win .hm-m-sad { display: none; }

.hm-lost #hm-hang { transform-origin: 128px 42px; animation: hmsway 2.4s ease-in-out infinite alternate; }
@keyframes hmsway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
.hm-shake { animation: hmshake .35s; }
@keyframes hmshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

@media (prefers-reduced-motion: reduce) {
  .hm-lost #hm-hang, .hm-shake, #hm-count.hm-pop { animation: none; }
  #hm-count.hm-pop { opacity: 1; }
  .hm-draw, #hm-man, #hm-head { transition-duration: .01s; }
}

/* ===== Phrase cards (.pv-pc) + island cards (.pv-card): smooth 3D tilt hover, original palette ===== */
.pv-pc,.pv-pc:hover,.pv-card,.pv-card:hover{
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
  transform-origin:center;backface-visibility:hidden;
  transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .4s ease,background-color .3s ease}
.pv-pc:hover,.pv-card:not(.soon):hover{--ty:-5px;--sc:1.035;position:relative;z-index:5;will-change:transform;
  background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),rgba(30,167,197,.22),rgba(217,240,247,.45) 38%,rgba(217,240,247,0) 72%),#fffaf0;
  box-shadow:0 4px 0 #e3c98c,0 18px 30px rgba(120,53,15,.20),0 4px 10px rgba(120,53,15,.10)}
.pv-card.soon:hover{--ty:0px;--sc:1}
.pv-pc:active,.pv-card:not(.soon):active{--sc:.985;--ty:0px}
@media (hover:none),(prefers-reduced-motion:reduce){
  .pv-pc,.pv-pc:hover,.pv-card,.pv-card:hover{transition:transform .15s}
  .pv-pc:hover,.pv-card:not(.soon):hover{--ty:-3px;--sc:1;background:#fffaf0;box-shadow:0 4px 0 #e3c98c}
}

/* ===== Motion pack: page enter, card stagger, bar grow, bouncy session cards ===== */
@keyframes pvPageIn{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
@keyframes pvCardIn{from{opacity:0;translate:0 22px;scale:.95}to{opacity:1;translate:0 0;scale:1}}
@keyframes pvBarGrow{from{width:0}}
.pv-enter{animation:pvPageIn .38s cubic-bezier(.22,1,.36,1) backwards}
.pv-enter :is(.pv-pc,.pv-card){animation:pvCardIn .55s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*45ms + 90ms)}
.pv-enter .pv-bar i{animation:pvBarGrow 1s cubic-bezier(.22,1,.36,1) .2s backwards}

/* Exercise session cards (.pv-ec): gentle, smooth lift only */

.pv-ec:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 4px 0 #e3c98c,0 12px 20px -8px rgba(120,53,15,.22)}

.fcs-type{display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--acc);text-transform:uppercase}
.fcs-face.back .fcs-type,.fcs-face.back .fcs-spk{background:#fff}
.fcs-spk{width:48px;height:48px;padding:0;border:0;border-radius:50%;background:var(--soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fcs-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.fcs-lab{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--acc)}

.fcs-grade button{flex:1;height:60px;padding:0 20px;border:0;border-radius:999px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}

.fcs-grade .no{background:#fff;color:var(--ink);box-shadow:0 10px 24px -10px rgba(18,70,45,.4)}
.fcs-grade .yes{background:var(--acc);color:#fff;box-shadow:0 14px 26px -10px rgba(18,70,45,.6)}
.fcs-grade .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.fcs-grade .no .ic{background:#FFE4E0}
.fcs-grade .yes .ic{background:#fff}
.fcs-grade .fcs-kbd{min-width:22px;height:24px;padding:0 7px;box-shadow:none}

.fcs-grade .yes .fcs-kbd{color:var(--acc)}
.fcs-res{margin-top:40px}
.fcs-note{margin:44px 0 0;font-size:14px;color:var(--mut);text-align:center}
.fcs-acts{margin-top:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.fcs-btn{height:56px;padding:0 28px;border:0;border-radius:999px;background:var(--acc);box-shadow:0 14px 26px -10px rgba(18,70,45,.6);color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px}
.fcs-btn.ghost{background:#fff;color:var(--ink);box-shadow:0 10px 24px -10px rgba(18,70,45,.4)}
.fcs-done .fcs-link{margin-top:14px}

@media (max-width:760px){
  .fcs{--k:.58;padding:20px 16px 32px}

  .fcs-field{flex-direction:column;align-items:flex-start;gap:6px}
  .fcs-sel.s1,.fcs-sel.s2{width:100%}
}

  } else if (GM.tab === 1) {

  } else if (GM.tab === 5) {

        '<path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.87-3.04.87-2.34 0-4.33-1.59-5.04-3.72H.95v2.33A9 9 0 0 0 9 18Z"/>' +
        '<path fill="#FBBC05" d="M3.96 10.71A5.42 5.42 0 0 1 3.68 9c0-.59.1-1.16.28-1.71V4.96H.95A9 9 0 0 0 0 9c0 1.45.35 2.82.95 4.04l3.01-2.33Z"/>' +
        '<path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.34l2.58-2.58A8.65 8.65 0 0 0 9 0 9 9 0 0 0 .95 4.96l3.01 2.33C4.67 5.16 6.66 3.58 9 3.58Z"/>' +
        '</svg>';
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" aria-hidden="true">' + ICON_PATHS[name] + '</svg>';
  }

  var CAMEL_PATH = 'M10 38c0-7 4-13 9.5-13 4.5 0 5.5 6 7.5 7 2-1 3-7 8.5-7 5 0 6.5 6 7.5 9 1-4 2-9 4-13 1-3 4-4.5 7-2.5 3 1.5 3 4 0 5-2.5 1-3.5 3.5-4.5 7.5-1 4-2 7-2 11v12h-5l-.5-9c-5 2-15 2-20.5 0L21 54h-5l-.5-11C11 43 10 40.5 10 38Z';

  function camelSVG(svgClass, eyeClass) {
    return '<svg ' + (svgClass ? 'class="' + svgClass + '" ' : '') + 'viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<path d="' + CAMEL_PATH + '"/>' +
      '<circle cx="52" cy="20.5" r="1.3" class="' + eyeClass + '"/>' +
      '<path d="m48 18.5 1.5-4 1.5 3.5"/>' +
      '</svg>';
  }

  var logoCount = 0;
  function logo() {
    var id = 'logo-g-' + (logoCount++);
    var svg = '<svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Vocab Oasis">' +
    '<defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#logo-g)"/><circle cx="48" cy="14" r="6" fill="#fde68a" opacity=".9"/><path fill="#fff7ed" d="M13 38C13 31 17 25 22.500 25C27 25 28 31 30 32C32 31 33 25 38.500 25C43.500 25 45 31 46 34C47 30 48 25 50 21C51 18 54 16.500 57 18.500C60 20 60 22.500 57 23.500C54.500 24.500 53.500 27 52.500 31C51.500 35 50.500 38 50.500 42L50.500 54L45.500 54L45 45C40 47 30 47 24.500 45L24 54L19 54L18.500 43C14 43 13 40.500 13 38Z"/><circle cx="55" cy="20.500" r="1.300" fill="#d97706"/><path d="M51 18.500L52.500 14.500L54 18" fill="#fff7ed"/><path d="M8 57C20 54 44 54 56 57" stroke="#fff7ed" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" fill="none"/>' +
    '</svg>';
    return svg.replace(/logo-g/g, id);
  }

  function brand() {
    return '<div class="brand">' + logo() +
      '<div><strong>Vocab Oasis</strong><small>Learn. Grow. Flourish.</small></div></div>';
  }

  root.querySelectorAll('[data-slot="brand"]').forEach(function (el) { el.innerHTML = brand(); });
  root.querySelector('[data-slot="camel-mark"]').innerHTML = camelSVG('', 'camel-eye');
  root.querySelector('[data-slot="herd"]').innerHTML =
    ['herd-one', 'herd-two', 'herd-three', 'herd-four'].map(function (c) {
      return camelSVG('herd-camel ' + c, 'herd-eye');
    }).join('');
  root.querySelectorAll('[data-icon]').forEach(function (el) {
    el.innerHTML = icon(el.getAttribute('data-icon'), Number(el.getAttribute('data-size')) || 20);
  });

  var mode = 'login';
  var showPassword = false;
  var values = { name: '', email: '', password: '' };

  var $ = function (id) { return root.getElementById(id); };
  var fieldsEl = $('fields');

  function fieldHTML(opts) {
    var isPw = opts.key === 'password';
    var type = isPw && showPassword ? 'text' : opts.type;
    return '<label class="field"><span>' + opts.label + '</span>' +
      '<div class="input-shell">' + icon(opts.icon, 19) +
      '<input data-key="' + opts.key + '" name="' + opts.key + '" autocomplete="' + opts.autocomplete + '"' +
      ' placeholder="' + opts.placeholder + '" required type="' + type + '" />' +
      (isPw ? '<button class="eye-button" type="button" id="toggle-pw" aria-label="' +
        (showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu') + '">' + icon(showPassword ? 'eyeOff' : 'eye', 19) + '</button>' : '') +
      '</div></label>';
  }

  function renderFields() {
    var html = '';
    if (mode === 'register') {
      html += fieldHTML({ key: 'name', icon: 'user', label: 'Tên của bạn', placeholder: 'Ví dụ: Minh Anh', type: 'text', autocomplete: 'name' });
    }
    html += fieldHTML({ key: 'email', icon: 'mail', label: 'Email', placeholder: 'ban@example.com', type: 'email', autocomplete: 'email' });
    html += fieldHTML({
      key: 'password', icon: 'lock', label: 'Mật khẩu',
      placeholder: mode === 'login' ? 'Nhập mật khẩu của bạn' : 'Tối thiểu 8 ký tự',
      type: 'password', autocomplete: mode === 'login' ? 'current-password' : 'new-password'
    });
    fieldsEl.innerHTML = html;
    fieldsEl.querySelectorAll('input').forEach(function (input) {
      input.value = values[input.getAttribute('data-key')] || '';
    });
  }

  function render() {
    var isLogin = mode === 'login';
    $('welcome-title').textContent = isLogin ? 'Chào mừng trở lại!' : 'Bắt đầu hành trình!';
    $('welcome-desc').textContent = isLogin
      ? 'Tiếp tục hành trình chinh phục từ vựng của bạn.'
      : 'Tạo tài khoản để gieo những hạt giống tri thức đầu tiên.';
    $('tab-login').className = isLogin ? 'active' : '';
    $('tab-register').className = isLogin ? '' : 'active';
    $('tab-login').setAttribute('aria-selected', isLogin);
    $('tab-register').setAttribute('aria-selected', !isLogin);
    $('forgot').style.display = isLogin ? '' : 'none';
    $('submit-label').textContent = isLogin ? 'Vào ốc đảo' : 'Tạo tài khoản';
    $('switch-text').textContent = isLogin ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
    $('switch-btn').textContent = isLogin ? 'Đăng ký miễn phí' : 'Đăng nhập';
    document.title = 'Vocab Oasis – ' + (isLogin ? 'Đăng nhập' : 'Đăng ký');
    renderFields();
  }

  function switchMode(next) {
    if (next === mode) return;
    mode = next;
    ui.clearMessage();
    render();
  }

  fieldsEl.addEventListener('input', function (e) {
    var key = e.target.getAttribute('data-key');
    if (key) values[key] = e.target.value;
  });

  fieldsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('#toggle-pw');
    if (!btn) return;
    showPassword = !showPassword;
    var input = fieldsEl.querySelector('input[data-key="password"]');
    input.type = showPassword ? 'text' : 'password';
    btn.innerHTML = icon(showPassword ? 'eyeOff' : 'eye', 19);
    btn.setAttribute('aria-label', showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  root.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { switchMode(b.getAttribute('data-mode')); });
  });
  $('switch-btn').addEventListener('click', function () {
    switchMode(mode === 'login' ? 'register' : 'login');
  });

  var NO_BACKEND = 'Chưa kết nối được Firebase. Kiểm tra mạng hoặc mở trang qua http://localhost.';

  var ui = window.VocabAuthUI = {
    handlers: null,
    values: function () {
      return { name: values.name.trim(), email: values.email.trim(), password: values.password };
    },
    remember: function () { return $('remember').checked; },
    setMessage: function (kind, text) {
      var box = $('form-msg');
      box.className = 'form-msg ' + kind;
      $('form-msg-icon').innerHTML = icon(kind === 'error' ? 'alert' : 'check', 16);
      $('form-msg-text').textContent = text;
      box.hidden = false;
    },
    clearMessage: function () { $('form-msg').hidden = true; },
    reset: function () { values.name = ''; values.email = ''; values.password = ''; showPassword = false; mode = 'login'; ui.clearMessage(); render(); },
    setBusy: function (busy) {
      ['submit-btn', 'google-btn', 'forgot'].forEach(function (id) { $(id).disabled = busy; });
      $('auth-form').setAttribute('aria-busy', busy);
    },
    setSession: function (label) {
      $('session-bar').hidden = !label;
      $('session-text').textContent = label ? 'Đang đăng nhập: ' + label : '';
    }
  };

  $('auth-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = ui.values(), keys = mode === 'register' ? ['name', 'email', 'password'] : ['email', 'password'];
    var empty = keys.filter(function (k) { return !v[k]; });
    if (empty.length) {
      ui.setMessage('error', 'Vui lòng nhập thông tin.');
      var f = root.querySelector('#fields input[data-key="' + empty[0] + '"]'); if (f) f.focus();
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) {
      ui.setMessage('error', 'Email chưa đúng định dạng.');
      var fe = root.querySelector('#fields input[data-key="email"]'); if (fe) fe.focus();
      return;
    }
    if (!ui.handlers) { ui.setMessage('error', NO_BACKEND); return; }
    ui.handlers.submit(mode, ui.values(), ui.remember());
  });
  $('google-btn').addEventListener('click', function () {
    if (!ui.handlers) { ui.setMessage('error', NO_BACKEND); return; }
    ui.handlers.google(ui.remember());
  });
  $('forgot').addEventListener('click', function () {
    if (!ui.handlers) { ui.setMessage('error', NO_BACKEND); return; }
    ui.handlers.forgot(ui.values().email);
  });
  $('logout-btn').addEventListener('click', function () {
    if (ui.handlers) ui.handlers.logout();
  });

  var LEGAL_DATA = {"terms":{"vi":{"title":"Điều khoản sử dụng","sub":"Vocab Oasis | Cập nhật lần cuối: 25/10/2026","updated":"Cập nhật lần cuối: 25/10/2026","sections":[["1. Chấp nhận điều khoản",["Khi tạo tài khoản, đăng nhập hoặc sử dụng Vocab Oasis (“Dịch vụ”), bạn đồng ý bị ràng buộc bởi Điều khoản sử dụng này (“Điều khoản”) và Chính sách bảo mật của chúng tôi. Nếu không đồng ý, vui lòng không sử dụng Dịch vụ."]],["2. Về Dịch vụ",["Vocab Oasis là nền tảng trực tuyến giúp người dùng học và ôn tập từ vựng thông qua danh sách từ, thẻ ghi nhớ (flashcard), bài kiểm tra và các công cụ học tập liên quan. Dịch vụ được vận hành phi lợi nhuận, hoàn toàn miễn phí và không thu bất kỳ khoản phí nào; hiện chúng tôi chưa có kế hoạch cung cấp dịch vụ trả phí. Chúng tôi có thể thêm, thay đổi hoặc gỡ bỏ tính năng bất cứ lúc nào."]],["3. Điều kiện sử dụng và tài khoản",[["Bạn phải từ đủ 13 tuổi trở lên để sử dụng Dịch vụ. Nếu bạn chưa đủ tuổi thành niên theo quy định, bạn cần có sự đồng ý của cha mẹ hoặc người giám hộ hợp pháp.","Bạn phải cung cấp thông tin chính xác khi đăng ký và luôn cập nhật thông tin đó.","Bạn chịu trách nhiệm bảo mật mật khẩu và mọi hoạt động diễn ra trên tài khoản của mình. Hãy thông báo ngay cho chúng tôi nếu nghi ngờ tài khoản bị truy cập trái phép.","Mỗi người không được tạo nhiều tài khoản nhằm mục đích lạm dụng Dịch vụ."]]],["4. Quy tắc sử dụng",["Bạn đồng ý không:",["Sử dụng Dịch vụ cho mục đích bất hợp pháp, gây hại, gian lận hoặc lạm dụng;","Cố gắng tấn công, dò quét, làm quá tải, gây gián đoạn hoặc truy cập trái phép vào Dịch vụ, tài khoản hoặc máy chủ;","Dùng bot, công cụ thu thập dữ liệu hoặc công cụ tự động để lấy dữ liệu, nội dung từ Dịch vụ khi chưa có sự cho phép bằng văn bản của chúng tôi;","Tải lên mã độc, thư rác hoặc nội dung xúc phạm, thù ghét, khiêu dâm, hoặc xâm phạm quyền của người khác;","Sao chép, bán lại hoặc phân phối lại Dịch vụ hay nội dung của Dịch vụ vì mục đích thương mại khi chưa được phép."]]],["5. Nội dung học tập và quyền sở hữu trí tuệ",["Dịch vụ, bao gồm thiết kế, phần mềm, logo, danh sách từ vựng, câu ví dụ và các tài liệu khác, thuộc quyền sở hữu của Vocab Oasis hoặc các bên cấp phép và được bảo vệ bởi pháp luật về sở hữu trí tuệ. Chúng tôi cấp cho bạn quyền sử dụng có giới hạn, cá nhân, không độc quyền, không thể chuyển nhượng và có thể bị thu hồi để học tập phi thương mại."]],["6. Nội dung do người dùng tạo",["Nếu bạn tạo hoặc tải lên nội dung (ví dụ: danh sách từ riêng, ghi chú, bình luận), bạn vẫn giữ quyền sở hữu nội dung đó. Bạn cấp cho chúng tôi giấy phép không độc quyền, trên phạm vi toàn cầu, miễn phí để lưu trữ, hiển thị và xử lý nội dung đó chỉ nhằm vận hành và cải thiện Dịch vụ. Bạn chịu trách nhiệm đảm bảo nội dung của mình không vi phạm pháp luật hoặc quyền của bên thứ ba. Chúng tôi có thể gỡ bỏ nội dung vi phạm Điều khoản này."]],["7. Tính khả dụng và thay đổi",["Chúng tôi cố gắng duy trì Dịch vụ hoạt động nhưng không đảm bảo Dịch vụ luôn liên tục hoặc không có lỗi. Chúng tôi có thể tạm ngừng hoặc điều chỉnh Dịch vụ để bảo trì, cập nhật hoặc vì lý do khác, có hoặc không có thông báo trước."]],["8. Miễn trừ bảo đảm",["Dịch vụ được cung cấp trên cơ sở “nguyên trạng” và “như hiện có”, không kèm bất kỳ bảo đảm nào, dù rõ ràng hay ngụ ý. Chúng tôi không đảm bảo Dịch vụ đáp ứng mục tiêu học tập của bạn hoặc nội dung hoàn toàn chính xác, không có sai sót."]],["9. Giới hạn trách nhiệm",["Trong phạm vi tối đa mà pháp luật cho phép, Vocab Oasis cùng chủ sở hữu, thành viên và đối tác không chịu trách nhiệm đối với các thiệt hại gián tiếp, ngẫu nhiên, đặc biệt hoặc hệ quả, cũng như việc mất dữ liệu hoặc lợi nhuận phát sinh từ việc bạn sử dụng hoặc không thể sử dụng Dịch vụ."]],["10. Tạm ngừng và chấm dứt",["Bạn có thể ngừng sử dụng Dịch vụ và xóa tài khoản bất cứ lúc nào. Chúng tôi có thể tạm ngừng hoặc chấm dứt quyền truy cập của bạn nếu bạn vi phạm Điều khoản này hoặc theo yêu cầu của pháp luật, có hoặc không có thông báo trước."]],["11. Thay đổi điều khoản",["Chúng tôi có thể cập nhật Điều khoản này theo thời gian. Khi đó, chúng tôi sẽ cập nhật ngày “Cập nhật lần cuối” và, khi phù hợp, thông báo cho bạn trên Dịch vụ hoặc qua email. Việc bạn tiếp tục sử dụng sau khi thay đổi có hiệu lực đồng nghĩa với việc bạn chấp nhận Điều khoản đã cập nhật."]],["12. Luật áp dụng",["Điều khoản này được điều chỉnh bởi pháp luật nước Cộng hòa Xã hội Chủ nghĩa Việt Nam. Mọi tranh chấp trước hết sẽ được giải quyết thông qua thương lượng thiện chí; nếu không thành, sẽ được đưa ra tòa án có thẩm quyền tại Việt Nam."]],["13. Liên hệ",["Nếu có câu hỏi về Điều khoản này, vui lòng liên hệ: bykendy.ng@gmail.com."]]]},"en":{"title":"Terms of Use","sub":"Vocab Oasis | Last updated: October 25, 2026","updated":"Last updated: October 25, 2026","sections":[["1. Acceptance of Terms",["By creating an account, logging in, or using Vocab Oasis (the “Service”), you agree to be bound by these Terms of Use (“Terms”) and our Privacy Policy. If you do not agree, please do not use the Service."]],["2. About the Service",["Vocab Oasis is an online platform that helps users learn and review vocabulary through word lists, flashcards, quizzes, and related learning tools. The Service is operated on a non-profit basis, is free to use, and does not charge any fees; we currently have no plans to introduce paid services. We may add, change, or remove features at any time."]],["3. Eligibility and Accounts",[["You must be at least 13 years old to use the Service. If you are under the age of majority in your country, you must have permission from a parent or legal guardian.","You must provide accurate information when registering and keep it up to date.","You are responsible for keeping your password confidential and for all activity under your account. Notify us immediately if you suspect unauthorized access.","One person may not maintain multiple accounts for the purpose of abusing the Service."]]],["4. Acceptable Use",["You agree not to:",["Use the Service for any unlawful, harmful,
